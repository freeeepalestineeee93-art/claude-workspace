<title>تايملاين أعمالي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: editor's workspace. Sidebar (views + platforms) | main column: day header, today's track
   (clips sized by time, playhead at progress), then the active view. Task details open in a side sheet. */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --surface-3:#EBEDF2; --line:#DDE0E7; --line-2:#C8CCD6;
  --fg:#151821; --muted:#5A6070; --faint:#8C92A1;
  --accent:#B45F00; --accent-soft:#FCEEDB; --accent-ink:#FFFFFF;
  --danger:#C1333C; --danger-soft:#FBE4E5; --ok:#1D8757; --ok-soft:#DFF3E8; --warn:#9C6710; --warn-soft:#F9EDD6;
  --s-received:#4B67D1; --s-working:#B45F00; --s-review:#7650D4; --s-revision:#C93A5B; --s-approved:#0C8583; --s-delivered:#1D8757;
  --shadow:0 1px 2px rgb(20 24 40 / .05), 0 10px 30px -16px rgb(20 24 40 / .22);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1116; --surface:#171A21; --surface-2:#1D2129; --surface-3:#242933; --line:#282D38; --line-2:#363C49;
  --fg:#E9EBF1; --muted:#9AA1B0; --faint:#6C7382;
  --accent:#F2A83A; --accent-soft:#34260F; --accent-ink:#1B1306;
  --danger:#F0656E; --danger-soft:#381B1F; --ok:#4CC78E; --ok-soft:#14301F; --warn:#E6B659; --warn-soft:#33290F;
  --s-received:#8FA3FF; --s-working:#F2A83A; --s-review:#B89CFF; --s-revision:#FF7E99; --s-approved:#4FD1CF; --s-delivered:#4CC78E;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1116; --surface:#171A21; --surface-2:#1D2129; --surface-3:#242933; --line:#282D38; --line-2:#363C49;
  --fg:#E9EBF1; --muted:#9AA1B0; --faint:#6C7382;
  --accent:#F2A83A; --accent-soft:#34260F; --accent-ink:#1B1306;
  --danger:#F0656E; --danger-soft:#381B1F; --ok:#4CC78E; --ok-soft:#14301F; --warn:#E6B659; --warn-soft:#33290F;
  --s-received:#8FA3FF; --s-working:#F2A83A; --s-review:#B89CFF; --s-revision:#FF7E99; --s-approved:#4FD1CF; --s-delivered:#4CC78E;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
[data-s]{--sc:var(--s-received)}
[data-s="working"]{--sc:var(--s-working)} [data-s="review"]{--sc:var(--s-review)} [data-s="revision"]{--sc:var(--s-revision)}
[data-s="approved"]{--sc:var(--s-approved)} [data-s="delivered"]{--sc:var(--s-delivered)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
.side{position:sticky;top:calc(18px + env(safe-area-inset-top,0px));align-self:start;display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand svg{width:36px;height:36px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}
.newbtn{width:100%;justify-content:center;padding:11px 14px;font-size:.95rem}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:start;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none}
.nav button .n{margin-inline-start:auto;font-family:var(--f-mono);font-size:.74rem;background:var(--surface-3);border-radius:6px;padding:0 7px;color:var(--muted)}
.nav button:hover{background:var(--surface);color:var(--fg)}
.nav button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.nav button.on svg{color:var(--accent)}
.sidehead{font-size:.72rem;font-weight:700;color:var(--faint);letter-spacing:.04em;padding:0 12px 6px}
.pfl{display:grid;gap:2px}
.pfl button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:start;font-size:.9rem;white-space:nowrap}
.pfl button:hover{background:var(--surface);color:var(--fg)}
.pfl button.on{background:var(--fg);color:var(--bg)}
.pfl button .n{margin-inline-start:auto;font-family:var(--f-mono);font-size:.74rem;opacity:.75}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--faint));flex:none;display:inline-block}
.main{display:grid;gap:20px;min-width:0;align-content:start}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--fg);background:var(--surface-2);border-color:transparent}
.btn.small{padding:5px 11px;font-size:.82rem;border-radius:8px}
.btn.danger{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 45%,transparent)}
.btn.sbtn{background:color-mix(in oklab,var(--sc) 12%,var(--surface));border-color:color-mix(in oklab,var(--sc) 40%,transparent);color:var(--sc)}
.btn.sbtn:hover:not(:disabled){border-color:var(--sc)}
.btn.sbtn.solid{background:var(--sc);border-color:var(--sc);color:var(--surface)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:9px;color:var(--muted);flex:none}
.iconbtn:hover:not(:disabled){background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:18px;height:18px}

/* ---------- day header ---------- */
.dayhead{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.dayname{font-family:var(--f-display);font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.daysub{color:var(--muted);margin-top:4px;font-size:.95rem}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 9px;font-weight:700;font-size:.8rem;margin-inline-end:8px}
.datenav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.datenav .pill{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-weight:700;font-size:.86rem}
.datenav .pill.on{background:var(--accent);color:var(--accent-ink)}
.datenav input{border:0;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-size:.82rem;min-width:0}

.stats{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
.ring{display:grid;place-items:center;position:relative;width:104px;height:92px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .v b{font-family:var(--f-mono);font-size:1.05rem}
.ring .v small{display:block;color:var(--muted);font-size:.64rem;margin-top:2px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;align-content:space-between;gap:4px;min-width:0}
.stat small{color:var(--muted);font-size:.78rem;font-weight:600}
.stat b{font-family:var(--f-mono);font-size:1.45rem;font-weight:700;line-height:1.1}
.stat .sub{font-size:.72rem;color:var(--faint)}
.stat.s b{color:var(--sc)}

/* ---------- track ---------- */
.trackbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--shadow)}
.trackhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.trackhead h2{margin:0;font-size:.95rem;font-weight:700}
.trackhead span{color:var(--muted);font-size:.78rem}
.ruler{position:relative;height:18px;border-bottom:1px solid var(--line);margin-bottom:6px;direction:ltr}
.ruler i{position:absolute;bottom:0;height:5px;border-inline-start:1px solid var(--line-2)}
.ruler i.major{height:10px}
.ruler em{position:absolute;top:-2px;font-style:normal;font-family:var(--f-mono);font-size:.66rem;color:var(--faint);transform:translateX(-50%)}
.track{position:relative;height:48px;background:var(--surface-2);border-radius:9px;direction:ltr;overflow:hidden}
.clips{position:absolute;inset:5px 0;display:flex;gap:2px;padding-inline:2px}
.clip{position:relative;height:100%;border-radius:6px;overflow:hidden;background:color-mix(in oklab,var(--c) 20%,var(--surface));border:1px solid color-mix(in oklab,var(--c) 55%,transparent);min-width:10px;cursor:pointer;flex:none}
.clip .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in oklab,var(--c) 58%,var(--surface))}
.clip span{position:relative;display:block;padding:4px 7px;font-size:.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:right}
.clip.dim{opacity:.6}
.cap{position:absolute;top:0;bottom:0;width:0;border-inline-start:2px dashed var(--danger);opacity:.75}
.cap b{position:absolute;top:3px;left:5px;font-size:.62rem;color:var(--danger);white-space:nowrap;font-weight:700}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);transition:left .5s ease}
.playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--accent)}
.trackfoot{display:flex;justify-content:space-between;margin-top:8px;font-size:.78rem;color:var(--muted);gap:10px;flex-wrap:wrap}
.trackempty{height:48px;display:grid;place-items:center;color:var(--faint);font-size:.85rem;background:var(--surface-2);border-radius:9px;text-align:center;padding-inline:12px}

/* ---------- alerts ---------- */
.alerts{display:grid;gap:8px}
.alerts:empty{display:none}
.alert{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:11px;padding:9px 13px;font-size:.9rem;border:1px solid transparent}
.alert.danger{background:var(--danger-soft);border-color:color-mix(in oklab,var(--danger) 28%,transparent)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 28%,transparent)}
.alert.info{background:var(--surface);border-color:var(--line)}
.alert .ic{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;font-weight:700;font-size:.8rem;flex:none}
.alert.danger .ic{background:var(--danger);color:var(--surface)} .alert.warn .ic{background:var(--warn);color:var(--surface)} .alert.info .ic{background:var(--accent-soft);color:var(--accent)}
.alert .txt{flex:1;min-width:200px}
.linkish{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;font-weight:600}
.linkish:hover{text-decoration-color:currentColor}
.sample{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:11px;padding:10px 13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.sample p{margin:0;flex:1;min-width:220px}

/* ---------- quick add ---------- */
.quick{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.quick input,.quick select{border:0;background:var(--surface-2);border-radius:9px;padding:9px 11px;min-width:0}

/* ---------- sections + cards ---------- */
.section{display:grid;gap:10px}
.sechead{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sechead h3{margin:0;font-size:.9rem;color:var(--fg);font-weight:700;display:flex;gap:8px;align-items:center}
.sechead h3 .n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);background:var(--surface-3);border-radius:6px;padding:0 7px}
.sechead p{margin:0;color:var(--faint);font-size:.8rem;flex-basis:100%}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:grid;gap:9px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--line-2)}
.card.running{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.card.late{border-color:color-mix(in oklab,var(--danger) 45%,var(--line))}
.crow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-width:0}
.crow.top{justify-content:space-between}
.pf{display:inline-flex;gap:7px;align-items:center;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.pf b{color:var(--fg);font-weight:600}
.ttl{font-weight:700;font-size:1.02rem;line-height:1.4;overflow-wrap:anywhere}
.spill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 11px;font-size:.78rem;font-weight:700;color:var(--sc);background:color-mix(in oklab,var(--sc) 13%,var(--surface));white-space:nowrap}
.spill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.badge{border-radius:6px;padding:1px 8px;font-size:.75rem;font-weight:600;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.rev{background:color-mix(in oklab,var(--s-revision) 13%,var(--surface));color:var(--s-revision)}
.days{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);font-weight:600}
.days .seg{display:inline-flex;gap:2px}
.days .seg i{width:12px;height:6px;border-radius:2px;background:var(--line)}
.days .seg i.past{background:var(--faint)}
.days .seg i.cur{background:var(--accent)}
.stepper{display:flex;gap:3px;direction:rtl}
.stepper i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stepper i.on{background:var(--sc)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cfoot .acts{display:flex;gap:6px;flex-wrap:wrap}
.timer{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 9px 4px 7px;font-size:.78rem}
.timer svg{width:13px;height:13px}
.timer.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);font-size:.92rem}
.empty b{display:block;color:var(--fg);font-size:1rem;margin-bottom:4px}
.rollover{display:flex;justify-content:center}

/* ---------- board ---------- */
.boardwrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;min-width:1240px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.86rem;display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--sc)}
.col h4 .n{font-family:var(--f-mono);color:var(--faint);font-size:.76rem}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px;display:grid;gap:7px;cursor:pointer}
.mini:hover{border-color:var(--line-2)}
.mini .t{font-weight:700;font-size:.9rem;overflow-wrap:anywhere;line-height:1.4}
.mini .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.74rem;color:var(--muted)}

/* ---------- week gantt ---------- */
.weekhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.weekhead b{font-size:1rem}
.ganttwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.gantt{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));min-width:760px;position:relative}
.gcol{grid-row:1 / -1;border-inline-start:1px solid var(--line)}
.gcol:first-child{border-inline-start:0}
.gcol.today{background:color-mix(in oklab,var(--accent) 6%,transparent)}
.ghd{padding:10px 10px 8px;border-bottom:1px solid var(--line);display:grid;gap:5px;cursor:pointer;text-align:start;background:none;border-top:0;border-inline:0}
.ghd:hover{background:var(--surface-2)}
.ghd .h{display:flex;justify-content:space-between;gap:4px;align-items:baseline}
.ghd .h b{font-size:.85rem}
.ghd .h span{font-family:var(--f-mono);font-size:.72rem;color:var(--faint);white-space:nowrap}
.ghd .h{flex-wrap:wrap}
.ghd.today .h b{color:var(--accent)}
.load{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.load i{display:block;height:100%;background:var(--ok)}
.load.over i{background:var(--danger)}
.ghd .lbl{font-size:.7rem;color:var(--muted);font-family:var(--f-mono)}
.gbar{margin:4px 4px;border-radius:8px;padding:5px 9px;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer;background:color-mix(in oklab,var(--c) 18%,var(--surface));border:1px solid color-mix(in oklab,var(--c) 50%,transparent);position:relative;z-index:1}
.gbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gbar .st{margin-inline-start:auto;flex:none;width:8px;height:8px;border-radius:50%;background:var(--sc)}
.gbar.done{opacity:.55}
.gbar.cont-s{border-start-start-radius:2px;border-end-start-radius:2px}
.gbar.cont-e{border-start-end-radius:2px;border-end-end-radius:2px}
.gempty{grid-column:1/-1;padding:24px;text-align:center;color:var(--faint);font-size:.88rem;position:relative;z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--sc)}

/* ---------- platforms ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.pcard .h{display:flex;gap:8px;align-items:center}
.pcard .h input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:3px 7px;font-weight:700;font-size:1.05rem}
.pcard .h input:hover,.pcard .h input:focus{border-color:var(--line-2);background:var(--surface-2)}
.pnums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pnums div{background:var(--surface-2);border-radius:9px;padding:7px 9px;min-width:0}
.pnums small{display:block;color:var(--muted);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnums b{font-family:var(--f-mono);font-size:1.05rem}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.sw.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--surface)}
.confirm{font-size:.75rem;color:var(--danger);border:1px solid var(--danger);background:var(--danger-soft);border-radius:8px;padding:4px 9px;font-weight:700;white-space:nowrap}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.settings label{font-size:.9rem;font-weight:600}
.settings input{width:84px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:6px 9px;font-family:var(--f-mono)}
.hint{font-size:.76rem;color:var(--faint)}

/* ---------- sheet (task details) ---------- */
dialog.sheet{margin:0;margin-inline-start:auto;height:100%;max-height:100%;width:min(540px,100vw);border:0;border-inline-start:1px solid var(--line);border-radius:0;background:var(--surface);color:var(--fg);padding:0;box-shadow:-20px 0 60px -20px rgb(0 0 0 / .35)}
dialog.sheet[open]{animation:slide .22s ease}
@keyframes slide{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
dialog.sheet::backdrop{background:rgb(10 12 18 / .5)}
.sh{display:flex;flex-direction:column;height:100%}
.shhead{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.shtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.shtop .k{font-size:.8rem;color:var(--muted);font-weight:600}
.shtitle{width:100%;border:1px solid transparent;background:transparent;border-radius:9px;padding:4px 8px;margin-inline:-8px;font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.35;resize:none;min-height:0}
.shtitle:hover,.shtitle:focus{border-color:var(--line-2);background:var(--surface-2)}

.shfoot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.block{display:grid;gap:10px}
.block h4{margin:0;font-size:.78rem;color:var(--faint);font-weight:700;letter-spacing:.03em}
.statusbox{border:1px solid color-mix(in oklab,var(--sc) 35%,var(--line));background:color-mix(in oklab,var(--sc) 7%,var(--surface));border-radius:var(--r);padding:12px;display:grid;gap:10px}
.statusbox .now{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.field{display:grid;gap:4px;min-width:0;align-content:start}
.field.full{grid-column:1/-1}
.field label{font-size:.78rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:8px 10px;min-width:0}
.field textarea{min-height:74px;resize:vertical}
.field .ro{border:1px dashed var(--line-2);border-radius:9px;padding:8px 10px;color:var(--muted);font-size:.9rem;min-height:40px}
.presets{display:flex;gap:4px;flex-wrap:wrap}

.hist .pt{width:22px;height:22px;border-radius:50%;background:color-mix(in oklab,var(--sc) 18%,var(--surface));border:2px solid var(--sc);position:relative;z-index:1}
.hist li:last-child .pt{background:var(--sc)}
.hist .hb{display:grid;gap:5px;min-width:0}
.hist .hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.hist .hr b{color:var(--sc);font-size:.92rem}
.hist .hr .dur{font-size:.72rem;color:var(--faint)}
.hist input[type=datetime-local]{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 7px;font-family:var(--f-mono);font-size:.78rem;min-width:0}
.hist textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:.85rem;min-height:40px;resize:vertical;width:100%}
.hist .x{width:26px;height:26px}
.timebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r);padding:10px 12px}
.timebox .big{font-family:var(--f-mono);font-size:1.3rem;font-weight:700}
.timebox .of{color:var(--muted);font-size:.85rem}

/* ---------- toasts ---------- */
.toasts{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:50;padding-inline:16px}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:.9rem;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:520px;animation:up .25s ease}
.toast.rem{background:var(--accent);color:var(--accent-ink);font-weight:600}
.toast button{border:0;background:rgb(127 127 127 / .25);color:inherit;border-radius:6px;padding:2px 8px;font-size:.8rem}
@keyframes up{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .shell{grid-template-columns:1fr;gap:16px}
  .side{position:static;grid-template-columns:1fr auto;align-items:center;gap:12px}
  .newbtn{width:auto}
  .nav,.pfwrap{grid-column:1/-1}
  .nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
  .pfwrap .sidehead{display:none}
  .pfl{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none}

}

  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ring{grid-column:1/-1;width:100%;height:auto;padding:8px;grid-template-columns:auto 1fr;justify-items:start;gap:12px}
  .ring svg{width:60px;height:60px}
  .ring .v{position:static;display:block;text-align:start}
  .quick{grid-template-columns:1fr 1fr}
  .quick input{grid-column:1/-1}
  .quick .btn{grid-column:1/-1;justify-content:center}
  .fgrid{grid-template-columns:1fr}
  .datenav{width:100%;justify-content:space-between}
}

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const KINDS = {
  video:  {name:"فيديو",          verb:"قيد المونتاج"},
  reel:   {name:"ريلز / شورت",    verb:"قيد المونتاج"},
  design: {name:"تصميم",          verb:"قيد التصميم"},
  thumb:  {name:"ثمبنيل / غلاف",  verb:"قيد التصميم"},
  motion: {name:"موشن جرافيك",    verb:"قيد التحريك"},
  other:  {name:"مهمة أخرى",       verb:"قيد العمل"}
};
const ST_ORDER = ["received","working","review","revision","approved","delivered"];
const ST_NAME = {received:"تم الاستلام",working:null,review:"بانتظار الاعتماد",revision:"قيد التعديل",approved:"تم الاعتماد",delivered:"تم التسليم"};
const ST_HINT = {received:"استلمت الشغل وما بلّشت فيه",working:"شغّال عليه هلّق",review:"بعتّه وناطر رد",revision:"طلبوا تعديلات",approved:"انقبل، ضايل تسليم النسخة النهائية",delivered:"خلص وتسلّم"};
const ST_P = {received:.05,working:.4,review:.75,revision:.55,approved:.9,delivered:1};
const ST_STEP = {received:1,working:2,review:3,revision:3,approved:4,delivered:5};
const NEXT = {
  received:[["working","ابدأ الشغل"]],
  working:[["review","بعتّه للمراجعة"]],
  review:[["approved","تم الاعتماد"],["revision","طلبوا تعديلات"]],
  revision:[["review","بعتّ التعديل"]],
  approved:[["delivered","تم التسليم"]],
  delivered:[]
};
const ACT = new Set(["received","working","revision","approved"]);
const COLORS = ["#7C6CF2","#E9892B","#1FA5C9","#E4577E","#3BAA6E","#C04BD6","#5B7FE0","#B39A1C"];
const PRIO = {3:"عالية",2:"متوسطة",1:"منخفضة"};
const LS_KEY = "timeline-work-v2";
const LOC = "ar-SY-u-nu-latn";
const fmtDay = new Intl.DateTimeFormat(LOC,{weekday:"long"});
const fmtLong = new Intl.DateTimeFormat(LOC,{day:"numeric",month:"long",year:"numeric"});
const fmtShort = new Intl.DateTimeFormat(LOC,{day:"numeric",month:"short"});
const fmtDT = new Intl.DateTimeFormat(LOC,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});

/* ---------- state ---------- */
const state = { tasks:{}, platforms:{}, settings:{capacity:360}, day:todayKey(), tab:"day", filter:"all" };
let db=null, readOnly=false;
const writeQ={}, pendingDelete=new Set(), remindedKeys=new Set();
let sheet = {id:null, draft:null, focusNote:false};

/* ---------- date helpers ---------- */
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return keyOf(new Date()); }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
function diffDays(a,b){ return Math.round((parseKey(a)-parseKey(b))/864e5); }
function weekStart(k){ const d=parseKey(k); d.setDate(d.getDate()-((d.getDay()+1)%7)); return keyOf(d); }
function relName(k){ const n=diffDays(k,todayKey()); return n===0?"اليوم":n===1?"بكرة":n===-1?"مبارح":n>1?"بعد "+n+" أيام":"قبل "+(-n)+" أيام"; }
function toLocalInput(ms){ const d=new Date(ms); return keyOf(d)+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fromLocalInput(v){ const t=new Date(v).getTime(); return isNaN(t)?null:t; }
function tc(min){ min=Math.max(0,Math.round(min)); return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }
function tcSec(sec){ sec=Math.max(0,Math.floor(sec)); return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,"0")).join(":"); }
function human(ms){ const m=Math.round(ms/6e4); if(m<60) return m+" د"; const h=Math.round(m/60); if(h<48) return h+" س"; const d=Math.floor(h/24), r=h%24; return d+" يوم"+(r?" و"+r+" س":""); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function plural(n,one,few,many){ return n===1?one:n===2?"2 "+few.replace(/ات$/,"تين"):(n>2&&n<11?n+" "+few:n+" "+many); }

/* ---------- task model ---------- */
function normalize(id,raw){
  const t={...raw,id};
  if(!Array.isArray(t.log)||!t.log.length){
    const at=t.createdAt>1e6?t.createdAt:Date.now();
    t.log=[{s:"received",at}];
    if(t.stage!=null){ if(t.stage>=5||t.doneAt) t.log.push({s:"delivered",at:t.doneAt||at}); else if(t.stage>0) t.log.push({s:"working",at}); }
  }
  t.date=t.date||todayKey(); t.end=t.end&&t.end>=t.date?t.end:t.date;
  t.kind=KINDS[t.kind]?t.kind:"other";
  return t;
}
function statusOf(t){ return t.log[t.log.length-1].s; }
function stName(s,kind){ return s==="working"?(KINDS[kind]||KINDS.other).verb:ST_NAME[s]; }
function receivedAt(t){ const e=t.log.find(x=>x.s==="received"); return e?e.at:t.log[0].at; }
function deliveredAt(t){ for(let i=t.log.length-1;i>=0;i--) if(t.log[i].s==="delivered") return t.log[i].at; return null; }
function revisions(t){ return t.log.filter(x=>x.s==="revision").length; }
function span(t){ return diffDays(t.end,t.date)+1; }
function share(t){ return Math.max(10,(+t.est||0)/span(t)); }
function prog(t){ return ST_P[statusOf(t)]; }
function spentMin(t){ return (t.spent||0)+(t.timerStart?(Date.now()-t.timerStart)/6e4:0); }
function colorOf(t){ const p=state.platforms[t.platform]; return p?p.color:"#8C92A1"; }
function pName(t){ const p=state.platforms[t.platform]; return p?p.name:"بدون منصة"; }
function allTasks(){ return Object.values(state.tasks); }
function passFilter(t){ return state.filter==="all"||t.platform===state.filter; }
function isLate(t){ return ACT.has(statusOf(t)) && t.end<todayKey(); }
function sortTasks(a,b){
  return ((b.priority||2)-(a.priority||2)) || ((a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0) || (a.date<b.date?-1:a.date>b.date?1:0) || (receivedAt(a)-receivedAt(b));
}
function dueBadge(t){
  if(!t.due || statusOf(t)==="delivered") return "";
  const n=diffDays(t.due,todayKey()), tm=t.dueTime?` ${t.dueTime}`:"";
  if(n<0) return `<span class="badge danger">فات التسليم بـ ${-n} يوم</span>`;
  if(n===0) return `<span class="badge warn">التسليم اليوم<span class="mono">${tm}</span></span>`;
  if(n===1) return `<span class="badge warn">التسليم بكرة<span class="mono">${tm}</span></span>`;
  return `<span class="badge">التسليم ${fmtShort.format(parseKey(t.due))}<span class="mono">${tm}</span></span>`;
}
function daysBadge(t,k){
  const n=span(t);
  if(isLate(t)){ const o=diffDays(todayKey(),t.end); return `<span class="badge danger">متأخّر ${o} يوم عن خطة الشغل</span>`; }
  if(n<2) return "";
  const i=Math.min(n,Math.max(1,diffDays(k,t.date)+1));
  const seg=[...Array(Math.min(n,14))].map((_,j)=>`<i class="${j+1<i?"past":j+1===i?"cur":""}"></i>`).join("");
  return `<span class="days"><span class="seg">${seg}</span>اليوم ${i} من ${n}</span>`;
}

/* ---------- persistence ---------- */
function loadLocal(){
  try{ const j=JSON.parse(localStorage.getItem(LS_KEY)||"null");
    if(j){ state.tasks=Object.fromEntries(Object.entries(j.tasks||{}).map(([id,t])=>[id,normalize(id,t)])); state.platforms=j.platforms||{}; state.settings={...state.settings,...(j.settings||{})}; }
  }catch(e){}
}
function saveLocal(){ if(db) return; try{ localStorage.setItem(LS_KEY,JSON.stringify({tasks:state.tasks,platforms:state.platforms,settings:state.settings})); }catch(e){} }
function onWriteErr(e){
  if(e&&e.code==="invalid_argument"){ readOnly=true; render(); toast("ما عندك صلاحية تعديل هالصفحة، التغيير ما انحفظ."); }
  else if(e&&e.code==="quota_exceeded") toast("امتلأت مساحة التخزين. احذف أعمال قديمة مسلّمة لتفضّي مكان.");
  else toast("تعذّر الحفظ. تأكد من الاتصال وجرّب مرة ثانية.");
}
function clean(o){ const c=JSON.parse(JSON.stringify(o)); delete c.id; delete c.stage; delete c.doneAt; return c; }
function write(col,id,data){
  if(col==="settings") state.settings=data; else state[col][id]= col==="tasks"?normalize(id,data):data;
  render();
  if(db){ const k=col+"/"+id; writeQ[k]=(writeQ[k]||Promise.resolve()).then(()=>db.doc(k).set(col==="tasks"?clean(data):data)).catch(onWriteErr); }
  else saveLocal();
}
function remove(col,id){
  delete state[col][id]; render();
  if(db){ const k=col+"/"+id; writeQ[k]=(writeQ[k]||Promise.resolve()).then(()=>db.doc(k).delete()).catch(onWriteErr); }
  else saveLocal();
}
function patchTask(id,patch){ const t=state.tasks[id]; if(t) write("tasks",id,{...t,...patch}); }

async function connectDb(){
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){ db=null; }
  if(!db) return;
  state.tasks={}; state.platforms={};
  db.collection("tasks").onSnapshot(s=>{ state.tasks=Object.fromEntries(s.docs.map(d=>[d.id,normalize(d.id,d.data())])); render(); },()=>{});
  db.collection("platforms").onSnapshot(s=>{ state.platforms=Object.fromEntries(s.docs.map(d=>[d.id,{...d.data()}])); render(); renderSelects(); },()=>{});
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists){ state.settings={...state.settings,...s.data()}; render(); } },()=>{});
  render();
}

/* ---------- day lists ---------- */
function dayLists(k){
  const tk=todayKey(), all=allTasks().filter(passFilter);
  const inRange=t=>t.date<=k&&k<=t.end;
  const late = k===tk ? all.filter(isLate).sort(sortTasks) : [];
  const work = all.filter(t=>ACT.has(statusOf(t))&&inRange(t)).sort(sortTasks);
  const waiting = all.filter(t=>statusOf(t)==="review"&&(k===tk?t.date<=k:inRange(t))).sort(sortTasks);
  const deliv = all.filter(t=>{ const d=deliveredAt(t); return statusOf(t)==="delivered"&&d&&keyOf(new Date(d))===k; }).sort((a,b)=>deliveredAt(b)-deliveredAt(a));
  return {late,work,waiting,deliv};
}

function renderStats(){

  const p=tot?done/tot:0, C=2*Math.PI*30;
  const remain=[...L.late,...L.work].reduce((s,t)=>s+share(t)*(1-prog(t)),0);

    <div class="stat s" data-s="working"><small>شغل اليوم</small><b>${L.work.length+L.late.length}</b><span class="sub">${rev?rev+" منها تعديلات":"&nbsp;"}</span></div>

function renderAlerts(){
  if(state.tab!=="day"){ $("alerts").innerHTML=""; return; }
  const tk=todayKey(), out=[], all=allTasks().filter(t=>statusOf(t)!=="delivered");
  const names=arr=>arr.slice(0,3).map(t=>`<button class="linkish" data-act="open" data-id="${t.id}">${esc(t.title)}</button>`).join("، ")+(arr.length>3?` و${arr.length-3} غيرها`:"");
  const late=all.filter(t=>t.due&&t.due<tk), today=all.filter(t=>t.due===tk), tom=all.filter(t=>t.due===addDays(tk,1));
  if(late.length) out.push(`<div class="alert danger"><span class="ic">!</span><span class="txt">فات موعد التسليم: ${names(late)}</span></div>`);
  if(today.length) out.push(`<div class="alert warn"><span class="ic">◷</span><span class="txt">لازم تتسلّم اليوم: ${names(today)}</span></div>`);
  if(tom.length) out.push(`<div class="alert info"><span class="ic">→</span><span class="txt">تسليم بكرة: ${names(tom)}</span></div>`);
  const now=new Date(), hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const rem=all.filter(t=>t.remind&&t.date<=tk&&tk<=t.end&&t.remind>=hm).sort((a,b)=>a.remind<b.remind?-1:1);
  if(rem.length && state.day===tk) out.push(`<div class="alert info"><span class="ic">⏰</span><span class="txt">تذكيرات اليوم: ${rem.slice(0,4).map(t=>`<span class="mono">${t.remind}</span> <button class="linkish" data-act="open" data-id="${t.id}">${esc(t.title)}</button>`).join(" · ")}</span></div>`);
  $("alerts").innerHTML=out.join("");
}
function trackTasks(L){
  const inRangeDone=allTasks().filter(passFilter).filter(t=>statusOf(t)!=="review"&&!ACT.has(statusOf(t))&&t.date<=state.day&&state.day<=t.end);
  const m=new Map(); [...L.late,...L.work,...L.waiting.filter(t=>t.date<=state.day&&state.day<=t.end),...inRangeDone].forEach(t=>m.set(t.id,t));
  return [...m.values()];
}
function renderTrack(){
  const L=dayLists(state.day), ts=trackTasks(L).sort((a,b)=>ST_STEP[statusOf(b)]-ST_STEP[statusOf(a)]);
  const cap=Math.max(30,+state.settings.capacity||360);
  $("trackNote").textContent=ts.length?"كل كليب بطول وقت شغله اليوم، والمؤشّر يمشي مع إنجازك":`طاقتك اليومية ${tc(cap)}`;
  if(!ts.length){ $("track").innerHTML=`<div class="trackempty">التايملاين فاضي. أضف عمل وحدّد وقته ومدّته لينبني هون.</div>`; return; }
  const total=ts.reduce((s,t)=>s+share(t),0), scale=Math.max(total,cap)*1.04, step=scale>600?120:60;
  let ruler=""; for(let m=0;m<=scale;m+=step/2){ const x=m/scale*100, major=m%step===0; ruler+=`<i class="${major?"major":""}" style="left:${x}%"></i>`+(major&&x<95?`<em style="left:${Math.max(3,x)}%">${tc(m)}</em>`:""); }
  const clips=ts.map(t=>`<div class="clip ${ACT.has(statusOf(t))?"":"dim"}" style="--c:${colorOf(t)};width:calc(${share(t)/scale*100}% - 2px)" data-act="open" data-id="${t.id}" title="${esc(t.title)} — ${esc(stName(statusOf(t),t.kind))} — ${tc(share(t))}"><div class="fill" style="width:${prog(t)*100}%"></div><span>${esc(t.title)}</span></div>`).join("");
  const doneMin=ts.reduce((s,t)=>s+share(t)*prog(t),0);
  $("track").innerHTML=`<div class="ruler">${ruler}</div><div class="track"><div class="clips">${clips}</div><div class="cap" style="left:${cap/scale*100}%"><b style="${cap/scale>.75?"left:auto;right:5px":""}">حدّ اليوم</b></div><div class="playhead" style="left:calc(${doneMin/scale*100}% + 2px)"></div></div>
   <div class="trackfoot"><span>المخطّط لليوم <b class="mono">${tc(total)}</b> من طاقتك <b class="mono">${tc(cap)}</b></span>${total>cap?`<span style="color:var(--danger);font-weight:700">اليوم محمّل زيادة بـ <span class="mono">${tc(total-cap)}</span>، فكّر تأجّل شي</span>`:`<span>متاح لك <b class="mono">${tc(cap-total)}</b> إضافية</span>`}</div>`;
}

function section(title,n,items,k,hint,extra=""){

function viewWeek(){

      ${readOnly?"":pd?`<button class="confirm" data-act="pdel" data-id="${id}">تأكيد الحذف</button>`:`<button class="iconbtn" data-act="pdel" data-id="${id}" aria-label="حذف المنصة">${I.trash}</button>`}</div>
      <div class="pnums"><div><small>شغل مفتوح</small><b>${open.length}</b></div><div><small>تسلّم هالشهر</small><b>${delMonth}</b></div><div><small>بانتظار اعتماد</small><b>${open.filter(t=>statusOf(t)==="review").length}</b></div>
      <div><small>متوسط التسليم</small><b style="font-size:.9rem">${avg==null?"—":human(avg)}</b></div><div><small>تعديلات / عمل</small><b>${revAvg.toFixed(1)}</b></div><div><small>متأخّر</small><b style="${open.filter(isLate).length?"color:var(--danger)":""}">${open.filter(isLate).length}</b></div></div>
      ${readOnly?"":`<div class="swatches">${COLORS.map(c=>`<button class="sw ${c===p.color?"on":""}" style="--c:${c}" data-act="pcolor" data-id="${id}" data-c="${c}" aria-label="لون"></button>`).join("")}</div>`}</div>`;}).join("");
  return `${readOnly?"":`<form class="quick" id="pform" style="grid-template-columns:minmax(0,1fr) auto"><input id="p-new" placeholder="أضف منصة أو عميل جديد…" aria-label="اسم المنصة"><button class="btn primary" type="submit">أضف منصة</button></form>`}
    ${ps.length?`<div class="pgrid">${cards}</div>`:`<div class="empty"><b>ما في منصات بعد</b>أضف المنصات اللي بتشتغل معها، وكل وحدة بتاخد لون خاص.</div>`}
    <div class="settings"><label for="s-cap">ساعات شغلك باليوم</label><input type="number" id="s-cap" min="1" max="16" step="0.5" value="${(+state.settings.capacity||360)/60}" ${readOnly?"disabled":""}><span class="hint">منها بينحسب «حدّ اليوم» على التايملاين وتنبيه الضغط بجدول الأسبوع.</span></div>`;
}

/* ---------- sheet (details / new) ---------- */
const dlg=$("sheet");
function openSheet(id,opts={}){
  sheet={id:id||null, draft:id?null:{title:"",platform:$("q-platform").value||"",kind:$("q-kind").value||"video",date:state.day,end:state.day,due:"",dueTime:"",priority:2,est:120,remind:"",link:"",notes:"",initStatus:"received",receivedAt:Date.now()}, focusNote:!!opts.focusNote};
  renderSheet();
  if(!dlg.open){ dlg.showModal?dlg.showModal():dlg.setAttribute("open",""); }
  setTimeout(()=>{ if(sheet.focusNote){ const n=dlg.querySelector("textarea[data-h]:last-of-type"); const all=dlg.querySelectorAll("textarea[data-h]"); (all[all.length-1]||n)?.focus(); } else if(!id) $("d-title")?.focus(); },40);
}
function platformOptions(v){ return `<option value="">بدون منصة</option>`+sortedPlatforms().map(([id,p])=>`<option value="${id}" ${id===v?"selected":""}>${esc(p.name)}</option>`).join(""); }
function kindOptions(v){ return Object.entries(KINDS).map(([id,k])=>`<option value="${id}" ${id===v?"selected":""}>${k.name}</option>`).join(""); }
function renderSheet(){
  const isNew=!sheet.id, t=isNew?sheet.draft:state.tasks[sheet.id];
  if(!t){ dlg.close(); return; }
  const dis=readOnly?"disabled":"";
  const s=isNew?t.initStatus:statusOf(t);
  let statusBlock, histBlock="";
  if(isNew){
    statusBlock=`<div class="block"><h4>الحالة والاستلام</h4><div class="fgrid">
      <div class="field"><label for="d-init">الحالة الحالية</label><select id="d-init">${ST_ORDER.filter(x=>x!=="delivered").map(x=>`<option value="${x}" ${x===s?"selected":""}>${stName(x,t.kind)}</option>`).join("")}</select></div>
      <div class="field"><label for="d-received">تاريخ ووقت الاستلام</label><input type="datetime-local" id="d-received" value="${toLocalInput(t.receivedAt)}"></div></div></div>`;
  } else {
    const rv=revisions(t);
    statusBlock=`<div class="statusbox" data-s="${s}"><div class="now"><b>${esc(stName(s,t.kind))}</b><small>${esc(ST_HINT[s])}${rv?` · ${rv===1?"تعديل واحد":rv+" تعديلات"}`:""}</small></div>
      ${readOnly?"":`<div class="acts">${NEXT[s].map(([to,l],i)=>`<button class="btn small sbtn ${i===0?"solid":""}" data-s="${to}" data-act="status" data-id="${t.id}" data-to="${to}">${l}</button>`).join("")}
      <select id="d-setstatus" aria-label="غيّر الحالة يدوياً"><option value="">غيّر الحالة يدوياً…</option>${ST_ORDER.filter(x=>x!==s).map(x=>`<option value="${x}">${stName(x,t.kind)}</option>`).join("")}</select></div>`}</div>`;
    let prev=null;
    histBlock=`<div class="block"><h4>سجلّ المراحل (بتقدر تعدّل التاريخ والوقت)</h4><ol class="hist">${t.log.map((e,i)=>{
      const dur=prev!=null?`<span class="dur">بعد ${human(e.at-prev)}</span>`:""; prev=e.at;
      const showNote=e.s==="revision"||e.note;
      return `<li data-s="${e.s}"><span class="pt"></span><div class="hb"><div class="hr"><b>${esc(stName(e.s,t.kind))}</b>${dur}</div>
        <div class="hr"><input type="datetime-local" data-hat="${i}" value="${toLocalInput(e.at)}" aria-label="تاريخ ووقت ${esc(stName(e.s,t.kind))}" ${dis}>${i>0&&!readOnly?`<button class="iconbtn x" data-act="hdel" data-i="${i}" title="احذف هالخطوة من السجل" aria-label="حذف">${I.x}</button>`:""}</div>
        ${showNote?`<textarea data-h="${i}" placeholder="${e.s==="revision"?"شو التعديلات المطلوبة؟":"ملاحظة"}" ${dis}>${esc(e.note||"")}</textarea>`:""}</div></li>`;}).join("")}</ol></div>`;
  }
  const running=!isNew&&!!t.timerStart;
  dlg.querySelector("#sheetInner").innerHTML=`
    <div class="shhead"><div class="shtop"><span class="k">${isNew?"عمل جديد":`<span class="pf"><span class="dot" style="--c:${colorOf(t)}"></span>${esc(pName(t))} · ${KINDS[t.kind].name}</span>`}</span><button class="iconbtn" data-act="close" aria-label="إغلاق">${I.close}</button></div>
      <textarea class="shtitle" id="d-title" rows="1" placeholder="اسم العمل" ${dis}>${esc(t.title)}</textarea></div>
    <div class="shbody">
      ${statusBlock}
      <div class="block"><h4>المنصة والنوع</h4><div class="fgrid">
        <div class="field"><label for="d-platform">المنصة</label><select id="d-platform" ${dis}>${platformOptions(t.platform)}</select></div>
        <div class="field"><label for="d-kind">نوع العمل</label><select id="d-kind" ${dis}>${kindOptions(t.kind)}</select></div></div></div>
      <div class="block"><h4>المواعيد</h4><div class="fgrid">
        ${isNew?"":`<div class="field"><label>تاريخ ووقت الاستلام</label><div class="ro mono">${fmtDT.format(receivedAt(t))}</div></div>
        <div class="field"><label>تاريخ ووقت التسليم</label><div class="ro mono">${deliveredAt(t)?fmtDT.format(deliveredAt(t)):"لسا ما تسلّم"}</div></div>`}
        <div class="field"><label for="d-date">بلّش شغل فيه يوم</label><input type="date" id="d-date" value="${t.date}" ${dis}></div>
        <div class="field"><label for="d-end">لخلّص الشغل يوم</label><input type="date" id="d-end" value="${t.end}" ${dis}><div class="presets" id="spanPresets">${[1,2,3,5,7].map(n=>`<button type="button" data-span="${n}">${n===1?"يوم":n===2?"يومين":n+" أيام"}</button>`).join("")}</div></div>
        <div class="field"><label for="d-due">الموعد المطلوب للتسليم</label><input type="date" id="d-due" value="${t.due||""}" ${dis}></div>
        <div class="field"><label for="d-dueTime">الساعة</label><input type="time" id="d-dueTime" value="${t.dueTime||""}" ${dis}></div>
        <div class="field"><label for="d-priority">الأولوية</label><select id="d-priority" ${dis}>${[3,2,1].map(p=>`<option value="${p}" ${+t.priority===p?"selected":""}>${PRIO[p]}</option>`).join("")}</select></div>
        <div class="field"><label for="d-remind">تذكير الساعة (بأيام الشغل)</label><input type="time" id="d-remind" value="${t.remind||""}" ${dis}></div></div></div>
      <div class="block"><h4>الوقت</h4>
        <div class="field"><label for="d-est">الوقت الكلي المتوقّع (دقائق)</label><input type="number" id="d-est" min="0" step="15" value="${t.est||0}" ${dis}>
          <div class="presets" id="estPresets">${[30,60,120,240,480,960].map(m=>`<button type="button" data-m="${m}">${tc(m)}</button>`).join("")}</div>
          <span class="hint" id="perDay">${span(t)>1?`يعني تقريباً ${tc((+t.est||0)/span(t))} باليوم على ${span(t)} أيام`:"&nbsp;"}</span></div>
        ${isNew?"":`<div class="timebox"><span class="big" data-live="${t.id}">${running?tcSec(spentMin(t)*60):tc(spentMin(t))}</span><span class="of">شغل فعلي من ${tc(+t.est||0)}</span>
          ${statusOf(t)!=="delivered"&&!readOnly?`<button class="btn small ${running?"primary":""}" data-act="timer" data-id="${t.id}">${running?I.pause+"إيقاف":I.play+"ابدأ المؤقّت"}</button>`:""}</div>`}</div>
      <div class="block"><h4>الملفات والملاحظات</h4>
        <div class="field"><label for="d-link">رابط الملفات</label><div style="display:flex;gap:6px"><input id="d-link" type="url" dir="ltr" placeholder="https://drive.google.com/…" value="${esc(t.link||"")}" ${dis}>${t.link?`<a class="btn small" href="${esc(t.link)}" target="_blank" rel="noopener">فتح ${I.link}</a>`:""}</div></div>
        <div class="field"><label for="d-notes">ملاحظات / البريف</label><textarea id="d-notes" placeholder="تفاصيل الطلب، المقاسات، الموسيقى، الشعار…" ${dis}>${esc(t.notes||"")}</textarea></div></div>
      ${histBlock}
    </div>
    <div class="shfoot">${isNew
      ?`<button class="btn ghost" data-act="close">إلغاء</button><button class="btn primary" data-act="create">إضافة العمل</button>`
      :`${readOnly?"":pendingDelete.has(t.id)?`<button class="confirm" data-act="del" data-id="${t.id}">اضغط مرة ثانية للتأكيد</button>`:`<button class="btn small danger" data-act="del" data-id="${t.id}">${I.trash}حذف العمل</button>`}<span class="hint">التعديلات بتنحفظ تلقائياً</span><button class="btn" data-act="close">تم</button>`}</div>`;
  autoGrow($("d-title"));
}
function autoGrow(el){ if(!el) return; el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
dlg.addEventListener("input",e=>{ if(e.target.id==="d-title") autoGrow(e.target); });
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close();
  const sp=e.target.closest("[data-span]"); if(sp){ const n=+sp.dataset.span, st=$("d-date").value||state.day; $("d-end").value=addDays(st,n-1); $("d-end").dispatchEvent(new Event("change",{bubbles:true})); }
  const em=e.target.closest("[data-m]"); if(em){ $("d-est").value=em.dataset.m; $("d-est").dispatchEvent(new Event("change",{bubbles:true})); }
});
dlg.addEventListener("close",()=>{ sheet={id:null,draft:null}; });
const FIELD={"d-title":"title","d-platform":"platform","d-kind":"kind","d-date":"date","d-end":"end","d-due":"due","d-dueTime":"dueTime","d-priority":"priority","d-est":"est","d-remind":"remind","d-link":"link","d-notes":"notes"};
dlg.addEventListener("change",e=>{
  const el=e.target;
  if(readOnly) return;
  if(!sheet.id){ // draft
    const d=sheet.draft;
    if(el.id==="d-init") d.initStatus=el.value;
    else if(el.id==="d-received") d.receivedAt=fromLocalInput(el.value)||d.receivedAt;
    else if(FIELD[el.id]) d[FIELD[el.id]]= ["priority","est"].includes(FIELD[el.id])?+el.value:el.value.trim?el.value.trim():el.value;
    if(el.id==="d-date"&&d.end<d.date){ d.end=d.date; $("d-end").value=d.end; }
    if(el.id==="d-end"&&d.end<d.date){ d.end=d.date; $("d-end").value=d.end; }
    if(el.id==="d-kind"){ const sel=$("d-init"), v=sel.value; sel.innerHTML=ST_ORDER.filter(x=>x!=="delivered").map(x=>`<option value="${x}">${stName(x,d.kind)}</option>`).join(""); sel.value=v; }
    updatePerDay(d); return;
  }
  const id=sheet.id, t=state.tasks[id]; if(!t) return;
  if(el.id==="d-setstatus"&&el.value){ setStatus(id,el.value); return; }
  if(el.dataset.hat!=null){ const i=+el.dataset.hat, at=fromLocalInput(el.value); if(at){ const log=t.log.map(x=>({...x})); log[i].at=at; patchTask(id,{log}); renderSheet(); } return; }
  if(el.dataset.h!=null){ const i=+el.dataset.h, log=t.log.map(x=>({...x})); log[i].note=el.value.trim(); patchTask(id,{log}); return; }
  const f=FIELD[el.id]; if(!f) return;
  let v=["priority","est"].includes(f)?Math.max(0,+el.value||0):el.value.trim();
  if(f==="title"&&!v){ el.value=t.title; return; }
  const patch={[f]:v};
  if(f==="date"&&t.end<v) patch.end=v;
  if(f==="end"&&v<t.date){ patch.end=t.date; }
  if(f==="date"&&!v) return;
  patchTask(id,patch);
  if(["platform","kind","date","end","est","link"].includes(f)) renderSheet(); else updatePerDay(state.tasks[id]);
});
function updatePerDay(t){ const el=$("perDay"); if(!el) return; const n=diffDays(t.end,t.date)+1; el.innerHTML=n>1?`يعني تقريباً ${tc((+t.est||0)/n)} باليوم على ${n} أيام`:"&nbsp;"; }
function createFromDraft(){
  const d=sheet.draft; const title=($("d-title").value||"").trim();
  if(!title){ $("d-title").focus(); toast("اكتب اسم العمل أولاً"); return; }
  const now=Date.now(), rec=d.receivedAt||now;
  const log=[{s:"received",at:rec}]; if(d.initStatus!=="received") log.push({s:d.initStatus,at:Math.max(rec,now)});
  const id=uid();
  write("tasks",id,{title,platform:d.platform,kind:d.kind,date:d.date,end:d.end<d.date?d.date:d.end,due:d.due,dueTime:d.dueTime,priority:d.priority,est:d.est,spent:0,timerStart:null,remind:d.remind,link:d.link,notes:d.notes,log,createdAt:now});
  dlg.close(); toast(`انضاف «${title}»`);
}

/* ---------- actions ---------- */
function setStatus(id,to){
  const t=state.tasks[id]; if(!t||statusOf(t)===to) return;
  const log=[...t.log.map(x=>({...x})),{s:to,at:Date.now()}];
  const patch={log};
  if(to==="delivered"&&t.timerStart){ patch.spent=(t.spent||0)+(Date.now()-t.timerStart)/6e4; patch.timerStart=null; }
  patchTask(id,patch);
  if(to==="delivered") toast(`يعطيك العافية! «${t.title}» تسلّم ✓`);
  else if(to==="revision"){ openSheet(id,{focusNote:true}); return; }
  else toast(`«${t.title}»: ${stName(to,t.kind)}`);
  if(sheet.id===id) renderSheet();
}
function toggleTimer(id){
  const t=state.tasks[id]; if(!t) return;
  if(t.timerStart){ patchTask(id,{spent:(t.spent||0)+(Date.now()-t.timerStart)/6e4,timerStart:null}); }
  else {
    for(const o of allTasks()) if(o.timerStart&&o.id!==id) write("tasks",o.id,{...o,spent:(o.spent||0)+(Date.now()-o.timerStart)/6e4,timerStart:null});
    const patch={timerStart:Date.now()}; if(statusOf(t)==="received") patch.log=[...t.log.map(x=>({...x})),{s:"working",at:Date.now()}];
    patchTask(id,patch);
  }
  if(sheet.id===id) renderSheet();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  if(e.target.closest("a")) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act!=="open") e.stopPropagation();
  const safe=["open","filter","goto","week","close"];
  if(readOnly&&!safe.includes(act)) return;
  switch(act){
    case "open": if(b.tagName!=="ARTICLE"||!e.target.closest("button")) openSheet(id); break;
    case "close": dlg.close(); break;
    case "create": createFromDraft(); break;
    case "status": setStatus(id,b.dataset.to); break;
    case "timer": toggleTimer(id); break;
    case "hdel": { const t=state.tasks[sheet.id], i=+b.dataset.i; if(t&&i>0){ patchTask(t.id,{log:t.log.filter((_,j)=>j!==i).map(x=>({...x}))}); renderSheet(); } break; }
    case "del":
      if(pendingDelete.has(id)){ pendingDelete.delete(id); dlg.close(); remove("tasks",id); toast("انحذف العمل"); }
      else { pendingDelete.add(id); renderSheet(); setTimeout(()=>{ if(pendingDelete.delete(id)&&sheet.id===id) renderSheet(); },4000); }
      break;
    case "filter": state.filter=id; render(); break;
    case "goto": state.day=id; state.tab="day"; saveTab(); render(); break;
    case "week": state.day= +id===0?todayKey():addDays(state.day,+id); render(); break;
    case "carry-today": { const tk=todayKey(); const ls=allTasks().filter(isLate); ls.forEach(t=>patchTask(t.id,{end:tk})); toast(`انمدّت ${ls.length} لليوم`); break; }
    case "roll": { const k=state.day, nk=addDays(k,1); const ls=dayLists(k).work.filter(t=>t.end===k); ls.forEach(t=>patchTask(t.id, t.date===k?{date:nk,end:nk}:{end:nk})); toast(`تأجّلت ${ls.length} لـ ${relName(nk)}. يعطيك العافية!`); break; }
    case "clear-samples": allTasks().filter(t=>t.sample).forEach(t=>remove("tasks",t.id)); toast("انحذفت الأمثلة. التايملاين جاهز لشغلك."); break;
    case "pcolor": write("platforms",id,{...state.platforms[id],color:b.dataset.c}); renderSelects(); break;
    case "pdel": { const k="p:"+id;
      if(pendingDelete.has(k)){ pendingDelete.delete(k); remove("platforms",id); renderSelects(); toast("انحذفت المنصة. أعمالها صارت «بدون منصة»."); }
      else { pendingDelete.add(k); render(); setTimeout(()=>{ if(pendingDelete.delete(k)) render(); },4000); } break; }
  }
});
document.addEventListener("change",e=>{
  const el=e.target; if(dlg.contains(el)) return;
  if(el.dataset&&el.dataset.act==="pname"){ const v=el.value.trim(); if(v&&v!==state.platforms[el.dataset.id]?.name){ write("platforms",el.dataset.id,{...state.platforms[el.dataset.id],name:v}); renderSelects(); } }
  if(el.id==="s-cap"){ const h=Math.max(1,Math.min(16,+el.value||6)); write("settings","main",{...state.settings,capacity:Math.round(h*60)}); }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="pform") return; e.preventDefault();
  const v=$("p-new").value.trim(); if(!v) return;
  const used=Object.values(state.platforms).map(p=>p.color), color=COLORS.find(c=>!used.includes(c))||COLORS[0];
  write("platforms",uid(),{name:v,color,order:Date.now()}); renderSelects(); toast(`انضافت «${v}»`);
});
$("quick").addEventListener("submit",e=>{
  e.preventDefault(); if(readOnly) return;
  const title=$("q-title").value.trim(); if(!title) return;
  const platform=$("q-platform").value, kind=$("q-kind").value, days=+$("q-days").value||1;
  try{ localStorage.setItem(LS_KEY+":lastPlatform",platform); }catch(err){}
  const est={thumb:30,reel:90,design:90,video:240,motion:240,other:60}[kind]*Math.min(days,3);
  write("tasks",uid(),{title,platform,kind,date:state.day,end:addDays(state.day,days-1),due:"",dueTime:"",priority:2,est,spent:0,timerStart:null,remind:"",link:"",notes:"",log:[{s:"received",at:Date.now()}],createdAt:Date.now()});
  $("q-title").value=""; $("q-title").focus();
  toast("انضاف. اضغط عليه لتضيف موعد التسليم والملاحظات.");
});
function saveTab(){ try{ localStorage.setItem(LS_KEY+":tab",state.tab); }catch(e){} }
$("prevDay").onclick=()=>{ state.day=addDays(state.day,state.tab==="week"?-7:-1); render(); };
$("nextDay").onclick=()=>{ state.day=addDays(state.day,state.tab==="week"?7:1); render(); };
$("todayBtn").onclick=()=>{ state.day=todayKey(); render(); };
$("datePick").onchange=e=>{ if(e.target.value){ state.day=e.target.value; render(); } };
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; saveTab(); render(); });
$("newTask").onclick=()=>openSheet(null);

/* ---------- toasts, live timers, reminders ---------- */
function toast(msg,kind){
  const el=document.createElement("div"); el.className="toast"+(kind?" "+kind:"");
  el.innerHTML=`<span>${esc(msg)}</span><button type="button">تمام</button>`;
  el.querySelector("button").onclick=()=>el.remove();
  $("toasts").appendChild(el); setTimeout(()=>el.remove(),kind==="rem"?60000:3400);
}
function tickLive(){ document.querySelectorAll("[data-live]").forEach(el=>{ const t=state.tasks[el.dataset.live]; if(t&&t.timerStart) el.textContent=tcSec(spentMin(t)*60); }); }
function checkReminders(){
  const now=new Date(), tk=todayKey(), nm=now.getHours()*60+now.getMinutes();
  for(const t of allTasks()){
    if(!t.remind||!(t.date<=tk&&tk<=t.end)||!ACT.has(statusOf(t))) continue;
    const [h,m]=t.remind.split(":").map(Number), rm=h*60+m, key=t.id+tk+t.remind;
    if(nm>=rm&&nm-rm<=10&&!remindedKeys.has(key)){ remindedKeys.add(key); toast(`⏰ حان وقت: ${t.title}`,"rem"); }
  }
}
setInterval(tickLive,1000);
setInterval(()=>{ checkReminders(); renderAlerts(); },30000);

/* ---------- boot ---------- */
loadLocal();
try{ const tb=localStorage.getItem(LS_KEY+":tab"); if(tb&&["day","board","week","platforms"].includes(tb)) state.tab=tb; }catch(e){}
renderSelects(); render(); checkReminders();
connectDb();
})();
</script>
