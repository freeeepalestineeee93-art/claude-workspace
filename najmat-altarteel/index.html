<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="لعبة تعليمية ممتعة للأطفال لتعلّم أحكام التجويد: ١٥ محطة، ألعاب فقاعات وذاكرة وسلال وتحديات.">
<meta name="theme-color" content="#18204E">
<meta property="og:title" content="نجمات الترتيل — لعبة تعلّم التجويد للأطفال">
<meta property="og:description" content="رحلة مضيئة مع هدى وسنا لتعلّم أحكام التجويد باللعب.">
<meta property="og:image" content="icon-512.png">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نجمات الترتيل">
<title>نجمات الترتيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Lalezar&display=swap">
<style>
:root{
  --sky1:#18204E; --sky2:#33307A; --sky3:#6B4A9E; --sky4:#A8568F;
  --card:#FFFBF3; --card2:#FFF1DC; --line:#EFDCC0;
  --ink:#2B2350; --muted:#6E6690;
  --amber:#FFB53D; --amberD:#D98300; --amberL:#FFE3A6;
  --pink:#FF6FA0; --pinkD:#D14578; --pinkL:#FFD3E2;
  --mint:#34C7A8; --mintD:#16917A;
  --violet:#8D7BF2; --violetD:#6352C8;
  --ok:#1E9E62; --bad:#E0484D;
  --f-ui:"Baloo Bhaijaan 2","Noto Sans Arabic",Tahoma,sans-serif;
  --f-disp:"Lalezar","Baloo Bhaijaan 2",Tahoma,sans-serif;
  --f-q:"Amiri Quran","Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 80%,var(--sky4) 100%) fixed;color:var(--ink);font-family:var(--f-ui);font-size:17px;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3s ease-in-out infinite}
#sky .moon{position:absolute;top:22px;left:22px;width:54px;height:54px;border-radius:50%;box-shadow:-12px 8px 0 0 #FFE3A6;transform:rotate(-20deg);opacity:.9}
@keyframes tw{50%{opacity:.15}}
#app{position:relative;z-index:1;max-width:580px;margin:0 auto;padding-inline:16px;padding-block:14px 90px;min-height:100%;box-sizing:border-box}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.q{font-family:var(--f-q);line-height:2.1}
.hl{color:var(--pinkD)}
h1,h2,h3{text-wrap:balance;margin:0}

/* buttons */
.btn{border:0;border-radius:18px;padding:12px 22px;font-size:19px;font-weight:700;background:var(--amber);color:#3A2400;box-shadow:0 5px 0 var(--amberD);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--amberD)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pinkD)}
.btn.mint{background:var(--mint);color:#063B31;box-shadow:0 5px 0 var(--mintD)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.small{font-size:16px;padding:8px 14px;border-radius:14px}
.icon-btn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:14px;min-width:44px;height:44px;font-size:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding-inline:10px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{text-align:center}
.spacer{flex:1}

/* home */
.logo{text-align:center;color:#fff;padding-top:26px}
.logo .sub{font-size:16px;opacity:.85;letter-spacing:.3px}
.logo h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(52px,15vw,76px);line-height:1.1;color:var(--amberL);text-shadow:0 4px 0 #8A4B00,0 0 30px rgba(255,181,61,.45)}
.logo h1 span{color:var(--pinkL);text-shadow:0 4px 0 #9B2C57,0 0 30px rgba(255,111,160,.45)}
.logo p{margin:6px auto 0;max-width:30ch;font-size:17px;opacity:.95;line-height:1.6}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.pcard{border:0;background:var(--card);border-radius:28px;padding:16px 10px 18px;box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.pcard:hover{transform:translateY(-4px) rotate(-1deg)}
.pcard svg{width:min(120px,30vw);height:auto;animation:bob 3s ease-in-out infinite}
.pcard:nth-child(2) svg{animation-delay:-1.5s}
.pcard b{font-family:var(--f-disp);font-weight:400;font-size:32px;line-height:1.2}
.pcard small{color:var(--muted);font-size:15px}
@keyframes bob{50%{transform:translateY(-6px)}}
.home-foot{margin-top:28px;color:#fff;opacity:.8;font-size:14px;text-align:center;line-height:1.7}
.home-duel{margin-top:18px;display:flex;justify-content:center}

/* top bar */
.top{display:flex;align-items:center;gap:8px;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:8px;background:linear-gradient(180deg,var(--sky1) 70%,rgba(24,32,78,0))}
.top .me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}
.top .me svg{width:44px;height:44px}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}

/* map */
.map-hero{color:#fff;text-align:center;margin:8px 0 2px}
.map-hero h2{font-family:var(--f-disp);font-weight:400;font-size:30px;color:var(--amberL)}
.map-hero p{margin:2px 0 0;opacity:.85;font-size:15px}
.map{position:relative;padding:18px 0 30px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.st{position:relative;display:flex;flex-direction:column;align-items:center;width:150px;border:0;background:none;padding:0;margin-block:4px;margin-inline-start:calc(var(--x) - 75px)}
.st .lan{width:76px;height:100px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.st.cur .lan{animation:swing 2.2s ease-in-out infinite;transform-origin:50% 0}
.st.lock{cursor:not-allowed}
.st.lock .lbl{opacity:.6}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.st .lbl{background:var(--card);border-radius:14px;padding:3px 12px 5px;font-weight:700;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.2);text-align:center;line-height:1.35;max-width:150px}
.st .lbl small{display:block;color:#E8A200;letter-spacing:2px;font-size:14px}
.st.cur .lbl{background:var(--pink);color:#fff}
.st.cur .lbl small{color:#FFE3A6}
.st .here{position:absolute;top:-8px;inset-inline-end:8px;background:var(--pink);color:#fff;font-size:13px;border-radius:10px;padding:0 8px;font-weight:700}
.map-end{text-align:center;color:#fff;margin-top:6px;opacity:.9}

/* card surfaces */
.sheet{background:var(--card);border-radius:28px;padding:20px 18px;box-shadow:0 10px 0 rgba(0,0,0,.22)}
.head{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:12px}
.head h2{font-family:var(--f-disp);font-weight:400;font-size:26px;color:var(--amberL);line-height:1.2}
.head .step{margin-inline-start:auto;font-size:14px;opacity:.85}
.guide{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px}
.guide svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border-radius:20px 20px 20px 4px;padding:10px 14px;font-size:16px;line-height:1.55;box-shadow:0 4px 0 rgba(0,0,0,.18);position:relative}
.sl-t{font-family:var(--f-disp);font-weight:400;font-size:28px;color:var(--c,var(--pinkD));margin-bottom:6px}
.sl-p{font-size:18px;line-height:1.75;margin:6px 0}
.sl-p mark{background:var(--amberL);border-radius:6px;padding:0 4px;color:inherit}
.sl-list{margin:8px 0;padding-inline-start:0;list-style:none;display:grid;gap:8px;counter-reset:n}
.sl-list li{counter-increment:n;display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:14px;padding:8px 12px;font-size:17px;line-height:1.6}
.sl-list li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,var(--pink));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;margin-top:2px}
.big{font-size:30px;text-align:center;background:var(--card2);border-radius:18px;padding:4px 10px;margin:8px 0}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.lt{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-q);font-size:28px;background:var(--c);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:popin .4s both}
.mn{border:2px dashed var(--c,var(--amber));border-radius:18px;padding:6px 12px;text-align:center;margin:10px 0;background:#fff}
.mn small{display:block;color:var(--muted);font-size:14px}
.mn .q{font-size:24px}
.exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:10px 0}
.ex{background:#fff;border:2px solid var(--line);border-radius:14px;padding:2px 8px;text-align:center;font-size:23px}
.ex em{display:block;font-family:var(--f-ui);font-style:normal;font-size:13px;color:var(--muted);line-height:1.3;margin-top:-4px;padding-bottom:4px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.rule-chip{background:var(--c);color:#fff;border-radius:16px;padding:10px 8px;text-align:center;font-weight:700;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.18);line-height:1.4}
.rule-chip small{display:block;font-weight:500;font-size:14px;opacity:.95}
.tip{background:#FFF4D6;border-radius:16px;padding:10px 14px;margin-top:12px;font-size:16px;line-height:1.6;border-inline-start:6px solid var(--amber)}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:16px}
.tbl td{background:#fff;padding:6px 10px}
.tbl td:first-child{border-radius:0 12px 12px 0;font-weight:700;color:var(--c)}
.tbl td:last-child{border-radius:12px 0 0 12px;text-align:center;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:var(--amber);width:22px;border-radius:6px}

/* play */
.gprog{display:flex;gap:6px;flex:1;margin-inline:6px}
.gprog i{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.2)}
.gprog i.done{background:var(--mint)}
.gprog i.on{background:var(--amber)}
.gtitle{color:#fff;text-align:center;margin:4px 0 10px}
.gtitle h3{font-family:var(--f-disp);font-weight:400;font-size:25px;color:var(--amberL)}
.gtitle p{margin:0;opacity:.85;font-size:15px}
.cnt{color:#fff;text-align:center;font-size:14px;opacity:.8;margin-bottom:6px;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border-radius:26px;padding:16px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.22);min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.qq{font-size:19px;font-weight:700;margin:0;line-height:1.6}
.gtitle + .qq,#stage > .qq{color:#fff;text-align:center;margin-bottom:10px}
.qw{font-size:40px;line-height:1.9}
.qt{font-size:20px;font-weight:600;line-height:1.6;background:var(--card2);border-radius:14px;padding:8px 10px}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{border:0;background:#fff;border-radius:18px;padding:12px 10px;font-size:18px;font-weight:700;box-shadow:0 5px 0 #D8C9EE;line-height:1.45;min-height:58px;transition:transform .08s}
.opt.q{font-family:var(--f-q);font-weight:400;font-size:26px;line-height:1.7}
.opt:active{transform:translateY(3px)}
.opt.good{background:var(--ok);color:#fff;box-shadow:0 5px 0 #11734A}
.opt.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 #A12A2F}
.opt:disabled{cursor:default}
.baskets{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(var(--n),1fr)}
.basket{border:0;background:var(--c);color:#fff;border-radius:18px 18px 26px 26px;padding:12px 6px 10px;font-weight:700;font-size:17px;box-shadow:0 6px 0 rgba(0,0,0,.25);line-height:1.35;position:relative}
.basket b{display:block;font-size:13px;opacity:.95;font-weight:600}
.basket .n{position:absolute;top:-10px;inset-inline-start:-6px;background:#fff;color:var(--ink);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.basket.good{outline:4px solid #fff}
.basket.bad{filter:grayscale(.6)}
.basket:disabled{cursor:default}
.basket.bounce{animation:bounce .4s}
@keyframes bounce{40%{transform:translateY(-10px) scale(1.05)}}

.arena{position:relative;height:min(58vh,440px);border-radius:26px;background:radial-gradient(120% 80% at 50% 110%,rgba(255,111,160,.35),rgba(255,255,255,.06));overflow:hidden;border:2px solid rgba(255,255,255,.2);touch-action:manipulation}
.bub{position:absolute;left:0;top:0;border:0;border-radius:50%;padding:0;display:grid;place-items:center;font-size:32px;color:var(--ink);background:radial-gradient(circle at 32% 28%,#fff 0 12%,var(--bc,#CFE9FF) 45%,var(--bc2,#8DC7FF) 100%);box-shadow:inset -4px -6px 12px rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.18);font-family:var(--f-q);line-height:1;will-change:transform}
.bub.q{font-size:22px;line-height:1.5}
.bub.popped{animation:popout .3s forwards}
.bub.nope{background:radial-gradient(circle at 32% 28%,#fff 0 12%,#FFC1C3 45%,#F07C80 100%);animation:wob .4s}
@keyframes popout{to{scale:1.6;opacity:0}}
@keyframes wob{25%{rotate:-12deg}75%{rotate:12deg}}
.need{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;margin-bottom:10px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:14px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--pink));border-radius:8px;transition:width .3s}

.mem{display:grid;gap:10px;grid-template-columns:repeat(var(--cols),1fr)}
.mc{border:0;padding:0;background:none;aspect-ratio:3/3.6;max-width:100%;perspective:600px;position:relative}
.mc span{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .45s;padding:4px;box-sizing:border-box}
.mc .back{background:repeating-linear-gradient(45deg,var(--violet) 0 10px,var(--violetD) 10px 20px);color:var(--amberL);font-size:30px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.mc .front{background:#fff;transform:rotateY(180deg);font-weight:700;font-size:16px;line-height:1.35;box-shadow:0 5px 0 #D8C9EE}
.mc .front.q{font-weight:400;font-size:21px;line-height:1.6}
.mc.flip .back{transform:rotateY(-180deg)}
.mc.flip .front{transform:rotateY(0)}
.mc.matched .front{background:#DDF7EC;box-shadow:0 5px 0 var(--ok)}

.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--card);border-radius:22px;padding:14px;min-height:70px;box-shadow:0 8px 0 rgba(0,0,0,.22)}
.slot{min-width:54px;height:54px;border-radius:14px;border:2px dashed #CDBFE8;display:grid;place-items:center;font-family:var(--f-q);font-size:24px;padding-inline:8px;line-height:1.6}
.slot.filled{border:2px solid var(--mint);background:#E6FBF5;animation:popin .3s}
.slots.glow{box-shadow:0 0 0 5px var(--amber),0 8px 0 rgba(0,0,0,.22)}
.toks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.tok{border:0;background:#fff;border-radius:16px;min-width:56px;height:58px;padding-inline:14px;font-size:25px;box-shadow:0 5px 0 #D8C9EE;line-height:1.6}
.tok.used{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.pop-in{animation:popin .3s both}

.meter{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}
.meter i{width:26px;height:26px;border-radius:50%;background:var(--pinkL);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:var(--pinkD);animation:popin .3s both}
.meter span{font-weight:700;color:var(--muted);font-size:14px}

/* feedback sheet */
#fb{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
#fb .in{max-width:560px;width:100%;border-radius:24px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 -4px 30px rgba(0,0,0,.3);pointer-events:auto;animation:up .25s both}
#fb .in.ok{background:#E3F9EE;border:3px solid var(--ok)}
#fb .in.no{background:#FFF0F0;border:3px solid var(--bad)}
#fb svg{width:56px;height:56px;flex:none}
#fb .tx{flex:1;font-size:16px;line-height:1.55}
#fb .tx b{font-size:19px;display:block}
#fb .tx .q{font-size:22px}
@keyframes up{from{transform:translateY(120%)}}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:700;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}

/* result */
.res{text-align:center}
.res .stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.res .stars svg{width:70px;height:70px;animation:starin .5s both}
.res .stars svg:nth-child(2){animation-delay:.25s;transform:translateY(-10px)}
.res .stars svg:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.res h2{font-family:var(--f-disp);font-weight:400;font-size:34px;color:var(--pinkD)}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--card2);border-radius:18px;padding:8px 16px;margin-top:10px;font-weight:700}
.badge span{font-size:34px}

/* arcade */
.agrid{display:grid;gap:14px}
.acard{background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:0 8px 0 rgba(0,0,0,.22);display:grid;grid-template-columns:64px 1fr;gap:4px 12px;align-items:center}
.acard .ic{grid-row:span 2;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:var(--c)}
.acard h3{font-family:var(--f-disp);font-weight:400;font-size:23px;color:var(--ink)}
.acard p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.acard .lv{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.acard .lv .btn{flex:1;font-size:16px;padding:8px 6px}
.acard .best{grid-column:1/-1;font-size:14px;color:var(--muted);margin-top:4px}
.timer{font-variant-numeric:tabular-nums}
.duel-sc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.duel-sc .p{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:18px;padding:6px 10px;color:#fff;font-weight:700;transition:all .2s}
.duel-sc .p svg{width:40px;height:40px}
.duel-sc .p.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 4px var(--amber)}
.duel-sc .p b{font-size:24px;margin-inline-start:auto;font-variant-numeric:tabular-nums}
.duel-sc .vs{color:var(--amberL);font-family:var(--f-disp);font-size:22px}

/* treasures */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tb{background:var(--card);border-radius:20px;padding:10px 6px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:14px;font-weight:700;line-height:1.35}
.tb span{font-size:38px;display:block;line-height:1.3}
.tb.off{background:rgba(255,255,255,.12);color:rgba(255,255,255,.6);box-shadow:none}
.tb.off span{filter:grayscale(1) brightness(1.6);opacity:.35}
.tb small{display:block;color:#E8A200;letter-spacing:2px}

/* certificate */
.cert{background:var(--card);border-radius:24px;padding:10px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.cert .in{border:3px double var(--amber);border-radius:18px;padding:22px 16px;text-align:center;background:radial-gradient(circle at 50% 0,#FFF3D6,#FFFBF3 60%)}
.cert h2{font-family:var(--f-disp);font-weight:400;font-size:36px;color:var(--amberD)}
.cert .nm{font-family:var(--f-disp);font-size:52px;color:var(--pinkD);line-height:1.3}
.cert p{font-size:17px;line-height:1.8;margin:6px 0}
.cert svg{width:110px}

@media (max-width:380px){.qw{font-size:34px}.opt{font-size:16px}.basket{font-size:15px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

}

const fx=$('#fx'),fxc=fx.getContext('2d');let parts=[],fxRun=false;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}sizeFx();addEventListener('resize',sizeFx);
function burstAt(x,y,n=16,big){const cols=['#FFB53D','#FF6FA0','#34C7A8','#8D7BF2','#FFE3A6'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(big?7:4)+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(big?6:2),life:1,c:pick(cols),s:4+Math.random()*5,r:Math.random()*6,star:Math.random()<.4})}if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop)}}
function burst(el){const r=el.getBoundingClientRect();burstAt(r.left+r.width/2,r.top+r.height/2)}
function confetti(){for(let i=0;i<6;i++)setTimeout(()=>burstAt(Math.random()*innerWidth,innerHeight*.35,26,true),i*160)}
function fxLoop(){const d=devicePixelRatio;fxc.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.98;p.life-=.014;p.r+=.1;fxc.save();fxc.globalAlpha=Math.max(0,p.life);fxc.translate(p.x*d,p.y*d);fxc.rotate(p.r);fxc.fillStyle=p.c;if(p.star){fxc.beginPath();for(let k=0;k<10;k++){const rr=(k%2?p.s*.45:p.s)*d,aa=k*Math.PI/5;fxc.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}fxc.fill()}else fxc.fillRect(-p.s*d/2,-p.s*d/4,p.s*d,p.s*d/2);fxc.restore()});parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);if(parts.length)requestAnimationFrame(fxLoop);else{fxRun=false;fxc.clearRect(0,0,fx.width,fx.height)}}

function slideHTML(s,st){

  (s.p||[]).forEach(p=>h+=`<p class="sl-p">${p}</p>`);
  if(s.list)h+=`<ol class="sl-list" style="--c:${c}">${s.list.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>`;
  if(s.rules)h+=`<div class="rules">${s.rules.map(([n,cc])=>`<div class="rule-chip" style="--c:${cc}">${n}</div>`).join('')}</div>`;

  if(s.letters)h+=`<div class="letters">${s.letters.map((l,i)=>`<span class="lt" style="--c:${c};animation-delay:${i*.05}s">${l}</span>`).join('')}</div>`;

  if(s.ex)h+=`<div class="exs">${s.ex.map(e=>{const[w,n,cc]=Array.isArray(e)?e:[e,''];return`<div class="ex q">${qw(w,cc||c)}${n?`<em>${n}</em>`:''}</div>`}).join('')}</div>`;

GAMES.pop=(el,g,ctx,next)=>{
  el.innerHTML=`<p class="qq">${g.prompt}</p><div class="need"><div class="bar"><i id="pb"></i></div><span id="pn">${AR(0)} / ${AR(g.need)}</span></div><div class="arena" id="arena"></div>`;
  const A=$('#arena',el);let score=0,alive=true,last=0,spawnT=.2,raf,bubs=[];
  const speed=g.speed||40,every=g.every||1.05,cols=[['#CFE9FF','#8DC7FF'],['#FFE0EC','#FF9EC0'],['#E2DCFF','#AFA2FF'],['#D6F7EE','#7FDCC6'],['#FFF0CC','#FFD27A']];

    const b={d,x:Math.random()*Math.max(10,A.clientWidth-size),y:A.clientHeight+10,ok:g.targets.includes(txt),vy:speed*(.8+Math.random()*.5),ph:Math.random()*6,size};
    d.addEventListener('pointerdown',e=>{e.preventDefault();hit(b)});A.appendChild(d);bubs.push(b)}

  <p class="sl-p">أضأتِ فانوس «${st.name}» ${n<3?'<br>العبي مرة أخرى لتجمعي النجوم الثلاث ⭐':''}</p>
  ${!prev?`<div class="badge"><span>${st.badge[0]}</span>حصلتِ على شارة: ${st.badge[1]}</div>`:''}
  <div class="nav" style="flex-wrap:wrap">${st.final?'<button class="btn pink" id="cer">📜 استلمي شهادتك</button>':nxt!==null?'<button class="btn pink" id="nx">المحطة التالية ←</button>':''}<button class="btn ghost" style="color:var(--ink);background:var(--card2);box-shadow:0 5px 0 var(--line)" id="again">↻ مرة أخرى</button><button class="btn mint" id="mp">🗺️ الخريطة</button></div></div>`;
  bindTop();sfx('win');confetti();
  if($('#nx'))$('#nx').onclick=()=>go(()=>lesson(nxt,0));
  if($('#cer'))$('#cer').onclick=()=>go(certificate);
  $('#again').onclick=()=>go(()=>play(i));$('#mp').onclick=()=>go(map);
}

/* ============ ساحة الألعاب ============ */
const LV=[['🌱','سهل'],['🌙','متوسط'],['⭐','صعب']];
const poolFor=l=>POOL.filter(q=>q.si<=[6,10,99][l-1]);
function arcade(){
  const B=me().best;
  const G=[
   {id:'race',ic:'⏱️',c:'#FFE3A6',t:'سباق النجوم',d:'أجيبي عن أكبر عددٍ من الأسئلة قبل انتهاء الوقت!'},
   {id:'bub',ic:'🫧',c:'#CFE9FF',t:'فقاعات الحروف',d:'فرقعي حروف الحكم المطلوب قبل أن تطير.'},
   {id:'mem',ic:'🃏',c:'#E2DCFF',t:'ذاكرة الكنوز',d:'اقلبي البطاقات ووصّلي كل حكمٍ بمثاله.'},
   {id:'duel',ic:'⚔️',c:'#FFD3E2',t:'تحدّي الأختين',d:'هدى ضد سنا على جهاز واحد، بالتناوب. من تجمع نجومًا أكثر؟'}];
  app.innerHTML=topbar(true)+`<div class="head"><h2>🎮 ساحة الألعاب</h2></div><p style="color:#fff;margin:-4px 0 14px;opacity:.9">كل لعبة لها ثلاثة مستويات. المستوى السهل من المحطات الأولى، والصعب من كل الرحلة.</p>
  <div class="agrid">${G.map(x=>`<div class="acard"><div class="ic" style="--c:${x.c}">${x.ic}</div><h3>${x.t}</h3><p>${x.d}</p>
   <div class="lv">${LV.map((l,j)=>`<button class="btn small ${j===0?'mint':j===1?'':'pink'}" data-g="${x.id}" data-l="${j+1}">${l[0]} ${l[1]}</button>`).join('')}</div>
   ${x.id==='race'?`<div class="best">أفضل نتيجة: ${LV.map((l,j)=>`${l[1]} ${AR(B['race'+(j+1)]||0)}`).join(' · ')}</div>`:''}</div>`).join('')}</div>`;
  bindTop(()=>go(map));
  $$('.lv .btn').forEach(b=>b.onclick=()=>{const l=+b.dataset.l;sfx('tick');go(()=>({race,bub:bubbles,mem:memArc,duel})[b.dataset.g](l))});
}
function arcShell(title,sub){
  app.innerHTML=`<div class="top"><button class="icon-btn" id="back" aria-label="خروج">✕</button><span class="spacer"></span><span class="pill" id="hud"></span><button class="icon-btn" id="snd" aria-label="الصوت">${DB.sound?'🔊':'🔈'}</button></div><div class="gtitle"><h3>${title}</h3><p>${sub}</p></div><div id="stage"></div>`;
  bindTop(()=>go(arcade));return $('#stage');
}
function arcDone(title,msg,again){
  sfx('win');confetti();
  app.innerHTML=topbar()+`<div class="sheet res pop-in" style="margin-top:14px">${avatar(S.p,true).replace('<svg','<svg style="width:110px"')}<h2>${title}</h2><p class="sl-p">${msg}</p>
  <div class="nav"><button class="btn pink" id="ag">↻ العبي مرة أخرى</button><button class="btn mint" id="ar">🎮 الساحة</button></div></div>`;
  bindTop();$('#ag').onclick=()=>go(again);$('#ar').onclick=()=>go(arcade);
}
function race(l){
  const el=arcShell('⏱️ سباق النجوم',`المستوى: ${LV[l-1][1]}`);let time=[90,70,50][l-1],score=0,alive=true;const pool=shuffle(poolFor(l));let k=0;
  const hud=()=>$('#hud').innerHTML=`<span class="timer">⏱️ ${AR(time)}</span> · ⭐ ${AR(score)}`;hud();
  const iv=setInterval(()=>{time--;hud();if(time<=5&&time>0)sfx('tick');if(time<=0)end()},1000);
  cleanup=()=>{alive=false;clearInterval(iv)};
  function end(){if(!alive)return;alive=false;clearInterval(iv);cleanup=null;const B=me().best,key='race'+l,rec=score>(B[key]||0);if(rec)B[key]=score;save();go(()=>arcDone(`جمعتِ ${AR(score)} نجمة!`,rec?'🎉 رقمٌ قياسي جديد!':`أفضل نتيجة لكِ: ${AR(B[key])}`,()=>race(l)))}
  function one(){if(!alive)return;const it=pool[k++%pool.length];const qo=it.qopts;const opts=it.keep?it.opts.map((o,j)=>({o,ok:j===it.a})):shuffle(it.opts.map((o,j)=>({o,ok:j===(it.a||0)})));
    el.innerHTML=`<div class="qcard pop-in">${it.q?`<p class="qq">${it.q}</p>`:''}${it.w?`<div class="q qw">${qw(it.w,it.c)}</div>`:''}${it.t?`<div class="qt">${esc(it.t)}</div>`:''}</div><div class="opts ${opts.length===4?'g2':''}">${opts.map((x,j)=>`<button class="opt ${qo?'q':''}" data-ok="${x.ok?1:0}">${qo?qw(x.o):esc(x.o)}</button>`).join('')}</div>`;
    $$('.opt',el).forEach(b=>b.onclick=()=>{$$('.opt',el).forEach(x=>x.disabled=true);if(b.dataset.ok==='1'){score++;hud();b.classList.add('good');sfx('ok');burst(b);setTimeout(one,450)}else{b.classList.add('bad','shake');sfx('bad');$$('.opt',el).forEach(x=>{if(x.dataset.ok==='1')x.classList.add('good')});setTimeout(one,1300)}})}
  one();
}
function bubbles(l){
  const set=pick(LETTER_SETS);const el=arcShell('🫧 فقاعات الحروف',`المستوى: ${LV[l-1][1]}`);$('#hud').textContent=set.name;
  const ctx={mistakes:0,color:set.c};const need=[10,14,18][l-1];
  GAMES.pop(el,{prompt:`فرقعي ${set.name}: <span class="q" style="color:var(--amberL)">${set.t.join(' ')}</span>`,need,targets:set.t,others:ALL_LETTERS.filter(x=>!set.t.includes(x)),speed:[42,60,80][l-1],every:[1.05,.85,.68][l-1],hint:set.name+': '+set.t.join(' ')},ctx,()=>go(()=>arcDone('فرقعتِ كل الفقاعات!',`${AR(need)} حرفًا من ${set.name}${ctx.mistakes?` · أخطاء: ${AR(Math.round(ctx.mistakes*2))}`:' · بلا أي خطأ! 🌟'}`,()=>bubbles(l))));
}
function memArc(l){
  const n=[4,6,8][l-1];const src=shuffle(MEMPOOL.filter(x=>x.si<=[6,10,99][l-1]));const used=new Set(),pairs=[];
  for(const x of src){if(used.has(x.p[0]))continue;used.add(x.p[0]);pairs.push(x.p);if(pairs.length===n)break}
  const el=arcShell('🃏 ذاكرة الكنوز',`المستوى: ${LV[l-1][1]} · ${AR(pairs.length)} أزواج`);let t0=Date.now();
  const iv=setInterval(()=>$('#hud').textContent='⏱️ '+AR(Math.round((Date.now()-t0)/1000)),1000);cleanup=()=>clearInterval(iv);
  GAMES.memory(el,{pairs,n:pairs.length,color:C.madd},{mistakes:0,color:C.madd},()=>{clearInterval(iv);cleanup=null;const s=Math.round((Date.now()-t0)/1000);go(()=>arcDone('وجدتِ كل الكنوز!',`في ${AR(s)} ثانية ⏱️`,()=>memArc(l)))});
}
function duel(l){
  const rounds=10;const qs=shuffle(poolFor(l)).slice(0,rounds);const sc={huda:0,sana:0};let k=0;
  const el=arcShell('⚔️ تحدّي الأختين',`${AR(rounds)} أسئلة بالتناوب · المستوى: ${LV[l-1][1]}`);$('#back').onclick=()=>go(S.p?arcade:home);
  function one(){
    if(k>=rounds){const w=sc.huda>sc.sana?'huda':sc.sana>sc.huda?'sana':null;const back=()=>duel(l);
      sfx('win');confetti();
      app.innerHTML=`<div class="sheet res pop-in" style="margin-top:24px"><div class="row" style="justify-content:center">${avatar('huda',w!=='sana').replace('<svg','<svg style="width:90px"')}${avatar('sana',w!=='huda').replace('<svg','<svg style="width:90px"')}</div>
      <h2>${w?`فازت ${nm(w)}! 🏆`:'تعادل! كلتاكما بطلة 🤝'}</h2><p class="sl-p">هدى: ${AR(sc.huda)} ⭐ — سنا: ${AR(sc.sana)} ⭐<br>${w?`وأحسنتِ يا ${nm(w==='huda'?'sana':'huda')}، المرة القادمة لكِ! 💕`:''}</p>
      <div class="nav"><button class="btn pink" id="ag">↻ جولة جديدة</button><button class="btn mint" id="ar">${S.p?'🎮 الساحة':'🏠 الرئيسية'}</button></div></div>`;
      $('#ag').onclick=()=>go(back);$('#ar').onclick=()=>go(S.p?arcade:home);return}
    const turn=k%2?'sana':'huda';const it=qs[k];const qo=it.qopts;const opts=it.keep?it.opts.map((o,j)=>({o,ok:j===it.a})):shuffle(it.opts.map((o,j)=>({o,ok:j===(it.a||0)})));
    $('#hud').textContent=`سؤال ${AR(k+1)} / ${AR(rounds)}`;
    el.innerHTML=`<div class="duel-sc"><div class="p ${turn==='huda'?'on':''}">${avatar('huda')}هدى<b>${AR(sc.huda)}</b></div><span class="vs">ضد</span><div class="p ${turn==='sana'?'on':''}">${avatar('sana')}سنا<b>${AR(sc.sana)}</b></div></div>
    <p class="qq" style="color:#fff;text-align:center;margin-bottom:8px">الدور على: <span style="color:${PLAYERS[turn].c2}">${nm(turn)}</span></p>
    <div class="qcard pop-in">${it.q?`<p class="qq">${it.q}</p>`:''}${it.w?`<div class="q qw">${qw(it.w,it.c)}</div>`:''}${it.t?`<div class="qt">${esc(it.t)}</div>`:''}</div>
    <div class="opts ${opts.length===4?'g2':''}">${opts.map(x=>`<button class="opt ${qo?'q':''}" data-ok="${x.ok?1:0}">${qo?qw(x.o):esc(x.o)}</button>`).join('')}</div>`;
    $$('.opt',el).forEach(b=>b.onclick=()=>{$$('.opt',el).forEach(x=>x.disabled=true);k++;
      if(b.dataset.ok==='1'){sc[turn]++;b.classList.add('good');sfx('ok');burst(b);toast(`أحسنتِ يا ${nm(turn)}! ⭐`);setTimeout(one,1000)}
      else{b.classList.add('bad','shake');sfx('bad');$$('.opt',el).forEach(x=>{if(x.dataset.ok==='1')x.classList.add('good')});setTimeout(one,1700)}})}
  one();
}

/* ============ الكنوز والشهادة ============ */
function treasures(){
  app.innerHTML=topbar(true)+`<div class="head"><h2>🏆 كنوز ${nm()}</h2><span class="step">${AR(Object.keys(me().stars).length)} / ${AR(STATIONS.length)} شارة</span></div>
  <div class="tgrid">${STATIONS.map(s=>{const n=me().stars[s.id];return`<div class="tb ${n?'':'off'}"><span>${s.badge[0]}</span>${n?s.badge[1]:s.name}<small>${n?starsTxt(n):'🔒'}</small></div>`}).join('')}</div>
  ${me().stars.final?'<div class="nav"><button class="btn pink" id="cer">📜 شهادة نجمة الترتيل</button></div>':''}`;
  bindTop(()=>go(map));if($('#cer'))$('#cer').onclick=()=>go(certificate);
}
function certificate(){
  const d=new Date().toLocaleDateString('ar',{year:'numeric',month:'long',day:'numeric'});
  app.innerHTML=topbar(true)+`<div class="cert pop-in" style="margin-top:12px"><div class="in">${avatar(S.p,true)}
  <h2>شهادة نجمة الترتيل</h2><p>تُمنح هذه الشهادة للبطلة</p><div class="nm">${nm()}</div>
  <p>لإتمامها رحلة الفوانيس الخمسة عشر في مبادئ تجويد القرآن الكريم،<br>وجمعها <b>${AR(totalStars(S.p))}</b> نجمة من ${AR(STATIONS.length*3)}.</p>
  <div class="q" style="font-size:26px;color:var(--pinkD)">وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</div><p style="color:var(--muted);font-size:15px">${d}</p></div></div>`;
  bindTop(()=>go(map));sfx('win');confetti();
}

stars();home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
