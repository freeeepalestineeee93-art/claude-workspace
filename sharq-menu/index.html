<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو فروج الشرق</title>
<meta name="description" content="منيو مجمع فروج الشرق - مرسين | Şark Tavuk menüsü - Mersin">
<meta name="theme-color" content="#f5c516">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --yellow:#f5c516;
  --yellow-hi:#ffd83d;
  --yellow-deep:#d9a900;
  --on-yellow:#26220f;
  --char-950:#1c1c1e;
  --char-900:#242426;
  --char-800:#2f2f32;
  --char-700:#3b3b3f;
  --char-600:#4a4a4f;
  --text:#f7f4ea;
  --muted:#b5b1a6;
  --wa:#1fb855;
  --open:#5fd08a;
  --closed:#ff8a7a;
  --r:18px;
  --display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --bar-h:0px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--char-900);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(245,197,22,.045) 1.2px,transparent 1.3px);background-size:22px 22px}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}

/* ---------- Hero ---------- */
.hero{position:relative;background:var(--yellow);color:var(--on-yellow);overflow:hidden;padding-block:14px 64px}
.hero::before{content:"";position:absolute;inset:auto -10% -140px auto;width:420px;height:420px;border:34px solid var(--char-800);border-radius:50%;opacity:.12}
.hero::after{content:"";position:absolute;inset:-160px auto auto -120px;width:340px;height:340px;border:28px solid #fff;border-radius:50%;opacity:.18}
.topbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{font-family:var(--display);font-size:18px;line-height:1;opacity:.85}
.lang{display:inline-flex;background:var(--char-800);border-radius:999px;padding:4px;gap:2px}
.lang button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow)}
.brand{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:10px}
.logo{width:122px;height:122px;border-radius:50%;border:5px solid var(--char-800);box-shadow:0 10px 30px rgba(38,34,15,.28);background:var(--char-800)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,8vw,48px);line-height:1.1;margin:8px 0 0;text-wrap:balance}
.tagline{margin:0;font-weight:600;font-size:14px;opacity:.8}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--char-800);color:var(--text);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;border:0}
.pill svg{width:15px;height:15px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.is-open .dot{background:var(--open);box-shadow:0 0 0 3px rgba(95,208,138,.25)}
.is-closed .dot{background:var(--closed)}
.wave{position:absolute;inset:auto 0 -1px 0;height:46px;width:100%;display:block;z-index:1}

/* ---------- Category circles ---------- */
.cats{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 8px;margin-top:-30px;position:relative;z-index:3;scrollbar-width:none;max-width:1080px;margin-inline:auto}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:center}
.cat img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid var(--char-900);box-shadow:0 0 0 2px var(--yellow);background:var(--char-800);transition:transform .15s}
.cat:hover img{transform:translateY(-2px)}
.cat span{font-size:12px;font-weight:600;line-height:1.3;color:var(--text)}
@media (min-width:760px){.cats{justify-content:center;flex-wrap:wrap}}

/* ---------- Sticky bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(36,36,38,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--char-700);margin-top:10px}
.search{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--char-800);border:1px solid var(--char-600);border-radius:14px;padding-inline:12px}
.search:focus-within{border-color:var(--yellow)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding-block:10px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.clear{background:none;border:0;color:var(--muted);padding:4px;font-size:20px;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.more-end{-webkit-mask-image:linear-gradient(to var(--fade-dir,left),#000 84%,transparent);mask-image:linear-gradient(to var(--fade-dir,left),#000 84%,transparent)}
.chip{flex:none;padding:7px 15px;border-radius:999px;border:1px solid var(--char-600);background:var(--char-800);font-size:14px;font-weight:600;transition:background .15s,color .15s,border-color .15s}
.chip[aria-current="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
@media (min-width:760px){.chips{flex-wrap:wrap}.chips.more-end{-webkit-mask-image:none;mask-image:none}}

/* ---------- Sections ---------- */
main{padding-block:6px 120px}
section{padding-top:28px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-head img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--yellow);flex:none}
.sec-title{flex:1;min-width:0}
h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:0;color:var(--yellow)}
.swoosh{display:block;width:84px;height:10px;margin-top:2px}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:940px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;background:var(--char-800);border-radius:var(--r);overflow:hidden;border:1px solid var(--char-700);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--char-600)}
.card.in-cart{border-color:var(--yellow)}
.card-open{display:block;border:0;padding:0;background:none;text-align:start}
.card-img{position:relative}
.card-img img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--char-700)}
.tag{position:absolute;inset-block-end:10px;inset-inline-start:10px;display:inline-flex;align-items:baseline;gap:3px;background:var(--yellow);color:var(--on-yellow);font-weight:700;border-radius:10px;padding:3px 10px;font-variant-numeric:tabular-nums;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.tag small{font-size:12px;font-weight:600}
.card-body{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 12px;flex:1}
.card-name{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.45;align-self:center}
.add{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--yellow);color:var(--on-yellow);font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center}
.add:active{transform:scale(.92)}
.step{flex:none;display:inline-flex;align-items:center;background:var(--yellow);color:var(--on-yellow);border-radius:999px;height:36px}
.step button{width:34px;height:36px;border:0;background:none;color:inherit;font-size:20px;font-weight:700;line-height:1}
.step b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
mark{background:rgba(245,197,22,.2);color:var(--yellow);border-radius:3px}

/* ---------- Cart bar ---------- */
.cartbar{position:fixed;inset-inline:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cartbar button{pointer-events:auto;width:100%;max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:12px;border:0;border-radius:16px;background:var(--yellow);color:var(--on-yellow);padding:12px 16px;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.cartbar .n{background:var(--char-800);color:var(--yellow);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding-inline:8px;font-variant-numeric:tabular-nums}
.cartbar .lbl{flex:1;text-align:start}
.cartbar .sum{font-variant-numeric:tabular-nums}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:relative;width:100%;max-width:560px;background:var(--char-800);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;transform:translateY(28px);transition:transform .22s;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.scrim.show .sheet{transform:none}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:24px;padding-bottom:18px}}
.x{position:absolute;top:12px;inset-inline-end:12px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(20,20,20,.72);color:#fff;font-size:20px;line-height:1}
.item-img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--char-700)}
.pad{padding:18px 20px 0;display:grid;gap:12px}
.eyebrow{color:var(--yellow);font-size:13px;font-weight:600}
.sheet h3{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2;margin:0}
.alt{color:var(--muted);font-size:14px;margin-top:-6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bigprice{font-size:24px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px}
.btn-y{background:var(--yellow);color:var(--on-yellow)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa svg{width:22px;height:22px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.cart-head{padding:20px 20px 4px;display:flex;align-items:center;gap:10px}
.cart-head h3{flex:1}
.lines{list-style:none;margin:0;padding:0 20px;display:grid}
.line{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--char-700)}
.line img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--char-700)}
.line .nm{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.4}
.line .pr{display:block;color:var(--muted);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));background:var(--char-900);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow)}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea{background:var(--char-900);border:1px solid var(--char-600);border-radius:12px;padding:11px 12px;font-size:15px;outline:0;width:100%;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--yellow)}
.field.bad input{border-color:var(--closed)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:700;padding-top:4px}
.total span:last-child{color:var(--yellow);font-size:22px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.warn{background:rgba(255,138,122,.12);color:var(--closed);border-radius:12px;padding:10px 12px;font-size:13px}

/* ---------- Footer ---------- */
footer{background:var(--char-950);border-top:4px solid var(--yellow);padding-block:30px 130px;color:var(--muted);font-size:14px}
.foot{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
footer h4{font-family:var(--display);font-weight:400;color:var(--yellow);font-size:21px;margin:0 0 6px}
footer p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links .pill{background:var(--char-800)}
.bye{margin-top:26px;text-align:center;font-family:var(--display);font-size:22px;color:var(--text)}
.bye small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap topbar">
    <span class="hello" id="t-hello"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
      <button type="button" data-lang="tr" aria-pressed="false">Türkçe</button>
    </div>
  </div>
  <div class="wrap brand">
    <img class="logo" src="img/logo.webp" alt="">
    <h1 id="t-name"></h1>
    <p class="tagline" id="t-tag"></p>
    <div class="meta">
      <span class="pill" id="status"><span class="dot"></span><span id="status-text"></span></span>
      <a class="pill" id="maplink" href="https://www.google.com/maps?q=36.8200434,34.6477673" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="t-city"></span>
      </a>
    </div>
  </div>
  <svg class="wave" viewBox="0 0 1440 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 46V20C240 -4 480 -4 720 18S1200 44 1440 14V46Z" fill="#242426"/></svg>
</header>

<nav class="cats" id="cats" aria-label="Categories"></nav>

<div class="bar" id="bar">
  <div class="wrap">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off">
      <button class="clear" id="clear" type="button" hidden>×</button>
    </label>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap" id="menu"></main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div><h4 id="t-hours-h"></h4><p id="t-hours"></p></div>
      <div>
        <h4 id="t-addr-h"></h4><p id="t-addr"></p>
        <div class="links"><a class="pill" href="https://www.google.com/maps?q=36.8200434,34.6477673" target="_blank" rel="noopener" id="t-map"></a></div>
      </div>
      <div id="contact" hidden><h4 id="t-contact-h"></h4><p id="contact-lines"></p></div>
      <div>
        <h4 id="t-follow"></h4>
        <div class="links">
          <a class="pill" href="https://www.instagram.com/alshark_tavuk" target="_blank" rel="noopener">Instagram</a>
          <a class="pill" href="https://www.facebook.com/Mojm3alshar8" target="_blank" rel="noopener">Facebook</a>
        </div>
      </div>
    </div>
    <div class="bye">صحة وهنا يا غوالي · Afiyet olsun<small id="t-prices"></small></div>
  </div>
</footer>

<div class="cartbar" id="cartbar" hidden>
  <button type="button" id="open-cart"><span class="n" id="cb-n">0</span><span class="lbl" id="cb-lbl"></span><span class="sum" id="cb-sum"></span></button>
</div>

<div class="scrim" id="item-scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="i-name">
    <button class="x" type="button" data-close aria-label="×">×</button>
    <img class="item-img" id="i-img" alt="">
    <div class="pad">
      <div class="eyebrow" id="i-cat"></div>
      <h3 id="i-name"></h3>
      <div class="alt" id="i-alt"></div>
      <div class="row"><span class="bigprice" id="i-price"></span><span id="i-step"></span></div>
      <button class="btn btn-y" type="button" id="i-add"></button>
    </div>
  </div>
</div>

<div class="scrim" id="cart-scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="c-title">
    <div class="cart-head"><h3 id="c-title"></h3><button class="link" type="button" id="c-clear"></button><button class="x" type="button" data-close aria-label="×" style="position:static">×</button></div>
    <ul class="lines" id="c-lines"></ul>
    <div class="pad">
      <div class="seg" id="c-type" role="group"></div>
      <div class="field" id="f-table"><label for="in-table" id="l-table"></label><input id="in-table" inputmode="numeric"></div>
      <div class="field" id="f-name"><label for="in-name" id="l-name"></label><input id="in-name" autocomplete="name"></div>
      <div class="field" id="f-addr"><label for="in-addr" id="l-addr"></label><textarea id="in-addr" rows="2" autocomplete="street-address"></textarea></div>
      <div class="field"><label for="in-note" id="l-note"></label><textarea id="in-note" rows="2"></textarea></div>
      <div class="total"><span id="t-total"></span><span id="c-sum"></span></div>
      <div class="warn" id="c-nowa" hidden></div>
      <button class="btn btn-wa" type="button" id="c-send">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3c-.3.3-1 1-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 4.9 4.3 1.8.8 2.5.8 3.4.7.6-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
        <span id="c-send-t"></span>
      </button>
      <p class="note" id="c-hint"></p>
    </div>
  </div>
</div>

<script>
/* ============ إعدادات ============ */

  if (i.img){ const m = i.img.match(/\/d\/([\w-]{20,})/); if (m) fb.push(`https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`); }
  if (i.img && IMG[i.id]) fb.push("@"+i.id);
  fb.push("@logo");
  return `<img ${cls?`class="${cls}"`:""} src="${itemImg(i)}" data-fb="${esc(fb.join("|"))}" onerror="fallbackImg(this)" alt="" ${lazy?'loading="lazy" decoding="async"':""}>`;
}
function indexItems(){ byId = {}; CATS.forEach(c => c.items.forEach(i => { i.cid = c.id; byId[i.id] = {...i, cat:c}; }));
  for (const k in cart) if (!byId[k]) delete cart[k]; }

/* ============ رسم الصفحة ============ */
const menu = $("#menu"), chips = $("#chips");
function applyLang(){
  const t = L();
  document.documentElement.lang = lang; document.documentElement.dir = t.dir; document.body.style.direction = t.dir;
  document.documentElement.style.setProperty("--fade-dir", t.dir==="rtl" ? "left" : "right");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#t-hello").textContent = t.hello; $("#t-name").textContent = t.name; $("#t-tag").textContent = t.tag; $("#t-city").textContent = t.city;
  $(".logo").alt = t.name; $("#q").placeholder = t.search;
  $("#t-hours-h").textContent = t.hoursH; $("#t-hours").textContent = t.hours(S.open, S.close);
  $("#t-addr-h").textContent = t.addrH; $("#t-addr").textContent = t.addr; $("#t-map").textContent = t.map;
  $("#t-follow").textContent = t.follow; $("#t-prices").textContent = t.prices; $("#t-contact-h").textContent = t.contactH;
  const lines = [];
  if (S.phone) lines.push(`${t.phone}: <span dir="ltr">${esc(S.phone)}</span>`);
  if (S.wa) lines.push(`${t.wa}: <span dir="ltr">${esc(S.wa)}</span>`);
  $("#contact").hidden = !lines.length; $("#contact-lines").innerHTML = lines.join("<br>");
  document.title = lang==="tr" ? "Alshark Tavuk Menü" : "منيو فروج الشرق";
  status(); drawCats(); drawChips(); render($("#q").value); drawCart();
}
function drawCats(){
  $("#cats").innerHTML = CATS.map(c => `<button class="cat" type="button" data-slug="${c.slug}">
    <img src="${catImg(c.id) || imgSrc("logo")}" alt="" loading="lazy"><span>${esc(cn(c))}</span></button>`).join("");
}
function drawChips(){
  chips.innerHTML = CATS.map(c => `<button class="chip" type="button" data-slug="${c.slug}">${esc(cn(c))}</button>`).join("");
  fade();
}
function hl(name, q){
  if (!q) return esc(name);
  const i = name.toLocaleLowerCase("tr").indexOf(q.toLocaleLowerCase("tr"));
  return i < 0 ? esc(name) : esc(name.slice(0,i)) + "<mark>" + esc(name.slice(i,i+q.length)) + "</mark>" + esc(name.slice(i+q.length));
}
function ctrl(id){
  const n = cart[id]||0;
  return n ? `<span class="step"><button type="button" data-dec="${id}" aria-label="−">−</button><b>${n}</b><button type="button" data-inc="${id}" aria-label="+">+</button></span>`
           : `<button class="add" type="button" data-inc="${id}" aria-label="${esc(L().add)}">+</button>`;
}
function render(q){
  const raw = (q||"").trim(), nq = norm(raw);
  let html = "";
  for (const c of CATS){
    const items = nq ? c.items.filter(i => norm(i.n).includes(nq) || norm(i.t||"").includes(nq) || norm(cn(c)).includes(nq)) : c.items;
    if (!items.length) continue;
    html += `<section id="${c.slug}" data-cat="${c.slug}">
      <div class="sec-head"><img src="${catImg(c.id) || imgSrc("logo")}" alt="" loading="lazy">
        <div class="sec-title"><h2>${esc(cn(c))}</h2><svg class="swoosh" viewBox="0 0 84 10" aria-hidden="true"><path d="M2 7C22 1 52 1 82 5" stroke="#f5c516" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg></div>
        <span class="count">${L().items(items.length)}</span></div>
      <div class="grid">${items.map(i => `
        <article class="card${cart[i.id]?" in-cart":""}" data-id="${i.id}">
          <button class="card-open" type="button" data-open="${i.id}"><div class="card-img">${imgTag(i)}<span class="tag">${Number(i.p).toLocaleString("en-US")}<small>${CUR}</small></span></div></button>
          <div class="card-body"><div class="card-name">${hl(nm(i), raw)}</div><span data-ctl="${i.id}">${ctrl(i.id)}</span></div>
        </article>`).join("")}</div></section>`;
  }
  menu.innerHTML = html || `<div class="empty">${esc(L().none(raw))}</div>`;
  chips.querySelectorAll(".chip").forEach(ch => ch.hidden = !!nq && !menu.querySelector(`[data-cat="${ch.dataset.slug}"]`));
  observe();
}

/* ============ تنقل الأقسام ============ */
let io, lock = 0;
function go(slug){ const s = document.getElementById(slug); if (!s) return;
  setActive(slug); lock = Date.now();
  const y = s.getBoundingClientRect().top + scrollY - $("#bar").offsetHeight - 6;
  scrollTo({top:y, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
function setActive(slug){
  chips.querySelectorAll(".chip").forEach(ch => {
    const on = ch.dataset.slug === slug; ch.setAttribute("aria-current", on);
    if (on){ const r = ch.getBoundingClientRect(), pr = chips.getBoundingClientRect();
      if (r.left < pr.left || r.right > pr.right) chips.scrollBy({left: r.left - pr.left - (pr.width - r.width)/2, behavior:"smooth"}); }
  });
}
function observe(){
  if (io) io.disconnect();
  const secs = [...menu.querySelectorAll("section")];
  if (secs[0]) setActive(secs[0].dataset.cat);
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es => { if (Date.now() - lock < 800) return;
    const v = es.filter(e => e.isIntersecting).sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (v[0]) setActive(v[0].target.dataset.cat); }, {rootMargin:"-150px 0px -55% 0px"});
  secs.forEach(s => io.observe(s));
}
function fade(){ chips.classList.toggle("more-end", chips.scrollWidth - chips.clientWidth - Math.abs(chips.scrollLeft) > 4); }
chips.addEventListener("scroll", fade, {passive:true});
addEventListener("resize", fade);
document.addEventListener("click", e => {
  const b = e.target.closest(".chip,.cat"); if (b) go(b.dataset.slug);
});

/* ============ السلة ============ */
function setQty(id, n){
  if (n > 0) cart[id] = Math.min(n, 99); else delete cart[id];
  store.set("cart", cart);
  document.querySelectorAll(`[data-ctl="${id}"]`).forEach(el => el.innerHTML = ctrl(id));
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el => el.classList.toggle("in-cart", !!cart[id]));
  if (!$("#item-scrim").hidden && openId === id) drawItemCtl();
  drawCart();
}
const cartCount = () => Object.values(cart).reduce((a,b) => a+b, 0);
const cartSum = () => Object.entries(cart).reduce((a,[id,n]) => a + (byId[id] ? byId[id].p*n : 0), 0);
function drawCart(){
  const n = cartCount(), t = L();
  $("#cartbar").hidden = !n;
  $("#cb-n").textContent = n; $("#cb-lbl").textContent = t.bar; $("#cb-sum").textContent = fmt(cartSum());
  if ($("#cart-scrim").hidden) return;
  $("#c-title").textContent = t.cart; $("#c-clear").textContent = t.clear;
  $("#c-lines").innerHTML = n ? Object.entries(cart).map(([id,q]) => { const i = byId[id]; return `
    <li class="line">${imgTag(i,"",false)}<div class="nm">${esc(nm(i))}<span class="pr">${fmt(i.p)} × ${q} = ${fmt(i.p*q)}</span></div>
    <span data-ctl="${id}">${ctrl(id)}</span></li>`; }).join("") : `<li class="empty">${t.emptyCart}</li>`;
  const types = ["table","pickup"].concat(S.delivery ? ["delivery"] : []);
  if (!types.includes(orderType)) orderType = "table";
  $("#c-type").innerHTML = types.map(k => `<button type="button" data-type="${k}" aria-pressed="${k===orderType}">${t.types[k]}</button>`).join("");
  $("#f-table").hidden = orderType !== "table"; $("#f-addr").hidden = orderType !== "delivery"; $("#f-name").hidden = orderType === "table";
  $("#l-table").textContent = t.table; $("#l-name").textContent = t.nameL; $("#l-addr").textContent = t.addr; $("#l-note").textContent = t.note;
  $("#t-total").textContent = t.total; $("#c-sum").textContent = fmt(cartSum());
  $("#c-send-t").textContent = t.send; $("#c-hint").textContent = t.hint;
  $("#c-nowa").hidden = !!S.wa; $("#c-nowa").textContent = t.nowa;
  $("#c-send").disabled = !n || !S.wa;
}
document.addEventListener("click", e => {
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
  if (inc){ const id = inc.dataset.inc; setQty(id, (cart[id]||0)+1); }
  if (dec){ const id = dec.dataset.dec; setQty(id, (cart[id]||0)-1); }
  const ty = e.target.closest("[data-type]");
  if (ty){ orderType = ty.dataset.type; store.set("type", orderType); drawCart(); }
});
$("#c-clear").addEventListener("click", () => { cart = {}; store.set("cart", cart); render($("#q").value); drawCart(); });
$("#open-cart").addEventListener("click", () => { openSheet("#cart-scrim"); drawCart(); });

["in-table","in-name","in-addr","in-note"].forEach(id => { const el = document.getElementById(id);
  el.value = store.get("f:"+id, ""); el.addEventListener("input", () => { store.set("f:"+id, el.value); el.parentElement.classList.remove("bad"); }); });

$("#c-send").addEventListener("click", () => {
  const t = L(), need = {table:["in-table"], pickup:["in-name"], delivery:["in-name","in-addr"]}[orderType];
  let ok = true;
  need.forEach(id => { const el = document.getElementById(id); if (!el.value.trim()){ el.parentElement.classList.add("bad"); ok = false; } });
  if (!ok){ $("#c-hint").textContent = t.need; return; }
  const v = id => document.getElementById(id).value.trim();
  const lines = [`*${t.msgHead}*`, ""];
  Object.entries(cart).forEach(([id,q]) => { const i = byId[id];
    lines.push(`${q} × ${lang==="tr" && i.t ? `${i.t} (${i.n})` : i.n} — ${fmt(i.p*q)}`); });
  lines.push("", `*${t.msgTotal}: ${fmt(cartSum())}*`, `${t.msgType}: ${t.types[orderType]}`);
  if (orderType==="table") lines.push(`${t.msgTable}: ${v("in-table")}`);
  else lines.push(`${t.msgName}: ${v("in-name")}`);
  if (orderType==="delivery") lines.push(`${t.msgAddr}: ${v("in-addr")}`);
  if (v("in-note")) lines.push(`${t.msgNote}: ${v("in-note")}`);
  const num = S.wa.replace(/\D/g,"");
  const a = document.createElement("a");
  a.href = `https://wa.me/${num}?text=${encodeURIComponent(lines.join("\n"))}`; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
});

/* ============ نافذة الصنف ============ */
let openId = null, lastFocus = null;
function openSheet(sel){ const s = $(sel); lastFocus = document.activeElement; s.hidden = false;
  requestAnimationFrame(() => s.classList.add("show")); const x = s.querySelector("[data-close]"); if (x) x.focus(); }
function closeSheet(s){ s.classList.remove("show"); setTimeout(() => { s.hidden = true; }, 200); if (lastFocus) lastFocus.focus({preventScroll:true}); }
document.querySelectorAll(".scrim").forEach(s => s.addEventListener("click", e => { if (e.target === s || e.target.closest("[data-close]")) closeSheet(s); }));
document.addEventListener("keydown", e => { if (e.key==="Escape") document.querySelectorAll(".scrim:not([hidden])").forEach(closeSheet); });
function drawItemCtl(){ const n = cart[openId]||0;
  $("#i-step").innerHTML = n ? `<span data-ctl="${openId}">${ctrl(openId)}</span>` : "";
  $("#i-add").textContent = n ? L().added : L().add; }
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (!o) return;
  const i = byId[o.dataset.open]; openId = i.id;
  $("#i-img").outerHTML = imgTag(i, "item-img", false).replace("<img ", '<img id="i-img" ');
  $("#i-cat").textContent = cn(i.cat); $("#i-name").textContent = nm(i);
  const alt = lang==="tr" ? i.n : i.t; $("#i-alt").textContent = alt || ""; $("#i-alt").hidden = !alt;
  $("#i-price").textContent = fmt(i.p); drawItemCtl(); openSheet("#item-scrim");
});
$("#i-add").addEventListener("click", () => { if (!cart[openId]) setQty(openId, 1); else closeSheet($("#item-scrim")); });

/* ============ البحث واللغة ============ */
const qi = $("#q"), clr = $("#clear");
qi.addEventListener("input", () => { clr.hidden = !qi.value; render(qi.value); });
clr.addEventListener("click", () => { qi.value = ""; clr.hidden = true; render(""); qi.focus(); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("lang", lang); applyLang(); }));

/* ============ الدوام ============ */
function hm(s){ const m = String(s||"").match(/(\d{1,2})[:.](\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; }
function status(){
  const el = $("#status"), t = L(); el.classList.remove("is-open","is-closed");
  let now;
  try { const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Istanbul",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
        now = (+p.find(x=>x.type==="hour").value)*60 + (+p.find(x=>x.type==="minute").value); } catch(e){}
  const o = hm(S.open), c = hm(S.close);
  if (now == null || o == null || c == null){ $("#status-text").textContent = t.hours(S.open, S.close); return; }
  const open = o < c ? (now >= o && now < c) : (now >= o || now < c);
  el.classList.add(open ? "is-open" : "is-closed");
  $("#status-text").textContent = open ? t.open(S.close) : t.closed(S.open);
}

/* ============ Google Sheets ============ */
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ","){ row.push(f); f = ""; }
    else if (ch === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if (ch !== "\r") f += ch;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function fromSheet(rows){
  const head = rows.shift().map(h => h.trim()), col = n => head.indexOf(n);
  const cI = col("القسم"), nI = col("الصنف"), pI = col("السعر"), aI = col("متوفر"), idI = col("الرمز"),
        ctI = col("القسم بالتركي"), ntI = col("الصنف بالتركي"), imI = col("الصورة"), kI = col("الإعداد"), vI = col("القيمة");
  if (cI < 0 || nI < 0 || pI < 0) throw new Error("columns");
  const cell = (r,i) => i >= 0 ? String(r[i]||"").trim() : "";
  const set = {};
  if (kI >= 0 && vI >= 0) rows.forEach(r => { const k = cell(r,kI); if (k) set[k] = cell(r,vI); });
  const known = {}; CATS.forEach(c => known[c.name] = c);
  const out = [], map = {};
  for (const r of rows){
    const cat = cell(r,cI), name = cell(r,nI), price = parseFloat(cell(r,pI).replace(/[^\d.]/g,""));
    if (!cat || !name || isNaN(price)) continue;
    if (/^(لا|no|hayır|0)$/i.test(cell(r,aI))) continue;
    if (!map[cat]){ const k = known[cat];
      map[cat] = {id: k ? k.id : "", slug: k ? k.slug : "c"+out.length, name: cat, tr: cell(r,ctI) || (k && k.tr) || "", items: []};
      out.push(map[cat]); }
    else if (!map[cat].tr && cell(r,ctI)) map[cat].tr = cell(r,ctI);
    const id = cell(r,idI) || ("x"+out.length+"-"+map[cat].items.length);
    const old = byId[id];
    map[cat].items.push({id, n:name, p:price, t: cell(r,ntI) || (old && old.t) || "", img: driveImg(cell(r,imI))});
  }
  if (!out.length) throw new Error("empty");
  return {cats: out, set};
}
function applySettings(set){
  const yes = v => /^(نعم|yes|evet|1)$/i.test(v||"");
  if (set["واتساب"] !== undefined) S.wa = set["واتساب"];
  if (set["هاتف"] !== undefined) S.phone = set["هاتف"];
  if (set["يفتح"]) S.open = set["يفتح"];
  if (set["يسكّر"] || set["يسكر"]) S.close = set["يسكّر"] || set["يسكر"];
  if (set["التوصيل"] !== undefined) S.delivery = yes(set["التوصيل"]);
}

/* ============ تشغيل ============ */
indexItems(); applyLang();
if (SHEET_CSV){
  fetch(SHEET_CSV + (SHEET_CSV.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache:"no-store"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(txt => { const d = fromSheet(parseCSV(txt)); CATS = d.cats; applySettings(d.set); indexItems(); store.set("cart", cart); applyLang(); })
    .catch(() => {});
}
</script>
