<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الدر الثمين التفاعلي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Alexandria:wght@500;700;800&family=Readex+Pro:wght@300;400;600;700&display=swap">
<style>
/* الدر الثمين — منصة تعلّم التجويد
   Layout: app shell — side rail on desktop, bottom dock on phones; content column ~ 920px.
   Identity: «فجر على البحر» — indigo-violet primary, coral + amber warmth, teal freshness;
   each unit carries its own hue. Display face Alexandria (modern, clear), body Readex Pro. */
:root {
  --bg: #f6f5fc;
  --bg-deep: #ebe8f8;
  --surface: #ffffff;
  --surface-2: #f3f1fb;
  --ink: #1f1b3d;
  --ink-2: #4a4670;
  --muted: #7d79a0;
  --line: #e5e2f3;
  --accent: #5b4be0;
  --accent-2: #b14ee0;
  --accent-ink: #ffffff;
  --coral: #f2607a;
  --gold: #e8930c;
  --gold-soft: #fdf0d8;
  --pearl: #fffaf0;
  --good: #12a36b;
  --bad: #e5484d;
  --q: #0f7a4a;          /* لون النص القرآني — أخضر المصحف */
  --verse: #d23a4f;      /* لون أبيات الجزرية — أحمر الكتاب */
  --shadow: 0 1px 2px rgb(40 30 110 / .05), 0 12px 32px -16px rgb(60 40 160 / .22);

  /* ألوان الوحدات */
  --h-teal: #0d9488; --h-indigo: #5b5fe6; --h-green: #10a35f; --h-rose: #e11d6b; --h-amber: #d97706;
  --h-sky: #0284c7; --h-violet: #8b5cf6; --h-red: #e5484d; --h-cyan: #0891b2; --h-gold: #ca8a04; --h-slate: #64748b;

  --f-display: "Alexandria", "Readex Pro", "Noto Sans Arabic", sans-serif;
  --f-body: "Readex Pro", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-quran: "Amiri", "Amiri Quran", "Noto Naskh Arabic", "Traditional Arabic", serif;

  --r-sm: 8px; --r-md: 14px; --r-lg: 22px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
  --t-xs: .78rem; --t-sm: .88rem; --t-md: 1rem; --t-lg: 1.18rem; --t-xl: 1.5rem; --t-2xl: 2.1rem; --t-3xl: 2.9rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100f1f; --bg-deep: #0a0916; --surface: #1a1930; --surface-2: #211f3b; --ink: #efeefa; --ink-2: #c4c1e0; --muted: #8f8bb3;
    --line: #2e2b50; --accent: #8f80ff; --accent-2: #d17bf5; --accent-ink: #ffffff; --coral: #ff7d93; --gold: #fbb63f; --gold-soft: #3b2c12; --pearl: #f6efe0;
    --good: #3ddc97; --bad: #ff6b70; --q: #5fd99a; --verse: #ff8597;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 14px 34px -16px rgb(0 0 0 / .7);
    --h-teal: #2dd4bf; --h-indigo: #8b8ff9; --h-green: #34d399; --h-rose: #fb6f9d; --h-amber: #fbbf24;
    --h-sky: #38bdf8; --h-violet: #b197fc; --h-red: #ff7a7f; --h-cyan: #22d3ee; --h-gold: #facc15; --h-slate: #a3b1c6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100f1f; --bg-deep: #0a0916; --surface: #1a1930; --surface-2: #211f3b; --ink: #efeefa; --ink-2: #c4c1e0; --muted: #8f8bb3;
  --line: #2e2b50; --accent: #8f80ff; --accent-2: #d17bf5; --accent-ink: #ffffff; --coral: #ff7d93; --gold: #fbb63f; --gold-soft: #3b2c12; --pearl: #f6efe0;
  --good: #3ddc97; --bad: #ff6b70; --q: #5fd99a; --verse: #ff8597;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 14px 34px -16px rgb(0 0 0 / .7);
  --h-teal: #2dd4bf; --h-indigo: #8b8ff9; --h-green: #34d399; --h-rose: #fb6f9d; --h-amber: #fbbf24;
  --h-sky: #38bdf8; --h-violet: #b197fc; --h-red: #ff7a7f; --h-cyan: #22d3ee; --h-gold: #facc15; --h-slate: #a3b1c6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink);
  background:
    radial-gradient(900px 500px at 100% -10%, color-mix(in oklab, var(--accent) 10%, transparent), transparent 70%),
    radial-gradient(700px 500px at -10% 30%, color-mix(in oklab, var(--coral) 7%, transparent), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  font-family: var(--f-body); font-size: 16px; line-height: 1.75;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
#app { min-height: 100%; direction: rtl; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in oklab, var(--accent) 60%, transparent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; margin: 0; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── shell ── */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; min-height: 100dvh; }
.rail { display: none; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: var(--s-3);
  padding: 10px 16px; background: color-mix(in oklab, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; line-height: 1; white-space: nowrap; }
.brand-sub { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; }
.topbar .spacer { flex: 1; }
@media (max-width: 440px) { .topbar .brand-name { display: none; } .topbar { gap: 8px; } .icon-btn { width: 36px; height: 36px; } }
.chip-stat {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: var(--t-sm); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip-stat svg { width: 16px; height: 16px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; flex: none;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { border-color: var(--accent); }

.main { padding-inline: 16px; padding-block: var(--s-5) 120px; width: 100%; max-width: 980px; margin-inline: auto; min-width: 0; }

.dock {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in oklab, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.navlink {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px;
  text-decoration: none; color: var(--muted); font-size: .72rem; border: 0; background: none;
}
.navlink svg { width: 22px; height: 22px; }
.navlink[aria-current="page"] { color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); }

@media (min-width: 900px) {
  .shell { grid-template-columns: 236px 1fr; }
  .rail {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; height: 100dvh;
    padding: 20px 14px; border-inline-end: 1px solid var(--line); background: var(--surface-2);
  }
  .rail .brand { padding: 4px 8px 18px; }
  .rail .navlink { flex-direction: row; gap: 12px; font-size: var(--t-md); padding: 10px 12px; justify-content: flex-start; color: var(--ink-2); }
  .rail .navlink[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .rail-foot { margin-top: auto; font-size: var(--t-xs); color: var(--muted); padding: 8px; line-height: 1.6; }
  .dock, .topbar .brand { display: none; }
  .main { padding-block: var(--s-6) var(--s-7); }
}

/* ── generic ── */
.eyebrow { font-size: var(--t-xs); letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.h-display { font-family: var(--f-display); font-weight: 700; font-size: var(--t-3xl); line-height: 1.15; }
.h-page { font-family: var(--f-display); font-weight: 800; font-size: var(--t-2xl); letter-spacing: -.01em; }
.lead { color: var(--ink-2); font-size: var(--t-lg); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }
.row { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }
.section { display: flex; flex-direction: column; gap: var(--s-4); margin-top: var(--s-6); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; }
.section-head h2 { font-size: var(--t-xl); font-family: var(--f-display); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-5); box-shadow: var(--shadow); min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 14px;
  border: 1px solid transparent; font-weight: 600; text-decoration: none; transition: transform .12s ease, background .2s;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink);
  box-shadow: 0 8px 20px -10px color-mix(in oklab, var(--accent) 70%, transparent);
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: none; }
.btn.gold { background: linear-gradient(135deg, #f7b733, #fc6767); color: #fff; }
.btn.sm { padding: 8px 14px; font-size: var(--t-sm); border-radius: 11px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: var(--t-xs); font-weight: 600; background: color-mix(in oklab, var(--hc, var(--accent)) 14%, transparent); color: var(--hc, var(--accent)); white-space: nowrap; }
.pagetag { font-size: var(--t-xs); color: var(--muted); border: 1px dashed var(--line); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.q { font-family: var(--f-quran); color: var(--q); font-size: 1.14em; line-height: 1.9; }
.q::before { content: "﴿"; opacity: .55; margin-inline-end: 1px; }
.q::after { content: "﴾"; opacity: .55; margin-inline-start: 1px; }
.key { background: linear-gradient(transparent 58%, color-mix(in oklab, var(--gold) 34%, transparent) 58%); font-weight: 600; padding-inline: 2px; }
.hue { --hc: var(--h-teal); }
.hue-teal { --hc: var(--h-teal); } .hue-indigo { --hc: var(--h-indigo); } .hue-green { --hc: var(--h-green); } .hue-rose { --hc: var(--h-rose); }
.hue-amber { --hc: var(--h-amber); } .hue-sky { --hc: var(--h-sky); } .hue-violet { --hc: var(--h-violet); } .hue-red { --hc: var(--h-red); }
.hue-cyan { --hc: var(--h-cyan); } .hue-gold { --hc: var(--h-gold); } .hue-slate { --hc: var(--h-slate); }

/* ── home hero ── */
.hero { position: relative; overflow: hidden; border-radius: 30px; padding: clamp(22px, 5vw, 44px); color: #fff;
  background:
    radial-gradient(60% 80% at 100% 0%, rgb(255 255 255 / .18), transparent 60%),
    radial-gradient(50% 70% at 0% 100%, rgb(255 170 90 / .55), transparent 65%),
    radial-gradient(45% 60% at 30% 10%, rgb(255 110 150 / .35), transparent 70%),
    linear-gradient(135deg, #3a2fc4 0%, #6b3fe0 42%, #b6489e 75%, #f0855a 100%);
  box-shadow: 0 24px 60px -28px rgb(80 40 180 / .75);
}
.hero .eyebrow { color: rgb(255 255 255 / .82); }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 6.2vw, 3.3rem); line-height: 1.35; color: #fff; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, #ffe08a, #ffb38a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: rgb(255 255 255 / .9); max-width: 46ch; }
.hero .btn { background: #fff; color: #3a2fc4; box-shadow: 0 10px 24px -10px rgb(0 0 0 / .4); }
.hero .btn.ghost { background: transparent; color: #fffaf0; border-color: rgb(255 255 255 / .3); }
.hero-grid { display: grid; gap: var(--s-5); grid-template-columns: 1fr; align-items: center; position: relative; z-index: 1; }
@media (min-width: 760px) { .hero-grid { grid-template-columns: 1.15fr .85fr; } }
.necklace { width: 100%; max-width: 360px; justify-self: center; overflow: visible; }
.necklace .pearl-empty { fill: rgb(255 255 255 / .07); stroke: rgb(255 255 255 / .35); stroke-dasharray: 3 3; }
.necklace text { font-family: var(--f-body); }
.bubbles { position: absolute; inset: 0; pointer-events: none; }
.bubbles span { position: absolute; bottom: -20px; border-radius: 50%; border: 1px solid rgb(255 255 255 / .25); animation: rise linear infinite; }
@keyframes rise { to { transform: translateY(-560px); opacity: 0; } }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: var(--t-xl); font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: var(--t-xs); color: var(--muted); }
.levelbar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.levelbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); border-radius: inherit; transition: width .6s ease; }

/* ── journey ── */
.path { position: relative; display: flex; flex-direction: column; gap: 14px; }
.depth { position: absolute; inset-block: 10px; inset-inline-start: 27px; width: 2px; background: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px); }
.station { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: stretch; text-decoration: none; color: inherit; }
.station-orb { position: relative; z-index: 1; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.6rem; color: #fff; background: linear-gradient(140deg, color-mix(in oklab, var(--hc) 75%, #fff), var(--hc)); border: 3px solid var(--surface); box-shadow: 0 8px 18px -8px var(--hc); font-weight: 800; }
.station.done .station-orb { background: radial-gradient(circle at 35% 30%, #fff, #f3eadb 45%, #d9c6a4); color: #6b4a12; border-color: var(--gold); box-shadow: 0 0 0 4px color-mix(in oklab, var(--gold) 25%, transparent); }
.station-body { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: border-color .2s, transform .15s; }
.station:hover .station-body { border-color: var(--hc); transform: translateX(-3px); }
.station-body h3 { font-size: var(--t-lg); }
.station-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: var(--t-sm); color: var(--muted); }
.mini-progress { flex: 1; min-width: 90px; max-width: 220px; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.mini-progress i { display: block; height: 100%; background: var(--hc); border-radius: inherit; }
.stars { display: inline-flex; gap: 2px; color: var(--line); }
.stars svg { width: 16px; height: 16px; }
.stars .on { color: var(--gold); }

/* ── unit / lesson ── */
.unit-head { border-radius: 26px; padding: clamp(20px, 4vw, 34px); background: linear-gradient(160deg, color-mix(in oklab, var(--hc) 20%, var(--surface)), var(--surface) 70%); border: 1px solid color-mix(in oklab, var(--hc) 30%, var(--line)); display: flex; flex-direction: column; gap: 10px; }
.unit-head .glyph { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1; color: #fff; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(140deg, color-mix(in oklab, var(--hc) 70%, #fff), var(--hc)); box-shadow: 0 10px 22px -10px var(--hc); }
.unit-head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.4rem); }
.lesson-list { display: grid; gap: 10px; }
.lesson-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; }
.lesson-item:hover { border-color: var(--hc); }
.lesson-num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; background: color-mix(in oklab, var(--hc) 14%, transparent); color: var(--hc); font-variant-numeric: tabular-nums; }
.lesson-item.read .lesson-num { background: var(--hc); color: #fff; }
.lesson-item .t { min-width: 0; }
.quiz-cta { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: center; padding: 20px; border-radius: var(--r-lg); border: 2px dashed color-mix(in oklab, var(--hc) 45%, var(--line)); background: color-mix(in oklab, var(--hc) 6%, var(--surface)); }
@media (min-width: 640px) { .quiz-cta { grid-template-columns: 1fr auto; } }

.lesson { display: flex; flex-direction: column; gap: 18px; }
.lesson-top { display: flex; flex-direction: column; gap: 8px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--t-sm); color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.lesson h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.3rem); }
.readbar { height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.readbar i { display: block; height: 100%; background: var(--hc); width: 0; transition: width .2s; }
.blk { min-width: 0; }
.blk-p { font-size: 1.06rem; color: var(--ink); max-width: 68ch; }
.blk-title { font-weight: 700; color: var(--ink); margin-bottom: 10px; font-size: var(--t-md); }
.def { display: grid; gap: 12px; grid-template-columns: 1fr; padding: 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); border-inline-start: 0; position: relative; }
.def-name { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; color: var(--hc); line-height: 1.2; }
.def-row { display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: baseline; }
.def-row b { font-size: var(--t-sm); color: var(--muted); font-weight: 600; }
@media (max-width: 480px) { .def-row { grid-template-columns: 1fr; gap: 0; } }
.cardgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.mini { padding: 16px 18px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mini h4 { margin: 0; font-size: var(--t-md); color: var(--hc); }
.mini p { color: var(--ink-2); font-size: .97rem; }
.olist { margin: 0; padding: 0; list-style: none; counter-reset: li var(--start, 0); display: flex; flex-direction: column; gap: 8px; }
.olist li { counter-increment: li; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.olist li::before { content: counter(li, arabic-indic); width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: var(--t-sm); font-weight: 700; color: var(--hc); background: color-mix(in oklab, var(--hc) 12%, transparent); margin-top: 3px; }
.ulist li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--hc); margin: 10px 9px 0; }

.shahid { position: relative; padding: 20px 22px 16px; border-radius: var(--r-lg); background:
  linear-gradient(var(--surface), var(--surface)) padding-box,
  linear-gradient(135deg, color-mix(in oklab, var(--verse) 60%, transparent), color-mix(in oklab, var(--gold) 60%, transparent)) border-box;
  border: 1.5px solid transparent; }
.shahid-src { font-size: var(--t-xs); color: var(--muted); font-weight: 600; letter-spacing: .03em; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.bayt { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; font-family: var(--f-quran); color: var(--verse); font-size: 1.22rem; line-height: 2; }
.bayt span:nth-child(odd) { text-align: start; }
.bayt span:nth-child(even) { text-align: end; }
@media (max-width: 560px) { .bayt { grid-template-columns: 1fr; gap: 0; } .bayt span:nth-child(even) { text-align: end; padding-inline-start: 20px; margin-bottom: 8px; } }
.speak { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 3px 10px; font-size: var(--t-xs); display: inline-flex; gap: 6px; align-items: center; }

.note { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 14px 16px; border-radius: var(--r-md); background: color-mix(in oklab, var(--gold) 10%, var(--surface)); border: 1px solid color-mix(in oklab, var(--gold) 30%, var(--line)); }
.note svg { width: 22px; height: 22px; color: var(--gold); margin-top: 3px; }
.note b.nt { display: block; color: var(--gold); font-size: var(--t-sm); }

.tablewrap { overflow-x: auto; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; min-width: 480px; }
table.t th { background: color-mix(in oklab, var(--hc) 12%, var(--surface)); color: var(--ink); font-size: var(--t-sm); text-align: start; padding: 10px 12px; font-weight: 700; }
table.t td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; font-size: .97rem; }
table.t td:first-child { font-weight: 600; color: var(--hc); white-space: nowrap; }
table.t tr:hover td { background: color-mix(in oklab, var(--hc) 5%, transparent); }

.mnemo { padding: 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.mnemo-phrase { font-family: var(--f-quran); font-size: clamp(1.3rem, 4vw, 1.8rem); line-height: 1.8; color: var(--ink); }
.mnemo-phrase .init { color: var(--hc); font-weight: 700; text-shadow: 0 0 18px color-mix(in oklab, var(--hc) 40%, transparent); }
.letters { display: flex; flex-wrap: wrap; gap: 8px; }
.lt { min-width: 44px; height: 44px; padding: 0 8px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-quran); font-size: 1.45rem; color: var(--hc); background: color-mix(in oklab, var(--hc) 12%, transparent); border: 1px solid color-mix(in oklab, var(--hc) 30%, transparent); }
button.lt:hover { background: var(--hc); color: #fff; }
.lt.pop { animation: pop .5s ease; }
@keyframes pop { 50% { transform: scale(1.18); } }

.compare { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.compare .mini { border-top: 4px solid var(--hc); }
.compare .mini:nth-child(2) { --hc: var(--gold); }
.split { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.split .mini ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.split .mini li { position: relative; padding-inline-start: 18px; color: var(--ink-2); }
.split .mini li::before { content: ""; position: absolute; inset-inline-start: 2px; top: .75em; width: 7px; height: 7px; border-radius: 2px; background: var(--hc); transform: rotate(45deg); }
.split .mini:nth-child(2) { --hc: var(--gold); }

.tree { display: flex; flex-direction: column; align-items: center; gap: 0; }
.tree-root { padding: 10px 26px; border-radius: 14px; background: var(--hc); color: #fff; font-weight: 700; font-family: var(--f-display); font-size: 1.15rem; background: linear-gradient(135deg, color-mix(in oklab, var(--hc) 70%, #fff), var(--hc)); }
.tree-stem { width: 2px; height: 18px; background: color-mix(in oklab, var(--hc) 50%, var(--line)); }
.tree-kids { display: grid; gap: 12px; width: 100%; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); border-top: 2px solid color-mix(in oklab, var(--hc) 50%, var(--line)); padding-top: 16px; }
.tree-node { padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tree-node > b { color: var(--hc); }
.tree-node .sub { font-size: var(--t-sm); color: var(--muted); }
.tree-node .verdict { align-self: flex-start; }
.tree-node .kids { display: flex; flex-wrap: wrap; gap: 6px; }
.tree-node .kid { padding: 6px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: var(--t-sm); }
.tree-node .kid b { color: var(--ink); display: block; }

.speed { display: grid; gap: 10px; }
.speed-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.speed-row b { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; color: var(--hc); }
.speed-track { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.speed-bar { position: relative; height: 10px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.speed-bar i { position: absolute; inset-block: 0; width: 26px; border-radius: 9px; background: var(--hc); animation: swim linear infinite; }
@keyframes swim { from { inset-inline-start: -30px; } to { inset-inline-start: 100%; } }

.chain { padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.chain-row { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.chain-row.bad { background: color-mix(in oklab, var(--bad) 9%, var(--surface)); }
.chain-seq { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.chain-part { padding: 4px 10px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-size: var(--t-sm); font-weight: 600; }
.chain-link { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; font-size: .7rem; font-weight: 700; color: var(--muted); }
.chain-link.join { color: var(--good); }
.chain-link.join::before { content: ""; display: block; width: 20px; height: 3px; border-radius: 3px; background: currentColor; margin-inline-end: 4px; }
.chain-link.cut::before { content: "۞"; margin-inline-end: 4px; color: var(--bad); font-size: .9rem; }
.chain-row p { font-size: var(--t-sm); color: var(--ink-2); }

.ladder { display: flex; flex-direction: column; gap: 8px; }
.rung { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.rung .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklab, var(--hc) calc(30% - var(--i) * 4%), transparent); color: var(--hc); font-weight: 700; }
.rung .m { font-size: var(--t-xs); font-weight: 700; color: var(--hc); background: color-mix(in oklab, var(--hc) 10%, transparent); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.rung > div { min-width: 0; }
@media (max-width: 520px) { .rung { grid-template-columns: 32px 1fr; } .rung .m { grid-column: 2; justify-self: start; } }

.madd { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.madd-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.madd-head h4 { margin: 0; font-size: var(--t-lg); color: var(--h-red); }
.beads { display: inline-flex; gap: 5px; align-items: center; direction: rtl; }
.beads i { width: 13px; height: 13px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid color-mix(in oklab, var(--h-red) 40%, var(--line)); }
.beads i.on { background: radial-gradient(circle at 35% 30%, #fff, var(--h-red)); border-color: var(--h-red); }
.beads i.alt { background: color-mix(in oklab, var(--h-red) 30%, transparent); }
.beads small { margin-inline-start: 6px; font-weight: 700; color: var(--h-red); font-size: var(--t-sm); }

.podium { display: flex; flex-direction: column; gap: 8px; }
.pod { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; }
.pod span { height: 34px; border-radius: 10px; background: linear-gradient(90deg, color-mix(in oklab, var(--h-red) var(--w), transparent), color-mix(in oklab, var(--h-red) 8%, transparent)); display: flex; align-items: center; padding-inline: 12px; color: var(--ink); font-weight: 600; width: calc(40% + var(--w)); max-width: 100%; }
.pod b { color: var(--h-red); text-align: center; }

.five { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.five .mini { text-align: center; align-items: center; }
.five .mini h4 { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }

.strength { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.strength table.t { min-width: 0; }
.strength table.t td, .strength table.t th { text-align: center; }
.strength table.t td:first-child { color: var(--ink); }

.why { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--r-md); background: color-mix(in oklab, var(--hc) 7%, var(--surface)); border: 1px dashed color-mix(in oklab, var(--hc) 40%, var(--line)); }
.why .q { font-size: 1.35rem; }
@media (max-width: 480px) { .why { grid-template-columns: 1fr; } }
.exrow { display: flex; flex-wrap: wrap; gap: 8px; }
.exrow .q { padding: 4px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }

.sifa-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }
.sifa { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.sifa h4 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; color: var(--hc); }
.sifa .kv { font-size: .93rem; color: var(--ink-2); }
.sifa .kv b { color: var(--muted); font-weight: 600; font-size: var(--t-xs); margin-inline-end: 6px; }
.sifa .lettersline { font-family: var(--f-quran); font-size: 1.25rem; color: var(--hc); }

.lesson-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }

/* mouth diagram */
.mouth-wrap { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 760px) { .mouth-wrap { grid-template-columns: 1.1fr .9fr; } }
.mouth { width: 100%; height: auto; max-width: 520px; justify-self: center; }
.mouth .head { fill: color-mix(in oklab, var(--gold) 12%, var(--surface)); stroke: color-mix(in oklab, var(--ink) 30%, transparent); stroke-width: 2; }
.mouth .cav { fill: var(--bg-deep); stroke: none; }
.mouth .zone { fill: color-mix(in oklab, var(--zc) 30%, transparent); stroke: var(--zc); stroke-width: 1.5; cursor: pointer; transition: fill .2s; }
.mouth .zone:hover, .mouth .zone.on { fill: color-mix(in oklab, var(--zc) 70%, transparent); }
.mouth .zone.dim { opacity: .35; }
.mouth .lbl { font-family: var(--f-body); font-size: 12px; fill: var(--ink); pointer-events: none; font-weight: 600; }
.mouth .tooth { fill: #fffaf0; stroke: color-mix(in oklab, var(--ink) 35%, transparent); stroke-width: 1.2; }
.mouth .tongue { fill: color-mix(in oklab, var(--h-rose) 22%, var(--surface)); stroke: color-mix(in oklab, var(--h-rose) 55%, transparent); stroke-width: 1.5; }
.zone-info { padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; min-height: 160px; }
.zone-info h4 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; color: var(--accent); }

.teeth { width: 100%; max-width: 420px; height: auto; margin-inline: auto; display: block; }
.teeth .t { stroke: color-mix(in oklab, var(--ink) 35%, transparent); stroke-width: 1; cursor: pointer; }
.teeth-legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.teeth-legend button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: var(--t-sm); display: inline-flex; gap: 6px; align-items: center; }
.teeth-legend i { width: 12px; height: 12px; border-radius: 4px; }
.teeth-legend button.on { border-color: var(--ink); font-weight: 700; }

/* ── quiz / games ── */
.play { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.play-top { display: flex; align-items: center; gap: 12px; }
.play-top .grow { flex: 1; min-width: 0; }
.qbar { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.qbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .35s ease; }
.combo { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: clamp(18px, 4vw, 30px); display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); }
.qtext { font-size: clamp(1.15rem, 3.2vw, 1.4rem); font-weight: 600; line-height: 1.7; }
.qbig { font-family: var(--f-quran); font-size: clamp(2rem, 8vw, 3rem); color: var(--q); text-align: center; line-height: 1.6; padding: 10px 0; }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
@media (min-width: 560px) { .opts.grid2 { grid-template-columns: 1fr 1fr; } }
.opt { text-align: start; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface-2); display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; font-size: 1.02rem; transition: border-color .15s, background .15s, transform .1s; }
.opt:hover:not([disabled]) { border-color: var(--accent); transform: translateY(-1px); }
.opt .k { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: var(--t-xs); font-weight: 700; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.opt.right { border-color: var(--good); background: color-mix(in oklab, var(--good) 12%, var(--surface)); }
.opt.right .k { background: var(--good); color: #fff; border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: color-mix(in oklab, var(--bad) 10%, var(--surface)); animation: shake .35s; }
.opt.wrong .k { background: var(--bad); color: #fff; border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.opt.center { grid-template-columns: 1fr; text-align: center; justify-items: center; font-weight: 700; }
@keyframes shake { 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
.feedback { padding: 14px 16px; border-radius: 16px; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.feedback.ok { background: color-mix(in oklab, var(--good) 10%, var(--surface)); border: 1px solid color-mix(in oklab, var(--good) 35%, var(--line)); }
.feedback.no { background: color-mix(in oklab, var(--bad) 8%, var(--surface)); border: 1px solid color-mix(in oklab, var(--bad) 30%, var(--line)); }
.feedback svg { width: 24px; height: 24px; }
.feedback.ok svg { color: var(--good); } .feedback.no svg { color: var(--bad); }
.feedback b { display: block; }
.timer { position: relative; width: 52px; height: 52px; flex: none; }
.timer svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 5; }
.timer .bgc { stroke: var(--surface-2); }
.timer .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.timer.low .fg { stroke: var(--bad); }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.result { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.result .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1.3; background: linear-gradient(135deg, var(--accent), var(--coral)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.result .stars svg { width: 46px; height: 46px; }
.result .stars .on { animation: starin .6s backwards; }
.result .stars .on:nth-child(2) { animation-delay: .15s; } .result .stars .on:nth-child(3) { animation-delay: .3s; }
@keyframes starin { from { transform: scale(0) rotate(-90deg); } }
.review-list { display: flex; flex-direction: column; gap: 10px; text-align: start; width: 100%; }
.review-item { padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: .95rem; }
.review-item .ans { color: var(--good); font-weight: 600; }

.arena { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }
.game-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; min-height: 190px; transition: transform .15s, border-color .2s; }
.game-card:hover { transform: translateY(-3px); border-color: var(--hc); }
.game-card .gi { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in oklab, var(--hc) 14%, transparent); color: var(--hc); }
.game-card .gi svg { width: 28px; height: 28px; }
.game-card h3 { font-size: var(--t-lg); }
.game-card p { color: var(--ink-2); font-size: .95rem; flex: 1; }
.game-card .best { font-size: var(--t-xs); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.game-card::after { content: ""; position: absolute; inset-inline-end: -40px; top: -40px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, color-mix(in oklab, var(--hc) 18%, transparent), transparent 70%); }

.rule-btns { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); }
.rule-btn { padding: 14px 10px; border-radius: 14px; border: 1.5px solid color-mix(in oklab, var(--hc) 40%, var(--line)); background: color-mix(in oklab, var(--hc) 8%, var(--surface)); color: var(--ink); font-weight: 700; }
.rule-btn:hover:not([disabled]) { background: color-mix(in oklab, var(--hc) 20%, var(--surface)); }
.rule-btn.right { background: var(--good); color: #fff; border-color: var(--good); }
.rule-btn.wrong { background: var(--bad); color: #fff; border-color: var(--bad); }

.sifat-board { display: flex; flex-direction: column; gap: 10px; }
.sifat-row { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 600; }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.toggle.right { box-shadow: 0 0 0 3px color-mix(in oklab, var(--good) 50%, transparent); }
.toggle.wrong { box-shadow: 0 0 0 3px color-mix(in oklab, var(--bad) 60%, transparent); }
.toggle.miss { border-style: dashed; border-color: var(--good); color: var(--good); }

.verse-card { font-family: var(--f-quran); color: var(--verse); font-size: clamp(1.25rem, 4vw, 1.6rem); line-height: 2.1; text-align: center; }
.verse-card .gap { display: inline-block; min-width: 90px; border-bottom: 2px dashed var(--verse); color: transparent; }
.verse-card .gap.fill { color: var(--good); border-color: var(--good); }

/* flashcards */
.flip { perspective: 1200px; }
.flip-inner { position: relative; min-height: 260px; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; cursor: pointer; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px; padding: 26px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; text-align: center; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.face.back { transform: rotateY(180deg); background: linear-gradient(160deg, color-mix(in oklab, var(--accent) 12%, var(--surface)), var(--surface)); }
.face .term { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.5rem, 5.5vw, 2.1rem); }
.face .ansr { font-size: 1.18rem; line-height: 1.9; }
.boxes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.box { padding: 6px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: var(--t-xs); text-align: center; min-width: 64px; }
.box b { display: block; font-size: var(--t-lg); font-variant-numeric: tabular-nums; }

/* letters lab */
.letter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; }
.lbtn { aspect-ratio: 1; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--f-quran); font-size: 1.7rem; display: grid; place-items: center; color: var(--ink); max-width: 100%; }
.lbtn:hover { border-color: var(--accent); }
.lbtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.lbtn.hl { border-color: var(--gold); background: color-mix(in oklab, var(--gold) 16%, var(--surface)); }
.letter-panel { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .letter-panel { grid-template-columns: 140px 1fr; } }
.big-letter { font-family: var(--f-quran); font-size: 5.5rem; line-height: 1.1; color: var(--accent); text-align: center; background: var(--surface-2); border-radius: 22px; padding: 10px; }
.sifa-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sifa-chip { padding: 4px 12px; border-radius: 99px; font-size: var(--t-sm); font-weight: 600; background: color-mix(in oklab, var(--hc) 13%, transparent); color: var(--hc); border: 1px solid color-mix(in oklab, var(--hc) 30%, transparent); }
.sifa-chip.solo { --hc: var(--gold); }

/* badges */
.badges { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.badge { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.badge .bi { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.badge .bi svg { width: 24px; height: 24px; }
.badge.on .bi { background: radial-gradient(circle at 35% 30%, #fff, #f2e3c2 50%, #d4b57a); color: #6b4a12; box-shadow: 0 0 0 3px color-mix(in oklab, var(--gold) 30%, transparent); }
.badge:not(.on) { opacity: .62; }
.badge b { display: block; font-size: .95rem; }
.badge small { color: var(--muted); font-size: var(--t-xs); line-height: 1.5; display: block; }

/* toast + overlay */
.toasts { position: fixed; inset-inline: 0; top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px -10px rgb(0 0 0 / .4); font-weight: 600; animation: tin .35s ease; max-width: 100%; }
.toast svg { width: 20px; height: 20px; color: var(--gold); flex: none; }
@keyframes tin { from { transform: translateY(-14px); opacity: 0; } }
.overlay { position: fixed; inset: 0; z-index: 80; background: rgb(4 16 18 / .5); display: grid; align-items: start; justify-items: center; padding: calc(env(safe-area-inset-top, 0px) + 60px) 16px 16px; backdrop-filter: blur(4px); }
.search-box { width: min(640px, 100%); background: var(--surface); border-radius: 22px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; max-height: 80vh; }
.search-box input { border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 18px 20px; font: inherit; font-size: 1.1rem; color: var(--ink); outline: none; }
.search-res { overflow-y: auto; padding: 8px; }
.sres { display: block; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: inherit; }
.sres:hover, .sres:focus { background: var(--surface-2); }
.sres b { display: block; font-size: .95rem; }
.sres small { color: var(--muted); font-size: var(--t-sm); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sres mark { background: color-mix(in oklab, var(--gold) 35%, transparent); color: inherit; border-radius: 3px; }
canvas.fx { position: fixed; inset: 0; pointer-events: none; z-index: 95; width: 100%; height: 100%; }

.empty { text-align: center; padding: 30px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.footer-note { margin-top: 40px; font-size: var(--t-xs); color: var(--muted); text-align: center; line-height: 1.8; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .bubbles { display: none; }
}

/* ── لمسات الألوان ── */
.game-card .gi { background: linear-gradient(140deg, color-mix(in oklab, var(--hc) 65%, #fff), var(--hc)); color: #fff; box-shadow: 0 10px 20px -10px var(--hc); }
.game-card { border-top: 4px solid var(--hc); }
.stat { position: relative; overflow: hidden; }
.stat::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--sc, var(--accent)); }
.stats .stat:nth-child(1) { --sc: var(--accent); } .stats .stat:nth-child(2) { --sc: var(--h-teal); }
.stats .stat:nth-child(3) { --sc: var(--coral); } .stats .stat:nth-child(4) { --sc: var(--gold); }
.stat b { color: var(--sc, var(--ink)); }
.unit-head { background: linear-gradient(150deg, color-mix(in oklab, var(--hc) 22%, var(--surface)), color-mix(in oklab, var(--hc) 6%, var(--surface)) 55%, var(--surface)); }
.lesson-item.read .lesson-num { background: linear-gradient(140deg, color-mix(in oklab, var(--hc) 70%, #fff), var(--hc)); }
.mini-progress i, .readbar i { background: linear-gradient(90deg, color-mix(in oklab, var(--hc) 60%, #fff), var(--hc)); }
.qbar i { background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--coral)); }
.navlink[aria-current="page"] { color: var(--accent); background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 14%, transparent), color-mix(in oklab, var(--accent-2) 10%, transparent)); }
.rail { background: color-mix(in oklab, var(--surface) 70%, transparent); }
.chip-stat { box-shadow: var(--shadow); }
.toggle[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
.lbtn.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
.big-letter { background: linear-gradient(150deg, color-mix(in oklab, var(--accent) 14%, var(--surface)), color-mix(in oklab, var(--coral) 10%, var(--surface))); }
.face.back { background: linear-gradient(150deg, color-mix(in oklab, var(--accent) 16%, var(--surface)), color-mix(in oklab, var(--coral) 10%, var(--surface))); }
.quiz-cta { border-style: solid; border-width: 1.5px; }
.timer .fg { stroke: var(--accent); }

  { q: 'يقرأ بالدور ولم يكن هو المبتدئ. ما حكم الاستعاذة؟', o: ['يُسرّ بها لتتصل القراءة', 'يجهر بها', 'يتركها مطلقاً', 'يعيد البسملة'], a: 0, e: 'يُسر بها إذا كان يقرأ بالدور ولم يكن المبتدئ، لتتصل القراءة.', p: 11 },
  { q: 'كم وجهاً للاستعاذة مع البسملة مع أول السورة؟', o: ['أربعة', 'ثلاثة', 'وجهان', 'خمسة'], a: 0, e: 'أربعة أوجه: قطع الجميع، قطع الاستعاذة ووصل البسملة بأول السورة، وصل الاستعاذة بالبسملة والوقف عليها، وصل الجميع.', p: 12 },
  { q: 'كم وجهاً للاستعاذة مع أول سورة «براءة»؟', o: ['وجهان', 'أربعة', 'ثلاثة', 'وجه واحد'], a: 0, e: 'وجهان: الوقف والوصل، من غير بسملة.', p: 12 },
  { q: 'قطع القارئ قراءته ليردّ السلام. ماذا يفعل؟', o: ['يعيد الاستعاذة', 'لا يعيد الاستعاذة', 'يعيد البسملة فقط', 'يبدأ السورة من أولها'], a: 0, e: 'إن كان العارض غير ضروري كرد السلام فإنه يعيد الاستعاذة.', p: 12 },

  { q: 'حكم البسملة في أول كل سورة سوى «براءة»:', o: ['أجمع القراء على وجوب الإتيان بها', 'مستحبة', 'مخيّر', 'لا تُقرأ'], a: 0, e: 'أجمع القراء على وجوب الإتيان بالبسملة في أول كل سورة سوى سورة براءة.', p: 13 },
  { q: 'البسملة أثناء السورة:', o: ['القارئ مخيّر، والإتيان بها أفضل', 'واجبة', 'ممنوعة', 'مكروهة'], a: 0, e: 'القارئ مخير بين الإتيان بها وعدمه، والإتيان بها أفضل.', p: 13 },
  { q: 'كم وجهاً جائزاً للبسملة بين سورتين (ما عدا براءة)؟', o: ['ثلاثة', 'أربعة', 'وجهان', 'خمسة'], a: 0, e: 'قطع الكل، الوقف على آخر السورة ووصل البسملة بأول التالية، وصل الكل.', p: 13 },
  { q: 'أيّ هذه الأوجه لا يجوز بين السورتين؟', o: ['وصل آخر السورة بالبسملة مع الوقف عليها', 'قطع الكل', 'وصل الكل', 'الوقف على آخر السورة ووصل البسملة بالتالية'], a: 0, e: 'لا يجوز لأن فيه إيهاماً بأن البسملة لآخر السورة السابقة.', p: 14 },

  { q: 'أوجه الأوجه الثلاثة بين السورتين تجوز سواء رُتّبتا في التلاوة أم لم تُرتّبا.', tf: true, e: 'تجوز بين كل سورتين سواء رتبتا كآخر الفاتحة مع أول البقرة، أم لم ترتبا كآخر الفاتحة مع أول المائدة.', p: 13 },
  { q: 'إذا ابتدأ بقوله تعالى ﴿الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ﴾ فيستحب له:', o: ['عدم الإتيان بالبسملة أو قطعها عما بعدها', 'وصل الاستعاذة بالآية', 'الإتيان بالبسملة ووصلها', 'ترك الاستعاذة'], a: 0, e: 'يستحب وجهان: عدم الإتيان بالبسملة، أو قطع البسملة عما بعدها.', p: 15 },
  { q: 'إذا ابتدأ بقوله تعالى ﴿اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا﴾ فيستحب له:', o: ['قطع الاستعاذة عما بعدها، أو الإتيان بالبسملة بعدها', 'وصل الاستعاذة بالآية', 'ترك البسملة وجوباً', 'السكت'], a: 0, e: 'لبشاعة الوصل وإفساد المعنى: قطع الاستعاذة عما بعدها، أو الإتيان بالبسملة بعد الاستعاذة.', p: 14 }

const TOOTH_SEQ = [0, 1, 2, 3, 4, 4, 4, 5];

function necklaceSVG() {
  const P0 = [18, 26], P1 = [160, 250], P2 = [302, 26];

  let pearls = '';
  UNITS.forEach((u, i) => {
    const [x, y] = pt(.92 - i * (.84 / 9)); const done = unitDone(u); const some = u.lessons.some((_, k) => S.read[u.id + '-' + k]);
    pearls += done
      ? `<g><circle cx="${x}" cy="${y}" r="15" fill="url(#np)" filter="url(#glow)"/><circle cx="${x - 5}" cy="${y - 5}" r="4" fill="#fff" opacity=".9"/></g>`
      : `<g><circle cx="${x}" cy="${y}" r="12" class="pearl-empty" ${some ? 'style="stroke:#e3b453;stroke-dasharray:none"' : ''}/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.7)">${ar(u.no)}</text></g>`;
  });
  return `<svg class="necklace" viewBox="0 0 320 210" role="img" aria-label="عقد الدرر: ${ar(doneUnits())} من ${ar(10)} وحدات">
    <defs><radialGradient id="np" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f6ecd8"/><stop offset="1" stop-color="#c8a56a"/></radialGradient>

    <path d="M${P0} Q${P1} ${P2}" fill="none" stroke="rgba(227,180,83,.75)" stroke-width="1.6"/>

}

/* ───────── البحث في الكتاب ───────── */
let INDEX = null;
function buildIndex() {
  INDEX = [];
  const walk = (v, out) => { if (typeof v === 'string') out.push(v); else if (Array.isArray(v)) v.forEach(x => walk(x, out)); else if (v && typeof v === 'object') Object.keys(v).forEach(k => { if (k !== 'k' && k !== 'go' && k !== 'z' && k !== 'mode') walk(v[k], out); }); };
  UNITS.forEach(u => u.lessons.forEach((l, i) => { const out = []; walk(l.blocks, out); INDEX.push({ u, i, l, text: plainText(out.join(' ')), norm: stripHarakat(plainText(out.join(' ') + ' ' + l.title)) }); }));
}
function openSearch() {
  if (!INDEX) buildIndex();
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="search-box" role="dialog" aria-label="البحث في الكتاب"><input id="sq" type="search" placeholder="ابحث عن حكم، مصطلح، أو كلمة… مثل: القلقلة" autocomplete="off"><div class="search-res" id="sr"><div class="empty">اكتب كلمة للبحث في كلّ دروس الكتاب.</div></div></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  const inp = $('#sq', ov); inp.focus();
  inp.addEventListener('input', () => {
    const q = stripHarakat(inp.value.trim()); const box = $('#sr', ov);
    if (q.length < 2) { box.innerHTML = '<div class="empty">اكتب حرفين على الأقل.</div>'; return; }
    const res = INDEX.filter(x => x.norm.includes(q)).slice(0, 30);
    box.innerHTML = res.length ? res.map(x => { const t = stripHarakat(x.text); const at = Math.max(0, t.indexOf(q) - 40); const snip = t.slice(at, at + 120); return `<a class="sres" href="#${x.u.id}-${x.i}"><b>${esc(x.l.title)} <span class="tag hue-${x.u.hue}">${esc(x.u.short)}</span></b><small>${esc(snip).replace(esc(q), '<mark>' + esc(q) + '</mark>')}</small></a>`; }).join('') : '<div class="empty">لا توجد نتائج. جرّب كلمة أخرى بلا تشكيل.</div>';
    $$('.sres', box).forEach(a => a.addEventListener('click', close));
  });
}

/* ───────── المحرّك: الاختبارات ───────── */
let cleanup = null;
const setCleanup = fn => { if (cleanup) cleanup(); cleanup = fn; };
function normQ(q, key) {
  if (q.tf !== undefined) return { q: q.q, opts: ['صواب', 'خطأ'], a: q.tf ? 0 : 1, e: q.e, p: q.p, key, tf: true };
  const order = shuffle(q.o.map((t, i) => ({ t, i })));

  <div class="section card"><b>حول هذه المنصّة</b><p class="muted">بُنيت هذه الأداة لتيسير دراسة كتاب «الدر الثمين في تجويد كلام رب العالمين» تأليف محمد حمزة عطار وأحمد خلوف أديب (مؤسسة إتقان للتعليم والتنمية، سلسلة مطبوعات إتقان ١). المحتوى مأخوذ من الكتاب دون إضافة من مصادر أخرى. يُحفظ تقدّمك على هذا الجهاز فقط.</p><div class="row"><button class="btn ghost sm" id="reset">مسح التقدّم والبدء من جديد</button><span id="rs" class="muted"></span></div></div>`;
};
V.mountMe = () => {
  let armed = false; $('#reset').onclick = () => { if (!armed) { armed = true; $('#rs').textContent = 'اضغط مرّة أخرى للتأكيد — سيُحذف كلّ التقدّم.'; $('#reset').classList.add('gold'); return; } S = blank(); save(); updateChrome(); toast('تمّ مسح التقدّم', 'redo'); route(true); };
};

/* ───────── التوجيه ───────── */
function setNav(name) { $$('[data-nav]').forEach(a => a.setAttribute('aria-current', a.dataset.nav === name ? 'page' : 'false')); }
function route(force) {
  setCleanup(null);
  const h = (location.hash || '#home').slice(1); const main = $('#main'); let nav = 'home';
  let m;
  if (h === 'home' || h === '') { main.innerHTML = V.home(); }
  else if (h === 'journey') { nav = 'journey'; main.innerHTML = V.journey(); }
  else if ((m = h.match(/^(u\d+)-(\d+)$/)) && unitById(m[1]) && unitById(m[1]).lessons[+m[2]]) { nav = 'journey'; const u = unitById(m[1]); main.innerHTML = V.lesson(u, +m[2]); V.mountLesson(u, +m[2]); }
  else if ((m = h.match(/^(u\d+)$/)) && unitById(m[1])) { nav = 'journey'; main.innerHTML = V.unit(unitById(m[1])); }
  else if ((m = h.match(/^quiz-(.+)$/))) {
    nav = 'journey'; const t = m[1];
    if (unitById(t)) {
      const u = unitById(t);
      quizRun({ title: 'اختبار: ' + u.title, hue: u.hue, back: u.id, questions: unitQuestions(u.id, 10), onDone: r => {
        const prev = S.quiz[u.id] || { best: 0, stars: 0 }; const bonus = Math.max(0, r.stars - prev.stars) * 10; const wasDone = prev.best >= .7;
        S.quiz[u.id] = { best: Math.max(prev.best, r.pct), stars: Math.max(prev.stars, r.stars) }; save();
        if (!wasDone && r.pct >= .7) setTimeout(() => toast('أضفت دُرّة «' + u.short + '» إلى عقدك!', 'pearl'), 400);
        return bonus;
      } });
    } else if (t === 'daily') {
      nav = 'home'; const all = []; UNITS.forEach(u => QUIZ[u.id].forEach((q, k) => all.push([u.id, k])));
      let seed = today().split('-').join('') | 0; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const qs = []; const used = new Set(); while (qs.length < 7) { const x = all[Math.floor(rnd() * all.length)]; const kk = x.join(':'); if (!used.has(kk)) { used.add(kk); qs.push(normQ(QUIZ[x[0]][x[1]], kk)); } }
      quizRun({ title: 'تحدّي اليوم', hue: 'gold', back: 'home', questions: qs, onDone: () => { if (S.daily !== today()) { S.daily = today(); save(); return 15; } return 0; } });
    } else if (t === 'final') {
      const qs = []; UNITS.forEach(u => qs.push(...unitQuestions(u.id, 3)));
      quizRun({ title: 'الامتحان الشامل', hue: 'gold', back: 'journey', questions: shuffle(qs), onDone: r => { const prev = S.quiz.final || { best: 0, stars: 0 }; S.quiz.final = { best: Math.max(prev.best, r.pct), stars: Math.max(prev.stars, r.stars) }; save(); return r.pct >= .8 ? 30 : 0; } });
    } else if (t === 'mistakes') {
      nav = 'home'; const ks = Object.keys(S.mistakes); if (!ks.length) { location.hash = '#review'; return; }
      quizRun({ title: 'دفتر الأخطاء', hue: 'red', back: 'home', questions: shuffle(ks).slice(0, 12).map(kk => { const [u, i] = kk.split(':'); return QUIZ[u] && QUIZ[u][+i] ? normQ(QUIZ[u][+i], kk) : null; }).filter(Boolean) });
    } else { location.hash = '#home'; return; }
  }
  else if (h === 'arena') { nav = 'arena'; main.innerHTML = V.arena(); }
  else if ((m = h.match(/^g-(\w+)$/)) && GAMES[m[1]]) {
    nav = 'arena'; const g = GAMES[m[1]];
    ({ sort: () => gameSort(m[1]), tf: gameTF, madd: gameMadd, verse: gameVerse, sifat: gameSifat, makhraj: gameMakhraj })[g.kind]();
  }
  else if (h === 'review') { nav = 'review'; main.innerHTML = V.review(); V.mountReview(); }
  else if (h === 'lab') { nav = 'lab'; main.innerHTML = V.lab(); V.mountLab(); }
  else if (h === 'me') { nav = 'me'; main.innerHTML = V.me(); V.mountMe(); }
  else { location.hash = '#home'; return; }
  setNav(nav); updateChrome();
  window.scrollTo(0, 0);
}

/* ───────── التشغيل ───────── */
function start() {
  shell(); touchStreak(); route();
  addEventListener('hashchange', () => route());
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    if (e.key === '/' ) { e.preventDefault(); openSearch(); }
    const opts = $$('.opt:not([disabled])'); const n = { '1': 0, '2': 1, '3': 2, '4': 3 }[e.key];
    if (n !== undefined && opts[n]) opts[n].click();
    if (e.key === 'Enter' && $('#nx') && document.activeElement !== $('#nx')) { e.preventDefault(); $('#nx').click(); }
  });
  checkBadges();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({ hash: location.hash })); } catch (e) { } }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
