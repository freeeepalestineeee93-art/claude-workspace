<title>كرسي المخرج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F5F6F8; --line:#D9DDE3; --line-strong:#BFC5CE;
  --ink:#14171C; --ink-2:#475061; --ink-3:#737C8C;
  --accent:#0B6A86; --accent-ink:#FFFFFF; --accent-soft:#DDEFF4;
  --amber:#9A5500; --amber-soft:#FBEBD3;
  --ok:#1E7B45; --ok-soft:#DDF2E4; --danger:#B42318; --danger-soft:#FBE3E0; --focus:#2D6CDF;
  --code-bg:#F3F5F8;
  --shadow:0 1px 2px rgba(20,24,32,.05),0 10px 28px -16px rgba(20,24,32,.22);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1115; --surface:#171A20; --surface-2:#1D2129; --line:#2A2F39; --line-strong:#3A404C;
    --ink:#E9EBEF; --ink-2:#B2B8C3; --ink-3:#848C9A;
    --accent:#57C3DD; --accent-ink:#06222B; --accent-soft:#10303A;
    --amber:#F0A94B; --amber-soft:#2E2211;
    --ok:#5BCB8A; --ok-soft:#11281B; --danger:#FF8A7A; --danger-soft:#33150F; --focus:#7FA8FF;
    --code-bg:#12151B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1115; --surface:#171A20; --surface-2:#1D2129; --line:#2A2F39; --line-strong:#3A404C;
  --ink:#E9EBEF; --ink-2:#B2B8C3; --ink-3:#848C9A;
  --accent:#57C3DD; --accent-ink:#06222B; --accent-soft:#10303A;
  --amber:#F0A94B; --amber-soft:#2E2211;
  --ok:#5BCB8A; --ok-soft:#11281B; --danger:#FF8A7A; --danger-soft:#33150F; --focus:#7FA8FF;
  --code-bg:#12151B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;background:none;border:0;padding:0}
.brand svg{width:26px;height:26px;color:var(--accent)}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--ink-3)}
.spacer{flex:1}
.icon-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding-inline:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13.5px}
.icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
@media (max-width:560px){.brand small,.icon-btn .lbl{display:none}}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding-inline:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--line-strong)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.big{min-height:50px;font-family:var(--f-display);font-size:17px;padding-inline:22px;border-radius:12px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:30px;padding-inline:10px;font-size:13px;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
label.f .hint{font-weight:400;color:var(--ink-3);font-size:12.5px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14.5px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:90px;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 13px;font-size:13.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge.amb{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.badge.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.badge.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.notice{font-size:13.5px;border-radius:10px;padding:10px 13px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.notice.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.notice.err{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.sec{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.sec h2{font-size:19px;font-weight:600}
.sec .rule{flex:1;height:1px;background:var(--line)}
.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:14px}

/* home */
.hero{padding:34px 0 8px}
.hero h1{font-size:clamp(26px,4vw,38px);font-weight:700}
.hero p{color:var(--ink-2);max-width:62ch;margin:8px 0 0}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:24px}
@media (max-width:820px){.modes{grid-template-columns:1fr}}
.mode{position:relative;text-align:start;padding:20px 20px 18px;display:flex;flex-direction:column;gap:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.mode:hover{border-color:var(--accent)}
.mode .slate{position:absolute;inset-inline:0;top:0;height:7px;background:repeating-linear-gradient(-45deg,var(--ink) 0 10px,var(--surface) 10px 20px);opacity:.85}
.mode h3{font-size:20px;font-weight:600;margin-top:8px}
.mode p{margin:0;color:var(--ink-2);font-size:14px}
.mode .steps{font-size:12.5px;color:var(--ink-3)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.newform{margin-top:14px;padding:18px;display:grid;grid-template-columns:1.2fr 2fr auto;gap:14px;align-items:end}
@media (max-width:820px){.newform{grid-template-columns:1fr}}
.lib{margin-top:34px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pcard:hover{border-color:var(--line-strong)}
.pcard b{font-family:var(--f-display);font-weight:600;font-size:16px;overflow-wrap:anywhere}
.pcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.pcard .date{font-size:12px;color:var(--ink-3)}

/* project */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;justify-content:space-between;padding:24px 0 14px}
.phead h1{font-size:clamp(22px,3.2vw,30px);font-weight:700;overflow-wrap:anywhere}
.phead .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-size:14.5px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.card{padding:18px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:16px;font-weight:600}

/* characters */
.chars{display:flex;flex-direction:column;gap:10px}
.charrow{display:grid;grid-template-columns:1fr 2fr 1.4fr auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
@media (max-width:760px){.charrow{grid-template-columns:1fr}}
.charrow textarea{min-height:60px}

/* images */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.thumb{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.thumb .pic{position:relative;border:0;padding:0;background:none;border-radius:7px;overflow:hidden;aspect-ratio:1;display:block;width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb input{font-size:12px;padding:5px 7px;border-radius:7px}
.thumb.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb .num{position:absolute;top:6px;inset-inline-start:6px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;padding-inline:6px}
.thumb .del{position:absolute;top:6px;inset-inline-end:6px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.thumb .del svg{width:14px;height:14px}
.upl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:128px;border:1.5px dashed var(--line-strong);border-radius:10px;color:var(--ink-3);font-size:13px;text-align:center;padding:10px;cursor:pointer;background:var(--surface)}
.upl:hover,.upl.over{border-color:var(--accent);color:var(--accent)}
.upl svg{width:22px;height:22px}

/* script */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:26px;border:1.5px dashed var(--line-strong);border-radius:14px;background:var(--surface);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop b{font-family:var(--f-display);font-size:18px;font-weight:600}
.scenelist{display:flex;flex-direction:column;gap:10px}
.scene{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.scene .no{font-family:var(--f-mono);font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 9px;grid-row:span 2}
.scene b{font-weight:600}
.scene .sum{grid-column:2;color:var(--ink-2);font-size:14px}
.scene .plan{grid-column:2;font-size:13px;color:var(--ink-3)}
.scene .acts{grid-row:1 / span 3;grid-column:3;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:600px){.scene{grid-template-columns:1fr}.scene .no{grid-row:auto;justify-self:start}.scene .sum,.scene .plan{grid-column:1}.scene .acts{grid-row:auto;grid-column:1;flex-direction:row;align-items:center}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
ul.clean{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}

/* suggestions */
.suggs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sugg{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sugg b{font-weight:600;font-size:14.5px}
.sugg p{margin:0;font-size:13.5px;color:var(--ink-2)}
.sugg .yn{display:flex;gap:6px;margin-top:4px}
.sugg.yes{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 60%,var(--surface))}
.sugg.no{opacity:.55}
.yn button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:2px 12px;font-size:13px}
.yn button[aria-pressed="true"].y{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button[aria-pressed="true"].n{background:var(--ink-3);border-color:var(--ink-3);color:var(--bg)}
.styleopt{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.styleopt pre{white-space:pre-wrap;direction:ltr;text-align:left;font-family:var(--f-mono);font-size:12.5px;background:var(--code-bg);border-radius:8px;padding:10px;margin:0;max-height:180px;overflow:auto}

/* workbench */
.wb{padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
@media (max-width:820px){.wb{grid-template-columns:1fr}}
.wb .full{grid-column:1 / -1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.dur{display:flex;align-items:center;gap:8px}
.dur input{width:110px;font-family:var(--f-mono);font-size:18px;text-align:center}
.dur .unit{font-size:14px;color:var(--ink-2)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.check input{margin-top:5px}
.go-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* busy */
.busy{position:fixed;inset-inline:0;bottom:0;z-index:40;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -16px rgba(0,0,0,.3)}
.busy .wrap{display:flex;align-items:center;gap:12px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.busy .msg{flex:1;font-size:14px}

/* results */
.result{margin-top:26px;display:flex;flex-direction:column;gap:18px}
.rhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rhead h2{font-size:21px;font-weight:600}
.summary{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.summary p{margin:0}
.q-banner{display:flex;gap:10px;align-items:flex-start}
.unit{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.clap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);position:relative}
.clap::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:repeating-linear-gradient(-45deg,var(--ink) 0 8px,transparent 8px 16px);opacity:.7}
.clap .no{font-family:var(--f-display);font-weight:700;font-size:16px}
.clap .t{color:var(--ink-2);font-size:14px}
.ubody{padding:16px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink-3);font-size:12.5px;font-weight:600;padding-top:2px}
.kv dd{margin:0}
.need{display:flex;flex-wrap:wrap;gap:6px}
.need .badge{direction:rtl}
.need code{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pbox{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ptabs{display:flex;gap:4px;flex-wrap:wrap}
.ptab{border:1px solid transparent;background:none;border-radius:8px;padding:4px 11px;font-size:13px;color:var(--ink-2)}
.ptab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.pbar .count{margin-inline-start:auto}
pre.prompt{margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;font-family:var(--f-mono);font-size:12.8px;line-height:1.65;background:var(--code-bg);max-height:460px;overflow:auto}
.copy.done{border-color:var(--ok);color:var(--ok)}
.fix{display:flex;flex-direction:column;gap:8px;padding:12px;border-top:1px dashed var(--line);background:var(--surface)}
.fix .tip{font-size:12.8px;color:var(--ink-3)}
.fix textarea{min-height:64px}
.fix .row input{width:120px;font-family:var(--f-mono)}
.ustate{display:flex;align-items:center;gap:10px;padding:14px;color:var(--ink-3);font-size:14px}
.ustate.err{color:var(--danger)}
.change{font-size:13px;color:var(--ok)}

/* items */
.ilist{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);align-items:center}
.irow .open{border:0;background:none;padding:0;text-align:start;display:flex;flex-direction:column;gap:4px}
.irow b{font-weight:600;overflow-wrap:anywhere}
.irow .meta{display:flex;flex-wrap:wrap;gap:6px}
.confirm{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--danger)}

/* settings */
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:1.2fr .7fr .6fr 2.4fr auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
@media (max-width:860px){.mrow{grid-template-columns:1fr 1fr}.mrow textarea{grid-column:1 / -1}}
.mrow textarea{min-height:58px;font-size:13px}

.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div dir="rtl" lang="ar">
  <div class="top">
    <div class="wrap">
      <button class="brand" type="button" data-act="home" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 10 4.2 5.6a1 1 0 0 1 1.2-.7l14 3.6"/><path d="m8 5.8 2.6 3.9M13 7.1l2.6 3.9"/></svg>
        كرسي المخرج
        <small>إخراج بالذكاء الاصطناعي</small>

async function fileToDataURL(file) {
  const bmp = await createImageBitmap(file);
  for (const max of [1400, 1100, 850, 650]) {
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h);
    for (const qv of [0.86, 0.75, 0.62]) { const d = c.toDataURL("image/jpeg", qv); if (d.length < 190000) return { data: d, w, h }; }
  }
  throw new Error("too big");
}
function dataURLToBlob(d) {
  const [head, b64] = d.split(","); const mime = (head.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: mime });
}

async function readScriptFile(file) {

  if (ext === "docx") text = (await mammoth.extractRawText({ arrayBuffer: buf })).value;
  else if (ext === "txt") text = new TextDecoder("utf-8").decode(buf);
  else throw new Error("fmt");
  return text.replace(/\r/g, "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
const norm = s => s.replace(/[ً-ْـ]/g, "").replace(/[إأآ]/g, "ا").replace(/\s+/g, " ").trim();
function sliceScenes(text, scenes) {
  const nt = norm(text); const starts = []; let from = 0;
  for (const s of scenes) {
    const a = norm(s.anchor || ""); let i = a ? nt.indexOf(a, from) : -1;
    if (i < 0 && a) i = nt.indexOf(a.split(" ").slice(0, 3).join(" "), from);
    starts.push(i); if (i >= 0) from = i + 1;
  }
  return scenes.map((s, k) => {
    if (starts[k] < 0) return "";
    let end = nt.length; for (let j = k + 1; j < scenes.length; j++) if (starts[j] > starts[k]) { end = starts[j]; break; }
    return nt.slice(starts[k], end).trim();
  });
}

const DIRECTOR_CORE = `You are the director of this production: a world-class film director, director of photography and animation supervisor in one, working at top-studio feature standard. You turn script material into prompts for AI image and video generators. Those prompts must produce precise, intentional, professional results on the first try.

- Visual notes written into the script by an editor are hints only. You decide the directing.

- NO TEXT IN FRAME, EVER: no titles, captions, subtitles, dates, labels, numbers, logos, watermarks, UI or readable signage. When the script needs on-screen text (dates, place names, signs, maps, cards), leave clean negative space where the editor will add it, render any sign blank or illegible, and list the text under post_production. Every prompt's AVOID line includes on-screen text.

- Prompts are written in English. Every explanation for the user is in Arabic: clear, short, concrete.`;

function audioRules(b, out) {

  else L.push("DIALOGUE MODE: none. No speech at all.");
  L.push(b.music ? "MUSIC: allowed when it serves the scene; describe only its mood briefly." : "MUSIC: strictly forbidden. Every video prompt states: NO music, no background score.");

function unitsRules(w, m) {

    return `${mode}
TOTAL DURATION: ${w.duration} seconds, set by the user. Respect it exactly: the clip durations must sum to ${w.duration} (±1 s).
MAX PER GENERATION with ${m.name}: ${max} s. ${w.vmode === "startend" ? "" : `If the total is above ${max} s, split into the fewest clips possible, each ≤ ${max} s, cutting at dramatic turning points (never at the arithmetic middle).`}
Every clip is complete on its own: it opens on a clear action and ends on a completed action held in a stable, readable pose that can serve as the linking frame for the next clip. From clip 2 on, @Image1 is the final frame of the previous clip (the user extracts it) and the scene images follow as @Image2, @Image3… in the same order; the clip opens exactly on that frame and moves into a new action.`;

async function loadAll() {

function mergeSettings(s) {

}
async function createProject(mode, name, type) {
  const p = { kind: "project", id: nid("p"), name: name || MODES[mode].ar + " جديد", mode, type, createdAt: Date.now(), updatedAt: Date.now(), bible: BLANK_BIBLE(), script: null, analysis: null, suggState: {} };
  if (type === "reels") p.bible.aspect = "9:16";

async function openProject(id, tab) {

  const p = S.cur; if (!p) return;

  const i = S.projects.findIndex(x => x.id === p.id); if (i >= 0) S.projects[i] = clone(p);

async function deleteProject(id) {
  try {
    const [imgs, items] = await Promise.all([store.list(P.imgs(id)), store.list(P.items(id))]);
    for (const d of imgs) await store.del(P.imgs(id) + "/" + d.id);

const refsOf = item => item.refs.map(r => { const im = S.images.find(i => i.id === r.id); return im ? { ...im, label: im.label || r.label } : null; }).filter(Boolean);
async function planAndWrite(item, extra) {
  const p = S.cur, w = item.input, refs = refsOf(item);
  const blobs = refs.map(r => dataURLToBlob(r.data));
  const signal = busyStart("المخرج عم يقرأ ويخطط الإخراج…");
  render();
  try {
    const plan = cleanPlan(await ask(planPrompt(p, { ...w, model: w.model }, refs, extra), { images: blobs, signal }), w.out);
    if (!plan.units.length) throw { code: "empty_plan" };
    item.plan = plan; item.sugg = {}; item.units = plan.units.map(u => ({ n: u.n, status: "pending", long: "", short: "", custom: "", change: "", versions: [] }));
    item.updatedAt = Date.now(); await storeItem(item); render();
    for (const u of item.units) {
      if (signal.aborted) break;
      busyMsg(`يكتب البرومبت ${u.n} من ${item.units.length}…`);
      await writeUnit(item, u, {}, signal, blobs);
    }
  } catch (e) {
    if (e?.code !== "cancelled") toast(e?.code === "empty_plan" ? "ما طلعت خطة. عدّل الوصف وجرّب." : e?.code === "no_sample" ? "افتح الأداة من claude.ai." : errMsg(e));
  } finally { busyEnd(); render(); }
}
async function writeUnit(item, u, extra, signal, blobs) {
  const p = S.cur, w = item.input, refs = refsOf(item);
  const pu = item.plan.units.find(x => x.n === u.n);
  u.status = "working"; u.err = ""; render();
  try {
    const r = await ask(unitPrompt(p, w, refs, item.plan, pu, extra), { images: blobs || refs.map(x => dataURLToBlob(x.data)), signal });
    let long = str(r?.long), short = str(r?.short);
    if (!long && !short) throw { code: "empty_completion" };
    const T = S.settings.targets[w.out === "video" ? "video" : "image"];
    if (short.length >= T.split && !signal.aborted) {
      busyMsg("يختصر النسخة القصيرة لتحت " + T.split + " حرف…");
      try { const c = await ask(condensePrompt(short || long, T.shortMax, w.out), { signal, tier: "default" }); if (str(c?.text)) short = str(c.text); } catch (e) { if (e?.code === "cancelled") throw e; }
    }
    if (u.long) { u.versions.unshift({ long: u.long, short: u.short, note: extra.note || "", at: Date.now() }); u.versions = u.versions.slice(0, 4); }
    u.long = long; u.short = short; u.custom = ""; u.change = str(r?.change_ar); u.status = "done";
  } catch (e) {

}

async function retryUnit(n) {
  const item = S.item, u = item?.units.find(x => x.n === n); if (!u) return;
  const signal = busyStart("يكتب البرومبت " + n + "…");
  try { await writeUnit(item, u, {}, signal); } catch (e) { if (e?.code !== "cancelled") toast(errMsg(e)); } finally { busyEnd(); render(); }
}
async function customLimit(n) {
  const item = S.item, u = item?.units.find(x => x.n === n); if (!u) return;
  const lim = Math.round(Number($("#lim-" + n)?.value));
  if (!(lim >= 300)) { toast("اكتب حد الأحرف (300 أو أكثر)."); return; }
  const signal = busyStart("يجهّز نسخة بحد " + num(lim) + " حرف…");
  try {
    const c = await ask(condensePrompt(u.long || u.short, lim, item.input.out), { signal, tier: "default" });
    u.custom = str(c?.text); u.customLimit = lim; S.ptab[item.id + n] = "custom";
    item.updatedAt = Date.now(); await storeItem(item);
  } catch (e) { if (e?.code !== "cancelled") toast(errMsg(e)); }
  finally { busyEnd(); render(); }
}
async function replan(withNote) {
  const item = S.item; if (!item?.plan) return;
  const note = withNote ? str($("#planNote")?.value) : "";
  if (withNote && !note) { toast("اكتب ملاحظتك على الإخراج أولاً."); return; }
  const sg = item.plan.suggestions;
  const yes = sg.filter((s, i) => item.sugg[i] === "yes"), no = sg.filter((s, i) => item.sugg[i] === "no");
  if (!withNote && !yes.length) { toast("اقبل اقتراح واحد على الأقل."); return; }
  item.approved = [...item.approved, ...yes]; item.rejected = [...item.rejected, ...no];
  await planAndWrite(item, { approved: item.approved, rejected: item.rejected, note, prevPlan: withNote ? JSON.stringify({ summary: item.plan.summary_ar, units: item.plan.units.map(u => ({ n: u.n, title: u.title_ar, shots: u.shots.map(s => s.t + " " + s.shot) })) }) : "" });
}

/* ====================== analysis ====================== */
async function analyze() {
  const p = S.cur; if (!p?.script?.text) { toast("ارفع السكربت أو الصقه أولاً."); return; }
  if (!S.sample) { toast("المخرج بيشتغل بس لما تفتح الأداة من claude.ai."); return; }
  let script = p.script.text; if (new TextEncoder().encode(script).length > 52000) { script = script.slice(0, 26000); toast("السكربت طويل كتير؛ رح يتحلّل أول جزء منه. قسّمه لحلقات."); }
  const signal = busyStart("المخرج عم يقرأ السكربت كامل ويحضّر التحليل… (ممكن ياخد دقيقة أو دقيقتين)");
  render();
  try {
    const an = cleanAnalysis(await ask(analysisPrompt(p, script), { signal }));
    const texts = sliceScenes(p.script.text, an.scenes);
    an.scenes.forEach((s, i) => s.text = texts[i] || "");
    p.analysis = an; p.suggState = {};
    if (!p.bible.characters.length && an.characters.length) p.bible.characters = an.characters.map(c => ({ id: nid("c"), name: c.name, en: c.en, look: c.look_en, voice: c.voice_en }));
    persistProject(); toast("اكتمل التحليل");
  } catch (e) { if (e?.code !== "cancelled") toast(errMsg(e)); }
  finally { busyEnd(); render(); }
}
async function suggestStyles() {
  const p = S.cur; if (!S.sample) { toast("المخرج بيشتغل بس لما تفتح الأداة من claude.ai."); return; }
  const signal = busyStart("المخرج عم يفكّر بتلات اتجاهات بصرية…"); render();
  try { const r = await ask(stylePrompt(p), { signal, tier: "default" }); S.styleOpts = arr(r?.options).map(o => ({ name_ar: str(o?.name_ar), why_ar: str(o?.why_ar), style_en: str(o?.style_en) })).filter(o => o.style_en); }
  catch (e) { if (e?.code !== "cancelled") toast(errMsg(e)); }
  finally { busyEnd(); render(); }
}

async function exportWord() {
  const p = S.cur; if (!p) return;
  if (!S.downloads) { toast("التصدير متاح بس داخل claude.ai."); return; }
  const h = [];
  const E = esc;
  h.push(`<h1>${E(p.name)}</h1><p>${E((TYPES[p.type] || {}).ar || "")} · ${E(MODES[p.mode].ar)} · ${E(p.bible.aspect)}</p>`);
  h.push(`<h2>الهوية</h2><p><b>الستايل:</b></p><pre>${E(p.bible.style || "—")}</pre>`);
  if (p.bible.characters.length) h.push("<h3>الشخصيات</h3><ul>" + p.bible.characters.map(c => `<li><b>${E(c.name)}</b> ${E(c.en || "")}: ${E(c.look || "")} ${c.voice ? "— " + E(c.voice) : ""}</li>`).join("") + "</ul>");
  const an = p.analysis;
  if (an) {
    h.push(`<h2>تحليل السكربت</h2><p>${E(an.logline_ar)}</p>`);
    h.push("<h3>المشاهد</h3><ol>" + an.scenes.map(s => `<li><b>${E(s.title_ar)}</b> (${s.est_seconds} ث): ${E(s.summary_ar)}<br><i>${E(s.plan_ar)}</i></li>`).join("") + "</ol>");
    if (an.props.length) h.push("<h3>الأغراض</h3><ul>" + an.props.map(x => `<li><b>${E(x.name_ar)}</b>: ${E(x.states_ar)}</li>`).join("") + "</ul>");
    if (an.gaps.length) h.push("<h3>ثغرات وحلول</h3><ul>" + an.gaps.map(x => `<li>${E(x.issue_ar)} ← ${E(x.fix_ar)}</li>`).join("") + "</ul>");
    if (an.post_production.length) h.push("<h3>عناصر المونتاج</h3><ul>" + an.post_production.map(x => `<li>مشهد ${x.scene}: ${E(x.item_ar)}</li>`).join("") + "</ul>");
  }
  const items = [...S.items].sort((a, b) => a.createdAt - b.createdAt);
  if (items.length) h.push("<h2>البرومبتات</h2>");
  for (const it of items) {
    if (!it.plan) continue;
    const m = modelById(it.input.model);
    h.push(`<h3>${E(it.title)} — ${it.input.out === "video" ? "فيديو" : "صور"} · ${E(m?.name || "")}${it.input.out === "video" ? " · " + it.input.duration + " ث" : ""}</h3><p>${E(it.plan.summary_ar)}</p>`);
    for (const u of it.units) {
      const pu = it.plan.units.find(x => x.n === u.n) || {};
      h.push(`<h4>${it.input.out === "video" ? "المقطع" : "الفريم"} ${u.n}${pu.title_ar ? " · " + E(pu.title_ar) : ""}${pu.duration ? " (" + pu.duration + " ث)" : ""}</h4>`);
      if (pu.images?.length) h.push("<p>الصور بالترتيب: " + pu.images.map(x => E(x.ref) + " = " + E(x.what_ar)).join(" ، ") + "</p>");
      if (u.long) h.push(`<p><b>النسخة الطويلة (${num(u.long.length)} حرف)</b></p><pre>${E(u.long)}</pre>`);
      if (u.short) h.push(`<p><b>النسخة القصيرة (${num(u.short.length)} حرف)</b></p><pre>${E(u.short)}</pre>`);
    }
    if (it.plan.post_production.length) h.push("<p><b>للمونتاج:</b> " + it.plan.post_production.map(x => E(x.when) + ": " + E(x.item_ar)).join(" | ") + "</p>");
  }
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;direction:rtl}pre{direction:ltr;text-align:left;white-space:pre-wrap;font-family:Consolas,monospace;font-size:10pt;background:#f3f3f3;padding:8px}</style></head><body dir="rtl">${h.join("\n")}</body></html>`;
  try { await S.downloads.save({ filename: (p.name || "project").replace(/[\\/:*?"<>|]/g, " ") + ".doc", data: new Blob(["﻿" + doc], { type: "application/msword" }) }); }
  catch (e) { if (e?.code !== "cancelled" && e?.code !== "declined") toast("ما تم التصدير."); }
}

    <div class="grid2">
      <div class="panel card"><h3>طول البرومبتات</h3>
        <div class="row"><label class="f" style="flex:1">حد الصور (أحرف)<input type="number" id="t-image" value="${st.targets.image.split}" min="500" step="100"></label><label class="f" style="flex:1">حد الفيديو (أحرف)<input type="number" id="t-video" value="${st.targets.video.split}" min="500" step="100"></label></div>
        <p class="muted small" style="margin:0">كل برومبت بيطلع بنسختين: وحدة أطول من الحد ووحدة أقصر منه.</p></div>
      <div class="panel card"><h3>عمق تفكير المخرج</h3>${seg("tier", st.tier, [["complex", "أعلى جودة"], ["default", "متوازن وأسرع"]])}<p class="muted small" style="margin:0">«أعلى جودة» بياخد وقت أطول وبيصرف من حدود اشتراكك أكتر.</p></div>
    </div>
    <div><button class="btn" type="button" data-act="resetmodels">رجّع الأدوات للإعدادات الأصلية</button></div>
  </div>`;
}
function saveSettings() { saveSoon("settings", () => save(P.settings(), S.settings).catch(() => {})); }

/* ====================== events ====================== */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  const p = S.cur;
  switch (a) {
    case "home": S.view = "home"; S.cur = null; S.item = null; render(); scrollTo(0, 0); break;
    case "settings": S.view = "settings"; render(); scrollTo(0, 0); break;
    case "theme": { const next = isDark() ? "light" : "dark"; rootEl.setAttribute("data-theme", next); try { localStorage.setItem("dc-theme", next); } catch {} paintTheme(); break; }
    case "stop": S.busy?.ctl.abort(); break;
    case "pickmode": S.newMode = d.mode; S.npType = S.npType || "cinematic"; render(); setTimeout(() => $("#npName")?.focus(), 0); break;
    case "nptype": S.npType = d.type; $("#npType").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.type === d.type)); break;
    case "open": await openProject(d.id); scrollTo(0, 0); break;
    case "tab": S.tab = d.tab; S.confirmDel = null; render(); break;
    case "export": exportWord(); break;
    case "btype": p.type = d.type; persistProject(); render(); break;
    case "baspect": p.bible.aspect = d.v; S.wb.aspect = d.v; persistProject(); render(); break;
    case "bdia": p.bible.dialogue = d.v; persistProject(); render(); break;
    case "bmusic": p.bible.music = d.v === "1"; persistProject(); render(); break;
    case "bsfx": p.bible.sfx = d.v === "1"; persistProject(); render(); break;
    case "bdir": p.bible.director = d.v; persistProject(); render(); break;
    case "suggeststyle": suggestStyles(); break;
    case "usestyle": p.bible.style = S.styleOpts[+d.i].style_en; S.styleOpts = null; persistProject(); toast("اعتمدت الستايل"); render(); break;
    case "useanstyle": p.bible.style = p.analysis.style_options[+d.i].style_en; persistProject(); toast("اعتمدت الستايل"); render(); break;
    case "addchar": p.bible.characters.push({ id: nid("c"), name: "", en: "", look: "", voice: "" }); persistProject(); render(); break;
    case "delchar": p.bible.characters = p.bible.characters.filter(c => c.id !== d.id); persistProject(); render(); break;
    case "charsfromanalysis": {
      const have = new Set(p.bible.characters.map(c => c.name));
      p.analysis.characters.forEach(c => { if (!have.has(c.name)) p.bible.characters.push({ id: nid("c"), name: c.name, en: c.en, look: c.look_en, voice: c.voice_en }); });
      persistProject(); toast("انتقلت الشخصيات لملف الهوية"); break;
    }
    case "upload": ev.preventDefault(); uploadTarget = d.target; $("#imgInput").click(); break;
    case "delimg": {
      const id = d.id; S.images = S.images.filter(i => i.id !== id); if (S.wb) S.wb.refs = S.wb.refs.filter(r => r !== id);
      store.del(P.imgs(p.id) + "/" + id).catch(() => toast("تعذّر حذف الصورة")); render(); break;
    }
    case "toggleref": { const w = S.wb, i = w.refs.indexOf(d.id); if (i >= 0) w.refs.splice(i, 1); else w.refs.push(d.id); render(); break; }
    case "pickscript": $("#scriptInput").click(); break;
    case "replacescript": p.script = null; persistProject(); render(); break;
    case "usepaste": { const t = str($("#scriptPaste")?.value); if (!t) { toast("الصق النص أولاً."); break; } p.script = { name: "نص ملصوق", text: t }; persistProject(); render(); break; }
    case "analyze": analyze(); break;
    case "fsugg": p.suggState = p.suggState || {}; p.suggState[d.i] = p.suggState[d.i] === d.v ? undefined : d.v; persistProject(); render(); break;
    case "toscene": {
      const s = p.analysis.scenes.find(x => x.n === +d.n); const w = S.wb;
      w.scope = "scene"; w.sceneN = s.n; w.text = s.text || (s.title_ar + "\n" + s.summary_ar); w.out = d.out; if (s.est_seconds) w.duration = s.est_seconds;
      S.item = null; S.tab = "wb"; render(); scrollTo(0, 0); break;
    }
    case "wbscope": S.wb.scope = d.v; if (d.v === "shot") { S.wb.vmode = S.wb.vmode === "multi" ? "single" : S.wb.vmode; S.wb.frames = "one"; } else { S.wb.frames = "auto"; } render(); break;
    case "wbout": S.wb.out = d.v; render(); break;
    case "wbvmode": S.wb.vmode = d.v; render(); break;
    case "wbframes": S.wb.frames = d.v; render(); break;
    case "direct": runDirect(); break;
    case "ptab": S.ptab[d.k] = d.v; render(); break;
    case "copy": {
      const u = S.item?.units.find(x => x.n === +d.n); const t = d.v === "custom" ? u?.custom : d.v === "short" ? u?.short : u?.long;
      try { await navigator.clipboard.writeText(t || ""); el.classList.add("done"); el.innerHTML = ICON.copy + " تم النسخ"; setTimeout(() => { el.classList.remove("done"); el.innerHTML = ICON.copy + " نسخ"; }, 1600); }
      catch { const pre = $("#pr-" + d.n); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("النص محدد، انسخه يدوياً"); }
      break;
    }
    case "revise": reviseUnit(+d.n); break;
    case "retry": retryUnit(+d.n); break;
    case "custom": customLimit(+d.n); break;
    case "isugg": { const it = S.item; it.sugg[d.i] = it.sugg[d.i] === d.v ? undefined : d.v; render(); break; }
    case "applysugg": replan(false); break;
    case "replan": replan(true); break;
    case "openitem": {
      const it = S.items.find(x => x.id === d.id); if (!it) break;
      S.item = it; S.wb = { ...freshWb(p), ...clone(it.input), refs: it.refs.map(r => r.id).filter(id => S.images.some(i => i.id === id)) };
      if (it.input.out === "video") S.wb.vidModel = it.input.model; else S.wb.imgModel = it.input.model;
      S.tab = "wb"; render(); setTimeout(() => $("#result")?.scrollIntoView({ block: "start" }), 0); break;
    }
    case "askdelitem": S.confirmDel = d.id; render(); break;
    case "canceldel": S.confirmDel = null; render(); break;
    case "delitem": { const id = d.id; S.items = S.items.filter(x => x.id !== id); if (S.item?.id === id) S.item = null; S.confirmDel = null; store.del(P.items(p.id) + "/" + id).catch(() => toast("تعذّر الحذف")); render(); break; }
    case "addmodel": S.settings.models.push({ id: nid("t"), name: d.kind === "video" ? "أداة فيديو جديدة" : "أداة صور جديدة", kind: d.kind, max: d.kind === "video" ? 10 : 0, notes: "" }); saveSettings(); render(); break;
    case "delmodel": if (S.settings.models.filter(m => m.kind === (modelById(d.id)?.kind)).length <= 1) { toast("لازم تضل أداة وحدة على الأقل من كل نوع."); break; } S.settings.models = S.settings.models.filter(m => m.id !== d.id); saveSettings(); render(); break;
    case "resetmodels": S.settings.models = clone(DEFAULT_MODELS); saveSettings(); render(); toast("رجعت الأدوات للأصل"); break;
    case "tier": S.settings.tier = d.v; saveSettings(); render(); break;
  }
});
document.addEventListener("submit", async ev => {
  if (ev.target.dataset.form !== "newproject") return;
  ev.preventDefault();
  const name = str($("#npName").value);
  try { await createProject(S.newMode, name, S.npType || "cinematic"); S.newMode = null; scrollTo(0, 0); } catch {}
});
document.addEventListener("input", ev => {
  const t = ev.target, p = S.cur;
  if (t.id === "b-name") { p.name = t.value; persistProject(); return; }
  if (t.id === "b-style") { p.bible.style = t.value; persistProject(); return; }
  if (t.id === "b-audience") { p.bible.audience = t.value; persistProject(); return; }
  if (t.id === "b-lang") { p.bible.lang = t.value; persistProject(); return; }
  if (t.id === "b-extra") { p.bible.extra = t.value; persistProject(); return; }
  if (t.dataset.char) { const c = p.bible.characters.find(x => x.id === t.dataset.char); if (c) { c[t.dataset.k] = t.value; persistProject(); } return; }
  if (t.dataset.imglabel) {
    const im = S.images.find(i => i.id === t.dataset.imglabel); if (!im) return; im.label = t.value;
    saveSoon("img" + im.id, () => save(P.imgs(p.id) + "/" + im.id, im).catch(() => {})); return;
  }
  if (t.id === "wb-text") { S.wb.text = t.value; return; }
  if (t.id === "wb-dir") { S.wb.direction = t.value; return; }
  if (t.id === "wb-dur") { S.wb.duration = Math.max(0, Math.round(Number(t.value) || 0)); return; }
  if (t.dataset.model) {
    const m = modelById(t.dataset.model); if (!m) return;
    m[t.dataset.k] = t.dataset.k === "max" ? Math.max(0, Number(t.value) || 0) : t.value; saveSettings(); return;
  }
  if (t.id === "t-image" || t.id === "t-video") {
    const k = t.id === "t-image" ? "image" : "video", v = Math.max(500, Math.round(Number(t.value) || 0)), T = S.settings.targets[k];
    T.split = v; T.longMin = Math.round(v * 1.06); T.longMax = Math.round(v * 1.45); T.shortMax = Math.round(v * 0.95); T.shortMin = Math.round(v * 0.62); saveSettings(); return;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target, w = S.wb;
  if (t.id === "wb-scene") {
    const n = +t.value; w.sceneN = n;
    if (n) { const s = S.cur.analysis.scenes.find(x => x.n === n); w.text = s.text || (s.title_ar + "\n" + s.summary_ar); if (s.est_seconds) w.duration = s.est_seconds; }
    render(); return;
  }
  if (t.id === "wb-vid") { w.vidModel = t.value; render(); return; }
  if (t.id === "wb-img") { w.imgModel = t.value; return; }
  if (t.id === "wb-frames") { w.frames = t.value; return; }
  if (t.id === "wb-aspect") { w.aspect = t.value; return; }
  if (t.id === "wb-link") { w.link = t.checked; return; }
  if (t.id === "wb-dur") { render(); return; }
});
$("#imgInput").addEventListener("change", ev => { const f = ev.target.files; if (f?.length) addImages(f); ev.target.value = ""; });
$("#scriptInput").addEventListener("change", async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  await takeScript(f);
});
async function takeScript(f) {
  if (!/\.(docx|txt)$/i.test(f.name)) { toast(/\.doc$/i.test(f.name) ? "صيغة .doc القديمة مش مدعومة. احفظ الملف بصيغة .docx." : "ارفع ملف DOCX أو TXT."); return; }
  try { const text = await readScriptFile(f); if (!text) throw 0; S.cur.script = { name: f.name, text }; persistProject(); render(); toast("انقرأ السكربت"); }
  catch { toast("تعذّر قراءة الملف. جرّب تلصق النص."); }
}
["dragenter", "dragover"].forEach(e => document.addEventListener(e, ev => { const z = ev.target.closest?.("[data-drop]"); if (z) { ev.preventDefault(); z.classList.add("over"); } }));
["dragleave", "drop"].forEach(e => document.addEventListener(e, ev => { const z = ev.target.closest?.("[data-drop]"); if (z) { ev.preventDefault(); z.classList.remove("over"); } }));
document.addEventListener("drop", ev => {
  const z = ev.target.closest?.("[data-drop]"); if (!z) return;
  const files = ev.dataTransfer?.files; if (!files?.length) return;
  if (z.dataset.drop === "script") takeScript(files[0]);
  else { uploadTarget = z.dataset.drop; addImages(files); }
});

/* ====================== boot ====================== */
paintTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintTheme);
render();
(async () => {
  const use = n => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [sample, db, user, downloads] = await Promise.all([use("sample"), use("db"), use("user"), use("downloads")]);
  S.sample = sample; S.db = db; S.downloads = downloads;
  if (sample) S.limits = await sample.limits().catch(() => null);
  if (user) S.uid = await user.id().catch(() => null);
  if (db && S.uid) store = dbStore(db);
  else S.storeNote = "الحفظ الدائم غير متاح بهالعرض، فالشغل رح يضيع لما تسكّر الصفحة. افتح الأداة من claude.ai وأنت مسجّل دخول.";
  await loadAll();
  S.ready = true; render();
})();
})();
</script>
